[wheel]
# #384 wheel-shadow. Verified per docs/rig-runbook.md 2.1.
dist = "sglang-kernel"
version = "0.4.4"
must_import = ["sgl_kernel"]

[plan]
# "pinned" once a plan is recorded with `turnkey plan-pin`. Until then
# "solve" is honest: it contributes no flags and says so, rather than
# refusing on a pin that was never written.
mode = "solve"
path = "/etc/htsglang/plan.ship.json"

[preflight]
host_headroom_gib = 15
card_busy_mib = 512

[preflight.disk_free_gib]
"/spinning" = 40

[watchdog]
poll_s = 20
generation_probe_s = 120
# Reconciled with the server's own health budget: /health may take
# SGLANG_HEALTH_CHECK_TIMEOUT (default 20 s). The generation probe is
# a /generate call with its own explicit budget, well clear of it.
generation_timeout_s = 60
wedge_confirmations = 3
backoff_s = [30, 60, 120, 300, 600]
max_restarts = 5
restart_window_s = 3600

[serving.ship]
port = 30030
cards = [0, 1, 2]
boot_log = "/var/log/htsglang/ship.boot.log"
# A cold JIT cache makes the first boot minutes long (#172/#615).
ready_timeout_s = 1800
argv = [
  "/spinning/htsglang-gpu/.venv/bin/python",
  "-m",
  "sglang.launch_server",
  "--model-path",
  "/spinning/llm_stuff/club-3090/models-cache/Qwen3.6-27B-INT8-W8A8-yarn1.5",
