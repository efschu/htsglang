[stack]
name = "rig3"
repo = "/spinning/htsglang-gpu"
venv = "/spinning/htsglang-gpu/.venv"
log_dir = "/var/log/htsglang"
# /spinning/htsglang-gpu is itself a worktree of /spinning/htsglang.
# Acknowledged deliberately rather than defaulted: it is the long-lived
# stack root (it holds the venv and the installed router unit already
# names it), unlike the ephemeral wt-* worktrees agents create and
# delete. A worktree whose gitdir has gone is still refused outright.
allow_worktree = true

# Environment carried from the captured ship process. PYTHONPATH,
# CUDA_VISIBLE_DEVICES, SGLANG_PHASE_FLIP_INSTANCE and
# SGLANG_BOOT_COMMIT are deliberately absent: the first two are derived
# from [stack].repo and the card list, the last two are per-boot
# identities synthesized by the orchestrator.
[env]
LD_LIBRARY_PATH = ":/usr/local/cuda-12.2/lib64"
SGLANG_BARLINK = "1"
SGLANG_BARLINK_BAR1_CAP_CYCLES = "300000000000"
SGLANG_BARLINK_BAR1_WINDOW_MIB = "24"
SGLANG_BARLINK_BAR1_WINDOW_MIB_FLIP_DCP_0 = "32"
SGLANG_BARLINK_BAR1_WINDOW_MIB_FLIP_TP_0 = "48"
SGLANG_BARLINK_BAR1_WINDOW_MIB_PP_0 = "96"
SGLANG_BARLINK_TRANSPORT = "bar1"
SGLANG_COLLECTIVE_CENSUS_INTERVAL = "50"
SGLANG_CORRIDOR_FLOOR_MIB = "1536"
SGLANG_CORRIDOR_REBALANCE = "0"
SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK = "0"
SGLANG_FLIP_SEAM_CHUNK_MIB = "8"
SGLANG_KV_BACKING_RELIEF = "1"
SGLANG_MAMBA_PIN_TRACE = "50"
SGLANG_MAMBA_SSM_DTYPE = "bfloat16"
SGLANG_PHASE_POLICY_MIN_DWELL_S = "3"
SGLANG_PHASE_POLICY_PP_WINDOW_S = "15"
SGLANG_PHASE_POLICY_TP_DECODE_FLOOR_S = "10"
SGLANG_SEAM_ENTRY_DELAY_BUDGET = "2"
SGLANG_SEAM_ENTRY_MARGIN_MIB = "512"
SGLANG_UNEVEN_DCP = "1"
SGLANG_UNEVEN_DCP_WEIGHTED = "1"
SGLANG_UNEVEN_TOKEN_VECTOR = "14,10,8"
SGLANG_VRAM_FLIGHT_DIR = "/spinning/flight_605"

# Cards in RANK ORDER, taken from the capture's CUDA_VISIBLE_DEVICES.
# Addressed by UUID only: NVML index and CUDA ordinal are different
# orderings of the same hardware and both move across reboots.
