<!--
  Live interview copilot (#502).

  Target platform is the DESKTOP browser (Chrome), because tab audio capture
  exists nowhere else. Two capture chains run at once and never mix:

    mic  -> getUserMedia    -> AudioWorklet -> 16 kHz PCM16 -> track "self"
    tab  -> getDisplayMedia -> AudioWorklet -> 16 kHz PCM16 -> track "other"

  Both feed ONE WebSocket; every binary frame carries a 4-byte header
  (track, codec, seq16) so the server can attribute it. That header is the one
  deliberate protocol difference from the #466 translator, which has a single
  source and therefore sends bare frames.

  Utterance boundaries are decided HERE: the runtime implements no server-side
  VAD, so a silence timer per track sends an explicit commit.

  THE PANE IS AN INSTRUMENT, NOT A LOG. Three things are always on screen for
  a reason:
    * per-track capture state (off / silent / speaking) with a live level, so a
      dead capture chain can never look like a quiet room;
    * the read pane's live card, which shows THINKING with a running counter
      while a decode is out, so a slow answer is never confused with a freeze;
    * line -> suggestion latency, measured on the client from the moment the
      transcript line was RENDERED to the moment the suggestion was RENDERED,
      alongside the server's own pipeline figure. Two clocks, both named.
-->
<style>

  #lat b { color:#cfcfda; font-weight:600; }

<header>
  <h1>interview copilot</h1>
  <button id="mic">start microphone</button>
  <button id="tab">capture tab audio</button>
  <button id="brief">briefing</button>
  <span id="conn">connecting…</span>
  <div id="lat">line&rarr;hint <b id="latC">–</b> client · <b id="latS">–</b> server</div>
</header>
<div id="stub">STUB BACKEND — transcript and suggestions are synthetic, not a model and not a transcription</div>
<div id="tracks"></div>
<div id="topics"></div>
<main>
  <section id="hints"><h2>suggestions — read, do not say</h2><div id="cards"></div></section>
  <section id="transcript"><h2>transcript</h2><div id="lines"></div></section>
</main>
<div id="drawer">
  <div class="row">
    <strong style="font-size:12px">briefing</strong>
    <button id="briefLoad">load briefing</button>
    <button id="briefFetch">reload from server</button>
    <span id="briefState" style="font:11px ui-monospace,monospace;color:#7a7a8a"></span>
  </div>
  <textarea id="briefText" spellcheck="false" placeholder="# Briefing&#10;&#10;## Topic&#10;What you already know…"></textarea>
  <div id="sections"></div>
</div>

<script>
const BUILD = "__CLIENT_BUILD__";
const PIPELINE_RATE = 16000;
const FRAME_MS = 20;
const FRAME_SAMPLES = PIPELINE_RATE * FRAME_MS / 1000;   // 320
const TRACK_CODE = { self: 0, other: 1 };
const CODEC_PCM16 = 0;
// Silence longer than this closes an utterance. The runtime has no
// server-side VAD, so this timer is the only thing that ever commits.
const SILENCE_MS = 700;
const SILENCE_RMS = 0.006;
// No event at all for this long while a track is capturing means something is
// wrong upstream. Saying so is the whole difference between honest degradation
// and a frozen pane.
const STALL_MS = 6000;
const MAX_HISTORY = 40;

const el = (id) => document.getElementById(id);
const ui = {
  conn: el("conn"), latC: el("latC"), latS: el("latS"), stub: el("stub"),
  tracks: el("tracks"), topics: el("topics"), cards: el("cards"),
  lines: el("lines"), drawer: el("drawer"), briefText: el("briefText"),
  briefState: el("briefState"), sections: el("sections"),
  mic: el("mic"), tab: el("tab"), brief: el("brief"),
};

let ws = null, cursor = 0, sessionId = null, attempt = 0, seq = 0;
let lastEventAt = performance.now();
let connState = "init";
const captures = {};       // track -> capture state
const trackRows = {};      // track -> {row, st, bar, n}
const renderedAt = {};     // source key -> performance.now() when rendered
const partialEls = {};     // track -> live partial line element
const samplesClient = [];  // measured client-side line -> hint, ms
const samplesServer = [];  // server-reported pipeline_ms
const seenSeq = new Set();
let liveCard = null, pendingT0 = null, pendingTimer = null, pendingInfo = null;

// ------------------------------------------------------------------ plumbing

function sys(text, cls) {
  const div = document.createElement("div");
  div.className = "sys" + (cls ? " " + cls : "");
  div.textContent = text;
  ui.lines.appendChild(div);
  ui.lines.parentElement.scrollTop = ui.lines.parentElement.scrollHeight;
}

function setConn(state, text) {
  connState = state;
  ui.conn.className = state === "live" ? "live" : state === "down" ? "down" : "wait";
  ui.conn.textContent = text;
}

function pct(list) {
  if (!list.length) return null;
  const s = [...list].sort((a, b) => a - b);
  return { p50: s[Math.floor(s.length / 2)], max: s[s.length - 1], n: s.length };
}

function renderLatency() {
  const c = pct(samplesClient), s = pct(samplesServer);
  ui.latC.textContent = c ? `${c.p50.toFixed(0)}/${c.max.toFixed(0)} ms (n=${c.n})` : "–";
  ui.latS.textContent = s ? `${s.p50.toFixed(0)}/${s.max.toFixed(0)} ms (n=${s.n})` : "–";
}

// ---------------------------------------------------------------- transport

function connect() {
  const base = location.pathname.replace(/\/$/, "");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}${base}/api/copilot/stream`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    setConn("wait", "handshaking…");
    send({ kind: "hello", session_id: sessionId, resume_from: cursor, build: BUILD });
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    lastEventAt = performance.now();
    // Only a JOURNALLED event carries `seq`; the cursor must never be advanced
    // by a transient frame. `next_seq` is the resume cursor and is a different
    // field on purpose -- conflating the two loses one event per reconnect.
    if (typeof msg.seq === "number") {
      if (seenSeq.has(msg.seq)) return;   // replay overlap: render once
      seenSeq.add(msg.seq);
      if (msg.seq >= cursor) cursor = msg.seq + 1;
    }
    onEvent(msg);
  };
  ws.onclose = () => {
    stopPending("connection lost");
    const delay = Math.min(500 * Math.pow(1.7, attempt++), 15000);
    setConn("down", `offline — retrying in ${(delay / 1000).toFixed(1)}s`);
    setTimeout(connect, delay);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function sendAudio(track, pcm16) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;   // drop, never queue
  const buf = new ArrayBuffer(4 + pcm16.byteLength);
  const view = new DataView(buf);
  view.setUint8(0, TRACK_CODE[track]);
  view.setUint8(1, CODEC_PCM16);
  view.setUint16(2, seq++ & 0xffff, true);
  new Uint8Array(buf, 4).set(new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength));
  ws.send(buf);
  const st = captures[track];
  if (st) st.frames++;
}

// ------------------------------------------------------------------- events

function onEvent(msg) {
  switch (msg.kind) {
    case "session.ready":       onReady(msg); break;
    case "session.state":       if (msg.topics) renderTopics(msg.topics); break;
    case "resume.gap":
      sys(`events ${msg.requested}–${msg.floor - 1} were dropped from the journal while offline`, "warn");
      break;
    case "transcript.delta":    onPartial(msg); break;
    case "transcript.line":     onLine(msg); break;
    case "hint.pending":        onPending(msg); break;
    case "hint":                onHint(msg); break;
    case "topic.state":         onTopicState(msg); break;
    case "briefing.update":     onBriefing(msg); break;
    case "track.state":
      setTrackState(msg.track, msg.state === "open" ? "silent" : "off");
      break;
    case "error":               onError(msg); break;
    case "pong":                break;
  }
}

function onReady(msg) {
  sessionId = msg.session_id;
  attempt = 0;
  if (typeof msg.next_seq === "number") cursor = Math.max(cursor, msg.next_seq);
  sessionStorage.setItem("copilot.session", sessionId);
  ui.stub.className = msg.stub ? "on" : "";
  if (msg.topics) renderTopics(msg.topics);
  if (msg.briefing) renderSections(msg.briefing);
  setConn("live", `live · ${msg.backend} · ${sessionId}`);
  if (msg.replayed) {
    sys(`resumed from event ${msg.replay_from}: ${msg.replayed} replayed, `
      + `${msg.lines} transcript lines and ${msg.hints} suggestions kept`);
  }
  // The tracks the SERVER thinks are open. A capture chain that died while the
  // socket was down shows as off here rather than as a quiet room.
  Object.keys(msg.tracks || {}).forEach((t) => {
    if (!captures[t]) setTrackState(t, msg.tracks[t] ? "silent" : "off");
  });
}

function sourceKey(msg) {
  if (msg.source_line_id != null) return "L" + msg.source_line_id;
  if (msg.source_item_id != null) return "I" + msg.source_item_id;
  return null;
}

function onPartial(msg) {
  let node = partialEls[msg.track];
  if (!node) {
    node = document.createElement("div");
    node.className = "line partial " + msg.track + (msg.stub ? " stub" : "");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = msg.track === "self" ? "you" : "them";
    node.appendChild(who);
    node.appendChild(document.createTextNode(""));
    partialEls[msg.track] = node;
    ui.lines.appendChild(node);
  }
  node.lastChild.textContent = msg.text;
  if (msg.item_id != null) renderedAt["I" + msg.item_id] = performance.now();
  ui.lines.parentElement.scrollTop = ui.lines.parentElement.scrollHeight;
}

function onLine(msg) {
  const node = partialEls[msg.track];
  delete partialEls[msg.track];
  const target = node || document.createElement("div");
  target.className = "line " + msg.track + (msg.stub ? " stub" : "");
  target.textContent = "";
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = msg.track === "self" ? "you" : "them";
  target.appendChild(who);
  target.appendChild(document.createTextNode(msg.text));
  if (!node) ui.lines.appendChild(target);
  renderedAt["L" + msg.line_id] = performance.now();
  ui.lines.parentElement.scrollTop = ui.lines.parentElement.scrollHeight;
}

function onPending(msg) {
  const key = sourceKey(msg);
  // Snapshot t0 NOW: later partials of the same utterance would otherwise move
  // the mark and understate the latency this pane is claiming to measure.
  pendingT0 = (key && renderedAt[key]) || performance.now();
  pendingInfo = msg;
  liveCard = document.createElement("div");
  liveCard.className = "card thinking";
  ui.cards.prepend(liveCard);
  paintPending();
  if (pendingTimer) clearInterval(pendingTimer);
  pendingTimer = setInterval(paintPending, 100);
}

function paintPending() {
  if (!liveCard || pendingT0 === null) return;
  const ms = performance.now() - pendingT0;
  liveCard.textContent = "";
  const meta = document.createElement("div");
  meta.className = "meta";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = pendingInfo.topic_id;
  const state = document.createElement("span");
  state.textContent = `thinking · ${ms.toFixed(0)} ms`;
  meta.appendChild(tag);
  meta.appendChild(state);
  liveCard.appendChild(meta);
}

function stopPending(why) {
  if (pendingTimer) { clearInterval(pendingTimer); pendingTimer = null; }
  if (liveCard) {
    liveCard.className = "card failed";
    const note = document.createElement("div");
    note.textContent = why;
    liveCard.appendChild(note);
    liveCard = null;
  }
  pendingT0 = null;
}

function onHint(msg) {
  if (pendingTimer) { clearInterval(pendingTimer); pendingTimer = null; }
  const key = sourceKey(msg);
  const t0 = pendingT0 !== null ? pendingT0 : (key && renderedAt[key]) || null;
  const e2e = t0 !== null ? performance.now() - t0 : null;
  pendingT0 = null;
  // A REPLAYED hint is not a measurement. Its source line was rendered
  // milliseconds ago during the same replay, so sampling it would report the
  // speed of the recovery instead of the speed of the pipeline -- a latency
  // display that flatters itself after every reconnect is worse than none.
  if (!msg.replay) {
    if (e2e !== null) samplesClient.push(e2e);
    if (typeof msg.pipeline_ms === "number") samplesServer.push(msg.pipeline_ms);
    renderLatency();
  }

  const card = liveCard || document.createElement("div");
  liveCard = null;
  card.className = "card live" + (msg.stub ? " stubbed" : "");
  card.textContent = "";
  const meta = document.createElement("div");
  meta.className = "meta";
  const parts = [
    ["tag", msg.topic_id],
    [msg.warmth, `${msg.warmth} ${msg.cached_tokens ?? "?"}/${msg.primed_tokens ?? "?"}`],
    ["", e2e !== null ? `${e2e.toFixed(0)} ms rendered` : "latency unknown"],
    ["", `${(msg.pipeline_ms ?? 0).toFixed(0)} ms server`],
    ["", `from ${msg.source_kind} ${msg.source_line_id ?? msg.source_item_id ?? "?"}`],
  ];
  parts.forEach(([cls, text]) => {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    meta.appendChild(span);
  });
  card.appendChild(meta);
  const ul = document.createElement("ul");
  (msg.bullets || []).forEach((b) => {
    const li = document.createElement("li");
    li.textContent = b;
    ul.appendChild(li);
  });
  card.appendChild(ul);
  if (!card.parentElement) ui.cards.prepend(card);
  // The newest card stays on top and the previous ones lose their live styling,
  // so the pane reads as one continuously updating surface rather than a log.
  Array.from(ui.cards.children).forEach((n, i) => {
    if (i > 0) n.classList.remove("live");
    if (i >= MAX_HISTORY) n.remove();
  });
}

function onTopicState(msg) {
  if (msg.topics) renderTopics(msg.topics);
  if (msg.reason === "focus") {
    sys(`topic → ${msg.title || msg.topic_id}: `
      + (msg.prepared ? "context prepared" : "context NOT prepared, first suggestion pays prefill")
      + ` (switch ${(msg.switch_ms ?? 0).toFixed(1)} ms)`, msg.prepared ? null : "warn");
  }
  if (msg.reason === "prep" && (msg.evicted || []).length) {
    sys(`prepared context evicted: ${msg.evicted.join(", ")}`, "warn");
  }
  if (msg.reason === "primed" && (msg.evicted || []).length) {
    sys(`preparing ${msg.topic_id} evicted: ${msg.evicted.join(", ")}`, "warn");
  }
}

function onBriefing(msg) {
  if (msg.topics) renderTopics(msg.topics);
  if (msg.briefing) renderSections(msg.briefing);
  if (typeof msg.markdown === "string") {
    ui.briefText.value = msg.markdown;
    ui.briefState.textContent = `loaded · ${msg.briefing?.briefing_id ?? ""}`;
  }
  if (msg.reason === "expanded") {
    sys(`briefing extended in the background: “${msg.added_title}”`);
    ui.briefState.textContent = `extended · ${msg.briefing_id}`;
    // Keep the editor honest: the server appended, so what the user is looking
    // at is now stale. Ask for the current document instead of guessing it.
    if (ui.drawer.classList.contains("on")) send({ kind: "briefing.get" });
  }
  if (msg.reason === "nothing-new") {
    sys("background expander: nothing new since the last round");
  }
}

function onError(msg) {
  const bad = msg.stage === "hint" || msg.stage === "transport" || msg.degraded;
  if (msg.stage === "hint") stopPending(`suggestion failed: ${msg.message}`);
  sys(`${msg.stage}: ${msg.message}`, bad ? "bad" : "warn");
}

// ------------------------------------------------------------------- topics

function renderTopics(topics) {
  if (!topics || !topics.length) return;
  ui.topics.textContent = "";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = "prepared topics";
  ui.topics.appendChild(lbl);
  topics.forEach((t) => {
    const span = document.createElement("span");
    span.className = "topic " + (t.warmth || "unknown") + (t.focus ? " focus" : "");
    span.textContent = t.title || t.topic_id;
    span.dataset.topic = t.topic_id;
    const w = document.createElement("span");
    w.className = "w";
    w.textContent = `${t.warmth} ${t.cached_tokens ?? "-"}/${t.primed_tokens ?? "-"}`;
    span.appendChild(w);
    span.onclick = () => send({ kind: "topic.focus", topic_id: t.topic_id });
    ui.topics.appendChild(span);
  });
}

function renderSections(briefing) {
  ui.sections.textContent = "";
  (briefing.sections || []).forEach((s) => {
    const span = document.createElement("span");
    span.className = "sec" + (s.generated ? " gen" : "");
    span.textContent = s.title;
    span.title = s.provenance || "";
    ui.sections.appendChild(span);
  });
}

// ------------------------------------------------------------------- tracks

function trackRow(track) {
  if (trackRows[track]) return trackRows[track];
  const row = document.createElement("div");
  row.className = "trk off " + track;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = track === "self" ? "you" : "them";
  const st = document.createElement("span");
  st.className = "st";
  st.textContent = "off";
  const meter = document.createElement("span");
  meter.className = "meter";
  const bar = document.createElement("i");
  meter.appendChild(bar);
  const n = document.createElement("span");
  n.className = "n";
  n.textContent = "0 fr";
  row.append(who, st, meter, n);
  ui.tracks.appendChild(row);
  trackRows[track] = { row, st, bar, n };
  return trackRows[track];
}

function setTrackState(track, state) {
  const r = trackRow(track);
  r.row.className = "trk " + track + " " + state;
  r.st.textContent = state;
  if (state === "off") r.bar.style.width = "0";
}

function paintLevel(track, rms, frames) {
  const r = trackRow(track);
  r.bar.style.width = Math.min(100, Math.sqrt(rms) * 240).toFixed(1) + "%";
  r.n.textContent = frames + " fr";
}

// ------------------------------------------------------------------ capture

const WORKLET_SRC = `
class Cap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('cap', Cap);
`;

async function startCapture(track, stream) {
  // Ask for the pipeline rate directly; Chrome resamples the stream into the
  // context. When the request is refused the box-average path below decimates
  // instead, so the wire format is 16 kHz either way.
  let ctx;
  try { ctx = new AudioContext({ sampleRate: PIPELINE_RATE }); }
  catch { ctx = new AudioContext(); }
  await ctx.audioWorklet.addModule(URL.createObjectURL(
    new Blob([WORKLET_SRC], { type: "application/javascript" })));
  const node = new AudioWorkletNode(ctx, "cap");
  const src = ctx.createMediaStreamSource(stream);
  src.connect(node);
  // The graph MUST reach a destination or Chrome hands the worklet silent
  // input buffers: process() still runs at the right rate, so frames keep
  // leaving at 50/s and only their CONTENT is zeros -- a capture chain that
  // looks alive by every counter and transcribes nothing. Measured on
  // Chrome 150 headless: RMS 7e-7 unconnected, 0.185 through this sink.
  // The gain is hard zero, so nothing is played back and tab audio can never
  // be re-emitted into the room by this page.
  const sink = ctx.createGain();
  sink.gain.value = 0;
  node.connect(sink);
  sink.connect(ctx.destination);

  const state = {
    ctx, node, stream, carry: [], silentSince: null,
    spoke: false, frames: 0, speaking: false,
  };
  captures[track] = state;
  send({ kind: "track.open", track: track });
  setTrackState(track, "silent");

  const ratio = ctx.sampleRate / PIPELINE_RATE;
  node.port.onmessage = (ev) => {
    const input = ev.data;
    let out;
    if (ratio === 1) {
      out = input;
    } else {
      const outLen = Math.floor(input.length / ratio);
      out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
        let sum = 0, n = 0;
        for (let j = start; j < end && j < input.length; j++) { sum += input[j]; n++; }
        out[i] = n ? sum / n : 0;
      }
    }
    let rms = 0;
    for (let i = 0; i < out.length; i++) rms += out[i] * out[i];
    rms = Math.sqrt(rms / Math.max(1, out.length));

    for (let i = 0; i < out.length; i++) state.carry.push(out[i]);
    while (state.carry.length >= FRAME_SAMPLES) {
      const chunk = state.carry.splice(0, FRAME_SAMPLES);
      const pcm = new Int16Array(FRAME_SAMPLES);
      for (let i = 0; i < FRAME_SAMPLES; i++) {
        const s = Math.max(-1, Math.min(1, chunk[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      sendAudio(track, pcm);
    }
    state.lastRms = rms;
    paintLevel(track, rms, state.frames);

    const now = performance.now();
    if (rms < SILENCE_RMS) {
      if (state.silentSince === null) state.silentSince = now;
      if (state.speaking && now - state.silentSince > 200) {
        state.speaking = false;
        setTrackState(track, "silent");
      }
      if (now - state.silentSince > SILENCE_MS && state.spoke) {
        state.spoke = false;
        send({ kind: "commit", track: track });
      }
    } else {
      state.silentSince = null;
      state.spoke = true;
      if (!state.speaking) { state.speaking = true; setTrackState(track, "speaking"); }
    }
  };
}

function stopCapture(track) {
  const state = captures[track];
  if (!state) return;
  state.stream.getTracks().forEach((t) => t.stop());
  state.ctx.close();
  delete captures[track];
  setTrackState(track, "off");
  send({ kind: "track.close", track: track });
}

ui.mic.onclick = async () => {
  if (captures.self) {
    stopCapture("self");
    ui.mic.classList.remove("on");
    ui.mic.textContent = "start microphone";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    await startCapture("self", stream);
    ui.mic.classList.add("on");
    ui.mic.textContent = "stop microphone";
  } catch (e) {
    sys("microphone denied: " + e.name + " " + e.message, "bad");
  }
};

ui.tab.onclick = async () => {
  if (captures.other) {
    stopCapture("other");
    ui.tab.classList.remove("on");
    ui.tab.textContent = "capture tab audio";
    return;
  }
  try {
    // Chrome requires video to be requested even when only audio is wanted,
    // and only offers the "share tab audio" checkbox for a TAB share.
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    stream.getVideoTracks().forEach((t) => t.stop());
    if (stream.getAudioTracks().length === 0) {
      sys("that share carries no audio — pick a TAB and tick 'share tab audio'", "bad");
      return;
    }
    await startCapture("other", new MediaStream(stream.getAudioTracks()));
    ui.tab.classList.add("on");
    ui.tab.textContent = "stop tab capture";
  } catch (e) {
    sys("tab capture cancelled: " + e.name + " " + e.message, "warn");
  }
};

// ------------------------------------------------------------------ briefing

ui.brief.onclick = () => {
  const on = ui.drawer.classList.toggle("on");
  if (on && !ui.briefText.value) send({ kind: "briefing.get" });
};
el("briefLoad").onclick = () => {
  send({ kind: "briefing.set", text: ui.briefText.value });
  ui.briefState.textContent = "sent";
};
el("briefFetch").onclick = () => send({ kind: "briefing.get" });

// ------------------------------------------------------------------ watchdog

setInterval(() => {
  send({ kind: "ping" });
}, 15000);

setInterval(() => {
  if (connState !== "live") return;
  const capturing = Object.keys(captures).length > 0;
  const quiet = performance.now() - lastEventAt;
  if (capturing && quiet > STALL_MS) {
    setConn("wait", `stalled — no event for ${(quiet / 1000).toFixed(0)}s`);
  } else if (ui.conn.textContent.startsWith("stalled") && quiet < STALL_MS) {
    setConn("live", `live · ${sessionId}`);
  }
}, 500);

trackRow("self");
trackRow("other");
sessionId = sessionStorage.getItem("copilot.session");
// Diagnostic surface. Named, read-only by convention, and the thing the
// acceptance harness reads instead of scraping the DOM: a pane that claims a
// latency must be able to hand over the samples behind it.
window.copilot = {
  levels: () => Object.fromEntries(Object.entries(captures).map(([t, s]) =>
    [t, { rms: s.lastRms ?? 0, frames: s.frames, speaking: s.speaking,
          ctxRate: s.ctx.sampleRate }])),
  latency: () => ({ client: pct(samplesClient), server: pct(samplesServer) }),
  status: () => ({ conn: connState, cursor, session: sessionId,
                   lines: document.querySelectorAll("#lines .line").length,
                   cards: document.querySelectorAll(".card").length,
                   quietMs: performance.now() - lastEventAt }),
};
renderLatency();
connect();
</script>
