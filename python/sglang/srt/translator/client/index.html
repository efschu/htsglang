<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>live translator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d12" id="themecolor">
<!--
  The whole client: one file, no build system, no external asset.

  It must load over the tunnel with no internet route available, which rules
  out every CDN and every bundler output. It also has to survive a mobile
  network that drops: the connection layer at the bottom reconnects with
  backoff and resumes the journal from the last sequence it processed, so a
  dropout costs the current utterance and nothing else.

  Microphone capture goes through getUserMedia with echo cancellation, gain
  control and noise suppression enabled. That is the reason this is a browser
  client rather than a native one for the MVP: it dissolves the loudspeaker to
  microphone feedback loop that half-duplex playback would otherwise create,
  for free, on every platform.

  SURFACE (design 19.3). The layout follows what the established mobile live
  translators converged on, because those patterns are not taste -- they are
  what survives being used outdoors, one-handed, by two people sharing one
  phone:

    * two large language buttons with a swap control, never a multi-select
      list in the header (Google Translate, DeepL, iTranslate all do this);
    * one conversation stream of bubbles, sided by language, coloured per
      speaker, with the translation as the large text and the original kept
      underneath so it stays verifiable;
    * one unmistakable speaking control at the thumb, with the recording
      state visible without reading a word;
    * everything that is not needed mid-conversation -- modes, routing,
      enrolment, diagnostics, reset -- behind one settings sheet.

  Nothing was dropped in the move: tap-toggle, per-speaker buttons, the
  uncertainty badges with their candidates, long-press rename and delete,
  name-suggestion chips, the bilingual transcript with auto-scroll, the queue
  and connection state, the null-frame and sound-blocked notices and the build
  identity are all still here, rearranged.
-->
<style>
  /* ---------------------------------------------------------------------
     Tokens. Two themes, because this app is used outdoors in daylight and
     again at a table in the evening; one of the two is unreadable in the
     other's conditions. The light theme is deliberately high-contrast rather
     than pretty -- it has to win against the sun.
     --------------------------------------------------------------------- */
  :root {
    --bg:#0b0d12; --surface:#151922; --surface2:#1d2330; --line:#2a3242;
    --fg:#f2f5fa; --dim:#98a3b8; --accent:#4da3ff; --accent-ink:#04203f;
    --ok:#35c26b; --warn:#ffb020; --bad:#ff6060;
    --radius:16px; --tap:52px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f2; --line:#c3ccdc;
    --fg:#0d1219; --dim:#4d576e; --accent:#0a56c4; --accent-ink:#ffffff;
    --ok:#0c7a3c; --warn:#8a5000; --bad:#b81f1f;
    color-scheme: light;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    overscroll-behavior:none; -webkit-text-size-adjust:100%;
  }
  /* Every control is a touch target first. The long-press hardening is kept
     from the previous surface: Android reads a long press on a normal element
     as "select text", which cancels the press and leaves the user holding a
     selection handle instead of recording. All four properties are needed. */
  button, .tap {
    font:inherit; color:var(--fg); background:var(--surface2);
    border:1px solid var(--line); border-radius:12px;
    min-height:var(--tap); padding:0 14px; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  button:active { filter:brightness(1.25); }
  button[disabled] { opacity:.45; }
  button.icon { min-width:var(--tap); padding:0; }
  button.ghost { background:transparent; }
  button.small { min-height:38px; padding:0 10px; font-size:14px; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button.primary { background:var(--accent); color:var(--accent-ink);
                   border-color:var(--accent); font-weight:600; }
  svg { width:22px; height:22px; flex:0 0 auto; display:block; }
  .grow { flex:1; }
  .row { display:flex; gap:8px; align-items:center; }
  .wrap { flex-wrap:wrap; }

  /* --- header ---------------------------------------------------------- */
  header { display:flex; gap:8px; align-items:center; padding:8px 10px;
           padding-top:calc(8px + env(safe-area-inset-top));
           border-bottom:1px solid var(--line); background:var(--surface); }
  /* The state pill truncates rather than pushing the settings button off the
     screen: a long state word must never cost the user a control. */
  .pill { display:inline-flex; align-items:center; gap:7px; height:34px;
          padding:0 11px; border-radius:17px; background:var(--surface2);
          font-size:13px; font-weight:600; letter-spacing:.01em;
          white-space:nowrap; min-width:0; overflow:hidden;
          /* The STATE never truncates -- it is the one word the header
             exists for. The link reading yields instead; it was the state
             that shrank to "spea..." while "2 ms - 16 kHz" kept its room. */
          flex:0 0 auto; }
  .pill > span { overflow:hidden; text-overflow:ellipsis; }
  #link { flex:0 1 auto; }
  .pill.quiet { font-weight:400; color:var(--dim); }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--dim);
         flex:0 0 auto; }
  body[data-state="ready"]      #dot { background:var(--ok); }
  body[data-state="speaking"]   #dot { background:var(--ok); }
  body[data-state="recording"]  #dot { background:var(--bad);
                                       animation:pulse 1.1s infinite; }
  body[data-state="working"]    #dot,
  body[data-state="queued"]     #dot,
  body[data-state="connecting"] #dot { background:var(--warn);
                                       animation:pulse 1.4s infinite; }
  body[data-state="offline"]    #dot,
  body[data-state="blocked"]    #dot,
  body[data-state="nomic"]      #dot { background:var(--bad); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }

  /* --- banners --------------------------------------------------------- */
  .banner { display:none; padding:10px 12px; font-size:13.5px; line-height:1.4;
            border-bottom:1px solid var(--line); }
  .banner.on { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #demo { background:#4a3a12; color:#ffd479; }
  :root[data-theme="light"] #demo { background:#fff3cd; color:#5c4400; }
  #demo b { color:inherit; font-weight:700; }
  #blocked { background:var(--bad); color:#fff; }
  #blocked button { background:#fff; color:#000; border-color:#fff;
                    min-height:40px; font-weight:600; }

  /* --- language bar ---------------------------------------------------- */
  /* The pattern every established client uses: the two languages ARE the
     control, side by side, with a swap between them. The old header
     multi-select is gone; picking a language is a full-width sheet with rows
     big enough to hit while walking. */
  #langbar { display:flex; gap:8px; align-items:stretch; padding:10px;
             border-bottom:1px solid var(--line); background:var(--surface); }
  /* Scoped to the bar on purpose: `lang` is also the per-bubble language
     chip, and an unscoped rule stretched every one of those into a 58 px
     block across the conversation. */
  #langbar .lang {
    flex:1 1 0; min-width:0; min-height:58px; border-radius:14px;
    background:var(--surface2); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1px; padding:6px 8px;
  }
  #langbar .lang .name { font-size:17px; font-weight:650; max-width:100%;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #langbar .lang .code { font-size:11px; color:var(--dim); letter-spacing:.12em;
                text-transform:uppercase; }
  #langbar .lang.mine { border-color:var(--accent); }
  #langbar .lang.mine .code { color:var(--accent); }
  #langbar .swap, #langbar .addlang { flex:0 0 auto; min-width:46px;
                                      border-radius:14px; }

  /* --- conversation ---------------------------------------------------- */
  main {
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:12px 10px 4px; display:flex; flex-direction:column; gap:10px;
  }
  .line {
    max-width:92%; align-self:flex-start; background:var(--surface);
    border:1px solid var(--line); border-left:4px solid var(--sp,var(--dim));
    border-radius:4px var(--radius) var(--radius) var(--radius);
    padding:9px 12px 10px;
  }
  .line[data-side="right"] {
    align-self:flex-end; border-left:1px solid var(--line);
    border-right:4px solid var(--sp,var(--dim));
    border-radius:var(--radius) 4px var(--radius) var(--radius);
    background:var(--surface2);
  }
  .line .meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
                font-size:12px; color:var(--dim); margin-bottom:5px; }
  .avatar { width:20px; height:20px; border-radius:50%; flex:0 0 auto;
            background:var(--sp,var(--dim)); color:#000; font-size:11px;
            font-weight:700; display:inline-flex; align-items:center;
            justify-content:center; font-style:normal; }
  .line .who { font-weight:650; color:var(--fg); font-size:12.5px; }
  .tag { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
         padding:2px 6px; border-radius:6px; background:var(--surface2);
         border:1px solid var(--line); color:var(--dim); }
  .line[data-side="right"] .tag { background:var(--surface); }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .tag.ok { color:var(--ok); border-color:var(--ok); }
  /* The translation is the large text -- it is what the listener consumes.
     The original stays underneath, because it is the only thing the speaker
     can check the translation against; hiding it made the record
     unverifiable. Per line it can be folded away (design 17.2). */
  .line .dst { font-size:20px; line-height:1.35; font-weight:600; }
  .line .dst .tr { margin-top:2px; }
  .line .dst .tr .code { font-size:11px; color:var(--dim); font-weight:600;
                         letter-spacing:.1em; text-transform:uppercase;
                         margin-right:6px; }
  .line .dst.waiting { font-size:14px; font-weight:500; color:var(--warn);
                       font-style:italic; }
  .line .src { font-size:14.5px; color:var(--dim); margin-top:6px;
               padding-top:6px; border-top:1px dashed var(--line); }
  .line.folded .src { display:none; }
  .line.notice { align-self:center; max-width:100%; background:transparent;
                 border:0; color:var(--dim); font-size:12.5px;
                 font-style:italic; text-align:center; padding:2px 8px; }
  .line.borrowed .who::after { content:" \00b7 borrowed voice";
                               color:var(--warn); font-weight:400; }
  .line .cands { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .cand { font-size:13px; min-height:40px; padding:0 11px; border-radius:20px;
          background:var(--surface2); }
  .cand.new { border-style:dashed; }
  .line .tools { display:flex; gap:6px; margin-top:8px; }
  .line .tools:empty { display:none; }
  .line .tools button { min-height:36px; padding:0 10px; font-size:12.5px;
                        background:transparent; color:var(--dim); }
  .line .tools svg { width:16px; height:16px; }
  /* An uncertain attribution is visible on the line itself, not only in the
     candidate row: the rail goes dashed, so a scrollback can be skimmed for
     the ones the machine was unsure about. */
  .line.uncertain { border-left-style:dashed; }
  .line.uncertain[data-side="right"] { border-left-style:solid;
                                       border-right-style:dashed; }

  /* --- the "you are not at the bottom" hint ---------------------------- */
  /* A zero-height flow slot so the pill can hover over the last rows of the
     transcript WITHOUT taking layout from it: the moment it appeared as a
     normal block it would shorten the scroll box, which is the exact thing
     `pinBottom()` exists to repair. Deliberately small -- it is a hint that
     something arrived while the reader was reading further up, not an alert. */
  #unreadwrap { position:relative; height:0; }
  #unread { position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
            min-height:32px; padding:0 12px; font-size:12.5px; font-weight:600;
            border-radius:16px; background:var(--accent); color:var(--accent-ink);
            border:0; box-shadow:0 2px 10px rgba(0,0,0,.35); z-index:5;
            white-space:nowrap; }
  #unread[hidden] { display:none; }

  /* --- suggestion chips, toasts ---------------------------------------- */
  #chips, #toasts { display:flex; flex-direction:column; gap:6px; padding:0 10px; }
  #chips:not(:empty), #toasts:not(:empty) { padding-bottom:8px; }
  .chip, .toast { display:flex; gap:8px; align-items:center; font-size:13.5px;
                  border-radius:12px; padding:8px 10px; line-height:1.35; }
  .chip { background:var(--surface2); border:1px solid var(--accent); }
  .chip .text { flex:1; min-width:0; }
  .chip button { min-height:38px; padding:0 12px; font-size:13px; }
  .toast { background:var(--surface2); border:1px solid var(--line);
           color:var(--dim); }
  .toast.err { border-color:var(--bad); color:var(--fg); }
  .toast .text { flex:1; min-width:0; }
  .toast button { min-height:32px; min-width:32px; padding:0 8px;
                  background:transparent; border:0; color:var(--dim); }

  /* --- footer: the speaking controls ----------------------------------- */
  footer { padding:8px 10px calc(10px + env(safe-area-inset-bottom));
           border-top:1px solid var(--line); background:var(--surface);
           display:flex; flex-direction:column; gap:8px; }
  /* One roster entry is a CELL, not a bare button: the delete control has to
     be a button of its own and a button inside a button is not markup. The
     cell also gives the drop highlight something to sit on that is not the
     tap target itself. */
  #speakers { position:relative; display:flex; gap:6px; flex-wrap:wrap; }
  #speakers .sp { position:relative; flex:1 1 auto; min-width:96px;
                  display:flex; }
  #speakers .sp > button.who, #speakers > button.add {
    flex:1 1 auto; min-width:0; min-height:46px; font-size:14.5px; gap:7px;
  }
  /* Room for the delete control, so a long name never runs under it. */
  /* `touch-action:none` FROM THE START, not once the drag is recognised.
     The global button rule sets `manipulation`, which still lets the browser
     claim the gesture as a pan: a few pixels of finger travel during the
     600 ms hold started a scroll, fired `pointercancel`, and the hold timer
     was cleared -- so the merge drag could never begin on a real finger. The
     headless gate missed it by construction, because MOUSE pointers are never
     cancelled by scrolling (`probe_roster_touch.py` is the arm that can).
     Safe here: this button is a tap target in a fixed footer, not inside
     anything the user needs to scroll. */
  #speakers .sp > button.who { padding-right:62px; touch-action:none; }
  #speakers .sp > button.who .lbl { overflow:hidden; text-overflow:ellipsis;
                                    white-space:nowrap; }
  #speakers > button.add { flex:0 0 auto; min-width:52px; }
  #speakers button.armed { border-color:var(--accent); color:var(--accent); }
  #speakers button .avatar { width:18px; height:18px; font-size:10px; }
  /* Deliberately NOT a long press: the long press is the merge drag, and one
     gesture must not mean two destructive things. 30px is under the 52px tap
     minimum on purpose -- it is guarded by a confirmation and it must not
     compete with the speak button it sits on. */
  #speakers .sp > button.x {
    position:absolute; right:3px; top:50%; transform:translateY(-50%);
    min-height:30px; min-width:30px; padding:0; border:0; border-radius:50%;
    background:transparent; color:var(--dim); font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #speakers .sp > button.x:active { color:var(--bad); background:var(--surface2); }
  /* RENAME, and it needs its own control because the gesture it used to live
     behind is gone. Naming a speaker was only ever reachable through the
     600 ms long press into the sheet, and that press now means the merge drag
     -- `bindSpeakerHold` opens the sheet only `if (!canMerge)`, so on a server
     that announces `speaker_merge` the sheet is reachable exclusively by
     starting a drag and dropping it on nobody. That is not an affordance.
     Same shape as the delete control, one slot to its left. */
  #speakers .sp > button.ren {
    position:absolute; right:32px; top:50%; transform:translateY(-50%);
    min-height:30px; min-width:30px; padding:0; border:0; border-radius:50%;
    background:transparent; color:var(--dim); font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #speakers .sp > button.ren:active { color:var(--fg); background:var(--surface2); }
  /* The drag: every OTHER entry is a visible drop zone, and the one under the
     finger is the one that would win. A merge is destructive, so the target
     is never left to be guessed at. */
  #speakers .sp.dragging { opacity:.55; }
  #speakers .sp.dragging > button.who { border-color:var(--accent); }
  #speakers .sp.dropzone > button.who { border-style:dashed;
                                        border-color:var(--dim); }
  #speakers .sp.droptarget > button.who { border-style:solid;
    border-color:var(--ok); color:var(--ok); background:var(--surface2); }
  #speakers.merging .sp, #speakers.merging .sp > button { touch-action:none; }
  /* TAKES NO LAYOUT, and that is the point. As a flow row it pushed the
     footer taller mid-gesture, which moved the drop targets out from under
     the finger already on its way to one -- caught by `probe_roster.py`,
     whose target coordinates are measured before the lift exactly as a user's
     aim is. It floats above the row instead. */
  #speakers .mergehint { position:absolute; left:0; right:0; bottom:100%;
    margin-bottom:4px; font-size:12px; color:var(--accent);
    text-align:center; pointer-events:none; }
  #talk { width:100%; min-height:76px; font-size:19px; font-weight:650;
          border-radius:18px; }
  #talk svg { width:26px; height:26px; }
  #talk.live, #speakers button.live {
    background:#8c2438; border-color:#e0607a; color:#fff;
    animation:pulse 1.1s infinite;
  }
  #activity { visibility:hidden; min-height:22px; font-size:13px;
              font-weight:600; color:var(--warn); display:flex;
              align-items:center; gap:7px; letter-spacing:.01em; }
  #activity.on { visibility:visible; }
  #activity.speaking { color:var(--ok); }
  #activity::before { content:""; width:8px; height:8px; border-radius:50%;
                      background:currentColor; flex:0 0 auto;
                      animation:pulse 1.2s infinite; }
  .line .work.warn { color:var(--warn); border-color:var(--warn); }
  .line .work.ok { color:var(--ok); border-color:var(--ok); }
  /* A clause that is still growing gets a caret, so a line that stops
     mid-sentence reads as "more is coming" rather than as a truncation. */
  .line .tr.growing .txt::after { content:"\258f"; color:var(--accent);
                                  animation:pulse .9s infinite; }
  #meter { height:6px; border-radius:3px; background:var(--surface2);
           overflow:hidden; }
  #meter > i { display:block; height:100%; width:0; background:var(--accent);
               transition:width .06s linear; }
  /* The stop control. Round, amber, and floating clear of the footer so it
     shares no edge with the talk button -- shape, colour and position all
     differ, which is what keeps a blind tap unambiguous. It is only in the
     DOM's flow when there is something to stop. */
  /* While it is on screen the chip and toast rows keep clear of it: the
     screenshots caught the circle sitting on top of a suggestion chip's
     "name" button, which is a mis-tap waiting to happen in exactly the moment
     the user is reaching for the stop. */
  body.playing #chips, body.playing #toasts { padding-right:96px; }
  #stopplay { position:fixed; right:14px; z-index:15;
              bottom:calc(158px + env(safe-area-inset-bottom));
              width:74px; height:74px; border-radius:50%; padding:0;
              background:#f5a623; border:3px solid var(--bg);
              color:#1a1206; box-shadow:0 6px 18px rgba(0,0,0,.45);
              display:none; }
  #stopplay.on { display:inline-flex; }
  #stopplay svg { width:30px; height:30px; }
  :root[data-theme="light"] #stopplay {
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  /* The muted state is a colour AND a glyph, never colour alone. */
  #mute.muted { color:var(--warn); border-color:var(--warn);
                background:var(--surface2); }
  .line.stopped .stopmark { color:var(--warn); border-color:var(--warn); }

  /* --- sheets and modal ------------------------------------------------ */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
           z-index:20; }
  #scrim.on { display:block; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21;
           max-height:88dvh; display:none; flex-direction:column;
           background:var(--bg); border-top:1px solid var(--line);
           border-radius:20px 20px 0 0; }
  .sheet.on { display:flex; }
  .sheet header { border-radius:20px 20px 0 0; padding-top:8px; }
  .sheet .body { overflow-y:auto; padding:12px 12px
                 calc(16px + env(safe-area-inset-bottom)); }
  .pane { display:none; }
  .pane.on { display:block; }
  .group { margin-bottom:18px; }
  .group > h3 { margin:0 0 8px; font-size:12px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--dim); font-weight:700; }
  .group > p { margin:8px 2px 0; font-size:12.5px; color:var(--dim);
               line-height:1.4; }
  .group > p.warn { color:var(--warn); }
  .seg { display:flex; gap:0; border:1px solid var(--line);
         border-radius:12px; overflow:hidden; }
  .seg button { flex:1 1 0; border:0; border-radius:0; background:transparent;
                font-size:14.5px; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:var(--accent-ink);
                   font-weight:650; }
  .listrow { display:flex; width:100%; align-items:center; gap:10px;
             min-height:56px; text-align:left; justify-content:flex-start;
             margin-bottom:6px; }
  .listrow .name { flex:1; min-width:0; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; }
  .listrow .code { font-size:11px; color:var(--dim); letter-spacing:.12em;
                   text-transform:uppercase; }
  .listrow .why { font-size:11.5px; color:var(--warn); }
  .listrow.on { border-color:var(--accent); }
  select, input[type="text"] {
    font:inherit; color:var(--fg); background:var(--surface2);
    border:1px solid var(--line); border-radius:12px; min-height:var(--tap);
    padding:0 10px; width:100%;
  }
  .pair { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .pair select { flex:1; min-width:0; }
  .pair .arrows { color:var(--dim); font-size:17px; }
  option:disabled { color:var(--dim); }
  #diag { font:11px/1.5 ui-monospace, Menlo, Consolas, monospace;
          color:var(--dim); word-break:break-all; }
  #modal { position:fixed; inset:0; z-index:30; display:none;
           align-items:center; justify-content:center; padding:20px;
           background:rgba(0,0,0,.6); }
  #modal.on { display:flex; }
  #modal .box { width:100%; max-width:420px; background:var(--bg);
                border:1px solid var(--line); border-radius:18px; padding:16px; }
  #modal h3 { margin:0 0 8px; font-size:17px; }

             line-height:1.45; }
  #modal .actions { display:flex; gap:8px; margin-top:14px; }
  #modal .actions button { flex:1; }
</style>

<header>
  <span class="pill"><i id="dot"></i><span id="status">starting</span></span>
  <span class="pill quiet" id="link" title="link">&mdash;</span>
  <span class="grow"></span>
  <!-- The mute toggle sits in the header because it is a CONVERSATION mode,
       not a per-turn action: a phone passed around a quiet table stays silent
       for the rest of the evening. It is the same server state as the reading
       mode (output.mode) -- one concept, one control, never two toggles that
       do the same thing. -->
  <button class="icon ghost" id="mute" aria-label="speak translations aloud"></button>
  <button class="icon ghost" id="theme" aria-label="light or dark"></button>
  <button class="icon ghost" id="gear" aria-label="settings"></button>
</header>

<div class="banner" id="demo"></div>
<!-- The sound-blocked notice is a BANNER WITH AN ACTION, not a sentence in a
     log. A mobile browser refuses to start an output context outside a user
     gesture, and the only cure is a tap -- so the notice carries the tap. -->
<div class="banner" id="blocked">
  <span class="grow">the browser is blocking sound output</span>
  <button id="unblock">enable sound</button>
</div>

<nav id="langbar"></nav>

<!-- The conversation, as the reader scrolls it (design 17.2). Fed by
     transcript.line / transcript.update and by the live turn events, restored
     whole on reconnect, and ended only by an explicit clear. One stream: the
     live turn and its durable line are THE SAME bubble, keyed by turn id, so
     nothing is said twice on screen. -->
<main id="transcript"></main>

<!-- Shown only while the reader is NOT being followed, i.e. they scrolled up

  <div id="activity"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Configuration derived from the page, never hardcoded.
// ---------------------------------------------------------------------------
// Everything is addressed RELATIVE to where the page was served from, so the
// same file works at the site root and under a reverse-proxy path prefix
// (/translate/). The prefix is stripped by nginx, so the backend still sees
// its own paths; only the client has to know where it lives.
const BASE = location.pathname.replace(/[^/]*$/, "");
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://")
  + location.host + BASE + "api/translator/stream";
// Substituted by the server when it serves this file. Without it there is no
// way to tell a fixed client from a cached one, and every diagnosis is a
// guess about which code the phone is actually executing.
const CLIENT_BUILD = "__CLIENT_BUILD__";
const PIPELINE_RATE = 16000;   // confirmed by the server on handshake
const FRAME_MS = 20;

const el = (id) => document.getElementById(id);
const streamBox = () => el("transcript");

// Inline, because the page has no route to any asset host. Nothing here is an
// emoji: a glyph that renders as a different picture per platform is not an
// icon, it is a guess.
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  // Sliders rather than a cogwheel: a cog drawn at 22 px with a 2 px stroke
  // is indistinguishable from the sun beside it, which is what the first
  // screenshots showed.
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2.1"/><circle cx="10" cy="12" r="2.1"/><circle cx="18" cy="17" r="2.1"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M7 4L4 7M7 4l3 3"/><path d="M17 20V7M17 20l3-3M17 20l-3-3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5z"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.7 6a8 8 0 0 1 0 12"/></svg>',
  muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
};

// ---------------------------------------------------------------------------
// Theme. prefers-color-scheme decides until the user says otherwise; the
// choice then sticks, because the reason to override it (bright sun, dark
// restaurant) outlives one page load.
// ---------------------------------------------------------------------------
function applyTheme(name) {
  document.documentElement.dataset.theme = name;
  el("theme").innerHTML = name === "light" ? ICON.moon : ICON.sun;
  const meta = el("themecolor");
  if (meta) meta.setAttribute("content", name === "light" ? "#eef1f6" : "#0b0d12");
}
function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem("translator.theme"); } catch (err) { /* private mode */ }
  const dark = !window.matchMedia
    || !window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(stored || (dark ? "dark" : "light"));
}

// ---------------------------------------------------------------------------
// State line. One vocabulary for every state the person can be in, so the
// header never has to be read twice: the dot carries the colour, the word
// carries the detail.
// ---------------------------------------------------------------------------
let uiState = "connecting";
function setState(name, text) {
  uiState = name;
  document.body.dataset.state = name;
  el("status").textContent = text || name;
}
/** Back-compatible shim: the old surface's status writer. */
function setStatus(text, cls) {
  const map = { on: "ready", wait: "connecting", err: "offline" };
  setState(map[cls] || "offline", text);
}

/** A transient message with a reason. Errors stay until dismissed. */
function sys(text, bad) {
  const node = document.createElement("div");
  node.className = "toast" + (bad ? " err" : "");
  const span = document.createElement("span");
  span.className = "text";
  span.textContent = text;
  const close = document.createElement("button");
  close.innerHTML = ICON.close;
  close.setAttribute("aria-label", "dismiss");
  close.onclick = () => node.remove();
  node.append(span, close);
  el("toasts").appendChild(node);
  while (el("toasts").children.length > 4) el("toasts").firstElementChild.remove();
  pinBottom();
  if (!bad) setTimeout(() => node.remove(), 9000);
}

// ---------------------------------------------------------------------------
// Playback queue.
//
// Synthesized audio arrives as a sequence of binary frames. Scheduling each
// one at "now" would produce clicks between chunks, so every buffer is
// scheduled at the end of the previous one on a shared clock. A gap of more
// than a few hundred milliseconds resets the clock, otherwise a long pause
// would leave the queue scheduling into the past.
// ---------------------------------------------------------------------------
class Playback {
  constructor() {
    this.ctx = null;
    this.cursor = 0;
    // Counted separately on purpose. "Frames arrived", "frames were
    // scheduled" and "the output clock is running" are three different
    // claims, and a phone that plays nothing while the server sent 53 audio
    // events is telling us which of them broke -- but only if they are
    // counted apart. They were not, which is why that phone could not be
    // diagnosed from here.
    this.pushed = 0;
    this.scheduled = 0;
    this.errors = [];
    this.lastResume = "none";
    this.blocked = false;
    this.dropped = 0;
    this.skippedReplay = 0;
    //: Sources already booked on the output clock, with the time each ends.
    //: They exist so a stop can cut what is ALREADY playing (user order).
    this.live = [];
    this.stops = 0;
    //: Frames refused because the page was hidden. Counted rather than
    //: silently dropped: it is what the return-to-foreground notice is built
    //: from, and it separates "nothing was sent" from "we refused to speak".
    this.heldWhileHidden = 0;
    //: Onset instrument (§17.8.16 client cut). A re-anchor is the seam a
    //: start-of-speech click would live on, and the last few are kept with the
    //: rendered samples so the answer comes off the DEVICE rather than out of
    //: a local reproduction that has never clicked.
    this.reanchors = 0;
    this.onset = null;
    this.onsets = [];
    //: Onset ramps applied, and the rare case where the curve could not be
    //: scheduled because the start time had already passed.
    this.ramps = 0;
    this.rampSkipped = 0;
    //: The turn whose audio is currently on the clock, so a stop can say on
    //: WHICH bubble it happened rather than only in the header.
    this.currentTurn = null;
    //: The last turn whose FIRST buffer was ramped, and how often that has
    //: happened. The re-anchor counter cannot stand in for this: a turn that
    //: starts while the previous turn is still playing out never re-anchors,
    //: and that is precisely the seam the user still hears.
    this.rampedTurn = null;
    this.turnStarts = 0;
  }

  /** Create and START the output context. MUST be called on a user gesture.
   *
   * A mobile browser lets any script CREATE an AudioContext and refuses to
   * start its clock outside a gesture. A context created when the first
   * audio frame arrives -- seconds after the tap -- is therefore born
   * suspended, `resume()` there is not honoured, every buffer is scheduled
   * against a clock that never advances, and nothing is heard and nothing is
   * thrown. Unlocking has to happen on the tap, BEFORE any await, because
   * awaiting getUserMedia consumes the activation that makes it legal.
   */
  unlock() {
    const ctx = this.ensure();
    if (!ctx) return null;
    try {
      // Starting a one-sample buffer is what makes the browser commit.
      const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);
    } catch (err) {
      this.errors.push("unlock: " + err);
    }
    return ctx;
  }

  ensure() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (err) {
        this.errors.push("create: " + err);
        return null;
      }
    }
    if (this.ctx.state === "suspended") {
      // The promise is READ, not ignored: a rejected resume is the whole
      // diagnosis, and dropping it on the floor is what made this invisible.
      this.lastResume = "requested";
      this.ctx.resume().then(
        () => { this.lastResume = "resolved"; },
        (err) => { this.lastResume = "rejected: " + err; }
      );
    }
    return this.ctx;
  }

  /** Forget any schedule made against an old clock. */
  reset() { this.cursor = 0; this.forget(); }

  /** Drop the handles to buffers that have already been heard.
   *
   * Every scheduled source is retained so it can be stopped again; without
   * this the list would grow for the length of the conversation. A source
   * whose end time is behind the clock cannot be stopped any more anyway.
   */
  forget() {
    if (!this.ctx) { this.live = []; return; }
    const now = this.ctx.currentTime;
    this.live = (this.live || []).filter((entry) => entry.endsAt > now);
  }

  /** Wire rate -> context rate, CONTINUOUS across frames.
   *
   *  Linear, and deliberately so: the artefact being removed is a full-scale
   *  discontinuity, and interpolation quality is a second-order question
   *  next to that. What matters is that state carries across calls, so the
   *  stream is resampled as one signal rather than as a sequence of islands.
   *
   *  The read position is DERIVED from the global output index rather than
   *  accumulated. Adding the ratio to a running position drifts, and the
   *  drift differs between one long call and many short ones -- at a 48 kHz
   *  context (a phone) the ratio is 1/3 and the rounding is systematic, which
   *  produced an 0.086 residual until this was derived instead. Framed and
   *  whole now render bit-identically at 16/22.05/32/44.1/48 kHz out.
   *
   *  Equal rates are a pass-through, which is what keeps this rate-agnostic:
   *  when the §19.5 ladder moves the uplink to 48 kHz on a 48 kHz context,
   *  this stops doing anything without being rebuilt.
   */
  resample(float32, inRate, outRate) {
    if (inRate === outRate) return float32;
    if (this._rsRate !== inRate || this._rsOut !== outRate) {
      this._rsRate = inRate; this._rsOut = outRate;
      this._rsK = 0; this._rsConsumed = 0; this._rsPrev = 0; this._rsPrimed = false;
    }
    const ratio = inRate / outRate;
    if (!this._rsPrimed) {
      this._rsPrev = float32.length ? float32[0] : 0;
      this._rsPrimed = true;
    }
    const out = [];
    while (true) {
      const pos = this._rsK * ratio - this._rsConsumed;
      const i = Math.floor(pos);
      if (i + 1 >= float32.length) break;
      const f = pos - i;
      const s0 = (i < 0) ? this._rsPrev : float32[i];
      out.push(s0 * (1 - f) + float32[i + 1] * f);
      this._rsK += 1;
    }
    this._rsConsumed += float32.length;
    if (float32.length) this._rsPrev = float32[float32.length - 1];
    return Float32Array.from(out);
  }

  /** Forget the interpolation state. Called wherever the stream BREAKS --
   *  a stop, or a fresh context -- because carrying `prev` across a
   *  discontinuity would smear the old tail into the new opening sample.
   */
  resetResampler() {
    this._rsK = 0; this._rsConsumed = 0; this._rsPrev = 0; this._rsPrimed = false;
  }

  /** Put samples on the output clock. Shared by live audio and by replay. */
  schedule(float32, rate) {
    const ctx = this.ensure();
    if (!ctx) return false;
    // HIDDEN MEANS SILENT (user order 2026-08-04). The context-state guard
    // below is not enough: Android keeps the AudioContext RUNNING for a
    // backgrounded PWA that holds a wake lock, so a translation that arrived
    // while the phone was in a pocket was scheduled normally and spoken to
    // nobody -- or, worse, minutes later. The page's own visibility is the
    // only signal that says whether a listener is there.
    //
    // Deliberately unconditional, including while listening is ON: a
    // translation that surfaces late is worse than one that never sounds,
    // because it arrives detached from the exchange it belongs to. It is not
    // lost -- the transcript already carries the text, and `heldWhileHidden`
    // is what tells the user on return.
    // NOT `blocked`. That flag means one specific thing -- the browser refused
    // to start the output clock and only a tap can release it -- and the page
    // acts on it: a red banner, the header switched to "sound blocked", and a
    // capture report. Reusing it here raised that alarm every time the phone
    // was briefly backgrounded, which is a false report of an autoplay
    // refusal that only the unblock button could clear. Withholding audio on
    // purpose is a different state and gets its own counter; the return-to-
    // foreground notice is what tells the user, once, in words.
    if (typeof document !== "undefined" && document.hidden) {
      this.heldWhileHidden += 1;
      return false;
    }
    if (ctx.state !== "running") {
      // Do NOT schedule into a stopped clock. `currentTime` is frozen while
      // the context is suspended, so every buffer would be booked against the
      // very start of the timeline and the whole backlog would fire the
      // instant the context resumes -- seconds of overlapping speech at the
      // first tap, which is indistinguishable from noise. Dropping is the
      // honest choice: nobody could have heard it anyway.
      this.blocked = true;
      return false;
    }
    try {
      // Hand the browser samples that ALREADY sit at the context rate. Built
      // per 20 ms frame at the WIRE rate, every frame was resampled as an
      // island with no neighbours, and the resampler invented its edges:
      // measured in an OfflineAudioContext, the residual against the same
      // signal rendered as one buffer peaked at 0.49 against a 0.5 signal --
      // a full-scale transient 50 times a second -- with EXACTLY zero energy
      // between the edges (scripts/translator/probe_resample_seam.py). That
      // is the crackle the user reports at the start of speech. Rendering the
      // same comparison at 16k->16k gives a residual of 0.0, which is what
      // proves the mechanism is resampling and not scheduling.
      const samples = this.resample(float32, rate, ctx.sampleRate);
      // A frame can be entirely consumed as interpolation context without
      // yielding an output sample yet. That is normal and not a drop.
      if (!samples.length) return true;
      const buffer = ctx.createBuffer(1, samples.length, ctx.sampleRate);
      buffer.copyToChannel(samples, 0);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      const now = ctx.currentTime;
      // THE ONSET INSTRUMENT (user report: a rare click at the start of
      // speech). Two numbers, and they answer different questions. A
      // RE-ANCHOR here means the output clock had drained -- everything
      // booked has already played and this buffer starts a new run, which is
      // the seam an onset artefact would live on. Counted separately from the
      // very first buffer of the session, because "the queue ran dry mid-turn"
      // and "playback started" sound alike in a log and are not the same
      // event.
      const reanchor = this.cursor < now + 0.02;
      // A TURN START is the other seam, and it is the one the user kept
      // reporting after the re-anchor ramp shipped (§17.8.21 open item 2).
      // The two are independent: the clock draining mid-turn is a re-anchor
      // and is already covered, but a new turn that begins while the previous
      // turn's tail is still scheduled joins the timeline with no gap at all
      // -- so no re-anchor fires, and the first sample of a freshly
      // synthesized waveform lands directly against the last sample of a
      // different one. That step is a click and nothing was fading it.
      const turnStart = this.currentTurn != null
        && this.currentTurn !== this.rampedTurn;
      if (turnStart) {
        this.turnStarts += 1;
        this.rampedTurn = this.currentTurn;
      }
      if (reanchor || turnStart) {
        // The first ~50 ms AS RENDERED, not as received: this is what the
        // browser is about to play, after the resampler. Peak and RMS
        // separate a full-scale step (a click) from a normal soft onset, and
        // the leading samples are kept raw because a step is visible in them
        // and in nothing else. Sampled only at a seam, so it costs nothing
        // during continuous speech.
        const window = Math.min(samples.length, Math.round(ctx.sampleRate * 0.05));
        let peak = 0, sum = 0;
        for (let i = 0; i < window; i++) {
          const v = samples[i];
          const a = Math.abs(v);
          if (a > peak) peak = a;
          sum += v * v;
        }
        this.onset = {
          at: Math.round(now * 1000) / 1000,
          seam: this.scheduled > 0,
          // WHICH seam this was, because the fix differs. A `turn_start`
          // capture whose peak and head show a step is evidence the SYNTHESIS
          // begins hot, which the client can only fade and the talker should
          // not have emitted; a `reanchor` capture is the output clock, which
          // is entirely the client's own.
          reanchor: reanchor,
          turn_start: turnStart,
          turn_id: this.currentTurn,
          samples: window,
          peak: Math.round(peak * 1000) / 1000,
          rms: Math.round(Math.sqrt(window ? sum / window : 0) * 1000) / 1000,
          // A click is a discontinuity from SILENCE, so the first samples are
          // the evidence. Sixteen of them is a few hundred microseconds and
          // fits in a debug upload.
          head: Array.from(samples.slice(0, 16),
                           (v) => Math.round(v * 1000) / 1000),
        };
        this.onsets.push(this.onset);
        while (this.onsets.length > 8) this.onsets.shift();
      }
      // Only a re-anchor moves the cursor. A turn start that arrives while
      // the previous turn is still scheduled must keep its place in the
      // queue: re-anchoring it to `now + 0.05` would drop it ON TOP of audio
      // that has not played yet, which is two voices at once -- a far worse
      // defect than the click this whole block exists to remove.
      if (reanchor) {
        this.reanchors += 1;
        this.cursor = now + 0.05;
      }
      // ONSET RAMP (user report: "das knacken ist meist ganz am anfang des
      // gesprochenen, danach ist es meist knackfrei"). A buffer starting at a
      // non-zero sample is a step discontinuity from silence, and a step is a
      // click -- it is the same artefact class as the per-frame resampling
      // that was fixed in §17.8.13, but at the START of a run rather than at
      // every seam, which is exactly where the user still hears it. A short
      // cosine-shaped ramp removes the step; 8 ms is below the ~20 ms where a
      // fade becomes audible as a soft attack, and it is applied ONLY at the
      // two seams -- a re-anchor and the first buffer of a turn -- so
      // continuous speech is untouched and no word is softened in the middle.
      // `setValueCurveAtTime` gives the cosine shape; a linear ramp would
      // leave a corner in the first derivative.
      //
      // Shipping the re-anchor half alone did NOT stop the report ("das
      // knacken ist meist ganz am anfang des gesprochenen" persisted), and
      // the reason is structural rather than a tuning miss: a re-anchor only
      // happens when the clock has already drained, and a turn that follows
      // closely on the previous one never drains it.
      if ((reanchor || turnStart) && ONSET_RAMP_S > 0) {
        const gain = ctx.createGain();
        const steps = 32;
        const curve = new Float32Array(steps);
        for (let i = 0; i < steps; i++) {
          curve[i] = 0.5 - 0.5 * Math.cos((Math.PI * i) / (steps - 1));
        }
        try {
          gain.gain.setValueCurveAtTime(curve, this.cursor, ONSET_RAMP_S);
        } catch (err) {
          // A curve scheduled in the past throws; a hard start is still
          // better than no audio, and the counter says it happened.
          this.rampSkipped += 1;
        }
        source.connect(gain);
        gain.connect(ctx.destination);
        this.ramps += 1;
      } else {
        source.connect(ctx.destination);
      }
      source.start(this.cursor);
      this.cursor += buffer.duration;
      // Kept so the whole queue can be silenced on one tap. A buffer that is
      // already scheduled plays whatever happens to the socket, so "stop"
      // without these handles could only ever stop the NEXT chunk -- which,
      // for a listener who has heard enough, is not stopping.
      this.forget();
      (this.live = this.live || []).push({ source: source, endsAt: this.cursor });
      return true;
    } catch (err) {
      this.errors.push("push: " + err);
      return false;
    }
  }

  push(float32, rate) {
    this.pushed += 1;
    if (this.schedule(float32, rate)) this.scheduled += 1;
    else this.dropped += 1;
  }

  /** Silence everything scheduled, now. Local and immediate by design.
   *
   * The stop frame goes to the server as well, so no further audio is
   * produced for the turn -- but the audio ALREADY on the output clock is
   * the part the listener is hearing, and waiting for a round trip to cut it
   * would make the button feel broken on exactly the connection where it
   * matters most. The two halves are independent: this one always works,
   * even offline.
   */
  stopAll() {
    const stopped = (this.live || []).length;
    for (const entry of this.live || []) {
      try { entry.source.stop(); } catch (err) { /* already finished */ }
      try { entry.source.disconnect(); } catch (err) { /* already detached */ }
    }
    this.live = [];
    // Back to "nothing is booked", so the next turn schedules against the
    // real clock rather than behind the tail we just cut away.
    this.cursor = this.ctx ? this.ctx.currentTime : 0;
    this.resetResampler();
    this.stops += 1;
    return stopped;
  }

  /** Play a turn's audio again, on demand (design 19.6). Deliberately not
   *  routed through push(): these frames are not new arrivals and must not
   *  move the counters that say what the SERVER delivered. */
  replay(entry) {
    if (!entry || !entry.chunks.length) return false;
    this.unlock();
    let ok = false;
    for (const chunk of entry.chunks) {
      if (this.schedule(chunk, entry.rate)) ok = true;
    }
    return ok;
  }

  /** Everything a log reader needs to tell "not sent" from "not played". */
  diagnostics() {
    return {
      state: this.ctx ? this.ctx.state : "none",
      current_time: this.ctx ? Math.round(this.ctx.currentTime * 1000) / 1000 : 0,
      rate: this.ctx ? this.ctx.sampleRate : 0,
      pushed: this.pushed,
      scheduled: this.scheduled,
      dropped: this.dropped,
      skipped_replay: this.skippedReplay,
      stops: this.stops,
      last_resume: this.lastResume,
      blocked: this.blocked,
      held_while_hidden: this.heldWhileHidden,
      reanchors: this.reanchors,
      turn_starts: this.turnStarts,
      ramps: this.ramps,
      ramp_skipped: this.rampSkipped,
      onsets: this.onsets.slice(-4),
      errors: this.errors.slice(-3),
    };
  }

  get busy() { return this.ctx && this.cursor > this.ctx.currentTime; }

  /** Seconds of speech still booked on the output clock.
   *
   * This is exact and entirely local -- the schedule IS the answer, so
   * "still speaking for about four seconds" needs no server frame and stays
   * right even if the connection drops mid-turn.
   */
  get remaining() {
    if (!this.ctx) return 0;
    return Math.max(0, this.cursor - this.ctx.currentTime);
  }
}
const playback = new Playback();

// Audio kept per turn so a line can be played again (design 19.6). Replayed
// journal frames are STORED but never scheduled, which is what makes the
// replay button work after a reload without ever speaking history uninvited.
const audioStore = new Map();
const AUDIO_KEEP_TURNS = 24;

function keepAudio(turnId, samples, rate) {
  if (!turnId) return;
  let entry = audioStore.get(turnId);
  if (!entry) {
    entry = { rate: rate, chunks: [] };
    audioStore.set(turnId, entry);
    while (audioStore.size > AUDIO_KEEP_TURNS) {
      audioStore.delete(audioStore.keys().next().value);
    }
  }
  entry.rate = rate;
  entry.chunks.push(samples);
  markReplayable(turnId);
}

// ---------------------------------------------------------------------------
// Microphone capture.
//
// The AudioWorklet is defined inline and loaded from a blob so the page stays
// a single file. It hands raw float frames to the main thread, which
// downsamples to the pipeline rate and packs PCM16. Downsampling here rather
// than server-side keeps the uplink small, which is the whole game on mobile
// data.
// ---------------------------------------------------------------------------
const WORKLET_SOURCE = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.calls = 0; this.empty = 0; }
  process(inputs) {
    this.calls++;
    const first = inputs[0] || [];
    const ch = first[0];
    if (ch) {
      this.port.postMessage(new Float32Array(ch));
    } else {
      this.empty++;
    }
    // Liveness, not data. "process() is running but hands me nothing" and
    // "process() is never called" look identical from the main thread, and
    // they have completely different causes.
    if (this.calls === 1 || this.calls === 20 || this.calls % 200 === 0) {
      this.port.postMessage({
        tap: true, calls: this.calls, empty: this.empty,
        inputs: inputs.length, channels: first.length,
      });
    }
    return true;
  }
}
registerProcessor("tap", Tap);
`;

class Microphone {
  constructor(onFrame, onLevel, onNote, onLost) {
    this.onFrame = onFrame;
    this.onLevel = onLevel;
    this.onNote = onNote || function () {};
    //: Called when the capture is TAKEN AWAY, as a state change rather than a
    //: message. A note alone was what the page used to do, and it left the UI
    //: claiming to listen with its record button disabled -- see `micLost`.
    this.onLost = onLost || function () {};
    this.ctx = null;
    this.node = null;
    this.stream = null;
    this.source = null;
    this.script = null;
    this.carry = new Float32Array(0);
    this.pending = new Float32Array(0);
    this.open = false;
    this.path = "worklet";
    this.tapCalls = 0;
    this.tapEmpty = 0;
    this.tapChannels = 0;
    this.chunks = 0;
    this.frames = 0;
    this.observedPeak = 0;
  }

  async start() {
    if (this.ctx) return;
    // NS AND AGC ARE A MEASURABLE QUESTION NOW, not a settled one. All three
    // filters were switched on together because they remove the
    // loudspeaker-into-microphone feedback loop for free. But the SAME track
    // feeds three consumers with opposite interests: the recognizer wants a
    // clean signal, while the speaker embedding and the voice clone want the
    // voice UNCOLOURED -- and noise suppression plus automatic gain are
    // exactly colouring. They cannot be separated at the source: one
    // `getUserMedia` track serves all three, and a second capture with
    // different constraints is unreliable on Android and doubles the cost.
    //
    // So the compromise is documented rather than hidden, and made testable
    // from the device: `?raw=1` drops NS and AGC for a session so the user can
    // A/B it on his own phone against his own voice. ECHO CANCELLATION IS
    // NEVER DROPPED -- it is what keeps our own TTS out of the microphone, and
    // the TTS echo enrolling itself as a speaker is a live defect, not a
    // hypothetical one. What the track actually GOT is reported either way
    // (`diagnostics()`), because a constraint is a wish and not a setting.
    const raw = new URLSearchParams(location.search).get("raw") === "1";
    this.rawCapture = raw;
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: !raw,
        autoGainControl: !raw,
        channelCount: 1,
      },
    });
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    // RESUME, and do not assume it worked. This context is created AFTER an
    // await on getUserMedia -- on the first press that await also spans the
    // Android permission dialog -- so the user gesture that allowed audio has
    // already expired and Chrome starts the context SUSPENDED. A suspended
    // context never calls the worklet's process(), so no frame is ever
    // produced, nothing is ever sent, and the whole app looks dead while the
    // socket, the session and the server are all healthy. That is exactly
    // what happened on the first real phone test: nine WebSocket connections,
    // two sessions, and not one segment.
    await this.ctx.resume();
    const blob = new Blob([WORKLET_SOURCE], { type: "application/javascript" });
    const url = URL.createObjectURL(blob);
    await this.ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    this.source = this.ctx.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ctx, "tap");
    this.node.port.onmessage = (event) => this.handle(event.data);
    this.source.connect(this.node);
    // A zero-gain sink keeps the graph alive without echoing to the speaker.
    this.sink = this.ctx.createGain();
    this.sink.gain.value = 0;
    this.node.connect(this.sink).connect(this.ctx.destination);
    this.watchTrack();
  }

  /** Everything about the capture chain a log reader would need. */
  diagnostics() {
    const track = this.stream ? this.stream.getAudioTracks()[0] : null;
    const settings = track && track.getSettings ? track.getSettings() : {};
    return {
      build: CLIENT_BUILD,
      context_state: this.ctx ? this.ctx.state : "none",
      context_rate: this.ctx ? this.ctx.sampleRate : 0,
      track_rate: settings.sampleRate || 0,
      track_channels: settings.channelCount || 0,
      track_state: track ? track.readyState : "none",
      track_muted: track ? track.muted : null,
      track_enabled: track ? track.enabled : null,
      track_label: track ? String(track.label).slice(0, 60) : "",
      // We REQUEST echo cancellation, noise suppression and gain control
      // below, but a plain `true` in a constraint dictionary is "ideal", not
      // "exact" -- a browser is free to ignore it and say nothing. The user
      // reports his own voice is still noisy, so what was requested is not
      // evidence; what the track actually got is. Reported so the answer
      // comes from his device rather than from our source.
      track_echo_cancellation: settings.echoCancellation === undefined
        ? null : settings.echoCancellation,
      track_noise_suppression: settings.noiseSuppression === undefined
        ? null : settings.noiseSuppression,
      track_auto_gain: settings.autoGainControl === undefined
        ? null : settings.autoGainControl,
      //: Which capture profile was ASKED for, beside what the track got.
      raw_capture: !!this.rawCapture,
      worklet_calls: this.tapCalls,
      worklet_empty: this.tapEmpty,
      worklet_channels: this.tapChannels,
      chunks: this.chunks,
      frames: this.frames || 0,
      peak: Math.round(this.observedPeak * 1000) / 1000,
      path: this.path,
    };
  }

  watchTrack() {
    const track = this.stream ? this.stream.getAudioTracks()[0] : null;
    if (!track) return;
    // Android hands the microphone to a phone call or another app by MUTING
    // the track rather than ending it, and a muted track delivers no audio
    // while every other indicator stays healthy.
    // Both are handed UP as a loss, not written out as a sentence. The note
    // was all this did, and a note cannot re-enable a disabled button.
    track.onmute = () => this.onLost("muted");
    track.onunmute = () => this.onNote("the microphone is available again", false);
    track.onended = () => this.onLost("ended");
  }

  /** Deprecated, universally supported, and the point is that it works. */
  startFallback() {
    if (this.path !== "worklet" || !this.ctx || !this.source) return;
    this.path = "scriptprocessor";
    // RETIRE THE WORKLET FIRST. Nothing used to disconnect it, and the word
    // "disconnect" appeared nowhere in this file. A worklet that was merely
    // SLOW to start -- more than the 400 ms watchdog, which is ordinary on a
    // cold phone -- therefore kept delivering after the fallback engaged, and
    // both paths called handle(): two interleaved copies of the microphone
    // packed into one uplink stream.
    //
    // That is not a lost turn, it is a corrupted one, and it corrupts
    // everything computed downstream from the audio at once: recognition gets
    // garbled speech, the language decision flips on it, the speaker
    // embedding lands somewhere new every utterance, and the clone reference
    // is built from the mess -- which is heard as a noisy voice that changes
    // from turn to turn. One defect, four symptoms.
    if (this.node) {
      try { this.node.disconnect(); } catch (err) { /* already detached */ }
      this.node.port.onmessage = null;
      this.node = null;
    }
    if (this.sink) {
      try { this.sink.disconnect(); } catch (err) { /* already detached */ }
      this.sink = null;
    }
    const size = 2048;
    this.script = this.ctx.createScriptProcessor(size, 1, 1);
    this.script.onaudioprocess = (event) => {
      this.handle(new Float32Array(event.inputBuffer.getChannelData(0)));
    };
    this.source.connect(this.script);
    const mute = this.ctx.createGain();
    mute.gain.value = 0;
    this.script.connect(mute).connect(this.ctx.destination);
    this.onNote("switched capture to the ScriptProcessor fallback", false);
  }

  handle(chunk) {
    if (chunk && chunk.tap) {
      this.tapCalls = chunk.calls;
      this.tapEmpty = chunk.empty;
      this.tapChannels = chunk.channels;
      return;
    }
    this.chunks = (this.chunks || 0) + 1;
    let peak = 0;
    for (let i = 0; i < chunk.length; i++) {
      const v = Math.abs(chunk[i]);
      if (v > peak) peak = v;
    }
    this.onLevel(peak);
    if (peak > (this.observedPeak || 0)) this.observedPeak = peak;
    if (!this.open) return;

    const ratio = this.ctx.sampleRate / PIPELINE_RATE;
    const merged = new Float32Array(this.carry.length + chunk.length);
    merged.set(this.carry, 0);
    merged.set(chunk, this.carry.length);

    const outLength = Math.floor(merged.length / ratio);
    const out = new Float32Array(outLength);
    for (let i = 0; i < outLength; i++) {
      // Box-average decimation. The browser already band-limited the signal
      // at its own rate and speech energy above 8 kHz is not what the
      // recognizer uses, so a full polyphase filter would be cost without an
      // audible return on the uplink.
      const start = Math.floor(i * ratio);
      const end = Math.min(merged.length, Math.floor((i + 1) * ratio));
      let sum = 0;
      for (let j = start; j < end; j++) sum += merged[j];
      out[i] = end > start ? sum / (end - start) : 0;
    }
    this.carry = merged.slice(Math.floor(outLength * ratio));

    // ACCUMULATE the downsampled output across calls. This line is the whole
    // bug the first three phone tests were spent on: `out` used to be packed
    // into frames and then dropped, while only the INPUT remainder was
    // carried. A worklet quantum is 128 samples; at the 48 kHz Android picks,
    // that is ~42 samples at the pipeline rate, and a 20 ms frame needs 320.
    // So `start + frame <= out.length` was false on every single call and not
    // one frame was ever produced -- with the microphone open, the context
    // running and the worklet delivering (the phone reported 400 worklet
    // calls and 537 chunks against 0 frames, which is what finally located
    // it). Nothing on the server could see this, and the front-door harness
    // cannot: it pushes PCM straight into the socket and never runs a line of
    // this file.
    const held = this.pending || new Float32Array(0);
    const pending = new Float32Array(held.length + out.length);
    pending.set(held, 0);
    pending.set(out, held.length);

    const frame = Math.round(PIPELINE_RATE * FRAME_MS / 1000);
    let start = 0;
    for (; start + frame <= pending.length; start += frame) {
      const pcm = new DataView(new ArrayBuffer(frame * 2));
      for (let i = 0; i < frame; i++) {
        const s = Math.max(-1, Math.min(1, pending[start + i]));
        pcm.setInt16(i * 2, s * 32767, true);
      }
      this.frames = (this.frames || 0) + 1;
      this.onFrame(pcm.buffer);
    }
    this.pending = pending.slice(start);
  }

  setOpen(open) {
    this.open = open;
    if (!open) {
      this.carry = new Float32Array(0);
      this.pending = new Float32Array(0);
      return;
    }
    this.frames = 0;
    // Android suspends the capture context whenever the page is backgrounded,
    // and resuming it is not automatic on return. Cheap to repeat, silent to
    // omit.
    if (this.ctx && this.ctx.state !== "running") this.ctx.resume();
  }

  /** Frames handed to the sender since the last setOpen(true). */
  sent() {
    return this.frames || 0;
  }

  stop() {
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = null; this.node = null; this.stream = null; this.open = false;
  }
}

// ---------------------------------------------------------------------------
// Connection with resume.
//
// The session id and the journal cursor live here and survive the socket.
// Reconnect is not error handling: on a mobile network it is the normal case,
// so the backoff is short at first and the resume cursor is always sent.
// ---------------------------------------------------------------------------
class Connection {
  constructor(handlers) {
    this.handlers = handlers;
    this.ws = null;
    this.sessionId = sessionStorage.getItem("translator.session") || null;
    this.cursor = Number(sessionStorage.getItem("translator.cursor") || 0);
    this.participants = null;
    this.attempt = 0;
    this.closedByUser = false;
    this.pendingAudio = null;   // the turn a binary frame belongs to
    this.pingSentAt = 0;
    this.rttMs = null;
    this.wireRate = 0;
  }

  connect() {
    this.closedByUser = false;
    setState("connecting", "connecting");
    const ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";
    this.ws = ws;

    ws.onopen = () => {
      // A new socket means a new timeline: anything still booked against the
      // old clock must not survive into it.
      playback.reset();
      ws.send(JSON.stringify({
        kind: "hello",
        codecs: ["pcm16"],
        session_id: this.sessionId,
        resume_from: this.cursor,
        participants: this.participants,
      }));
    };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        this.onControl(JSON.parse(event.data));
      } else {
        this.onBinary(event.data);
      }
    };

    ws.onclose = () => {
      updateLink();
      if (this.closedByUser) { setState("offline", "closed"); return; }
      const delay = Math.min(500 * Math.pow(1.7, this.attempt++), 15000);
      setState("connecting",
               "reconnecting in " + Math.round(delay / 100) / 10 + "s");
      setTimeout(() => this.connect(), delay);
    };

    ws.onerror = () => { /* onclose does the work; avoid a double retry */ };
  }

  onControl(event) {
    if (typeof event.seq === "number") {
      this.cursor = Math.max(this.cursor, event.seq + 1);
      sessionStorage.setItem("translator.cursor", String(this.cursor));
    }
    if (event.kind === "ready") {
      this.attempt = 0;
      // A cursor counts events of ONE session. If the server did not resume
      // the session we asked for -- the idle collector took it and minted a
      // new one -- then our cursor counts a conversation that no longer
      // exists, and sending it again would ask the new session to skip past
      // everything it is about to say. Drop it with the session it belonged
      // to, before it is stored again below.
      if (event.session_id !== this.sessionId || !event.resumed) {
        this.cursor = 0;
        sessionStorage.setItem("translator.cursor", "0");
      }
      this.sessionId = event.session_id;
      sessionStorage.setItem("translator.session", this.sessionId);
      setState("ready", event.resumed ? "resumed" : "ready");
      updateLink();
      this.ping();
    }
    if (event.kind === "pong") {
      this.rttMs = Math.max(0, Date.now() - this.pingSentAt);
      updateLink();
      return;
    }
    if (event.audio_follows) {
      this.pendingAudio = event;
      if (event.sample_rate) { this.wireRate = event.sample_rate; updateLink(); }
    }
    this.handlers.onEvent(event);
  }

  onBinary(buffer) {
    const view = new DataView(buffer);
    const samples = new Float32Array(buffer.byteLength / 2);
    for (let i = 0; i < samples.length; i++) {
      samples[i] = view.getInt16(i * 2, true) / 32768;
    }
    const rate = (this.pendingAudio && this.pendingAudio.sample_rate)
      || PIPELINE_RATE;
    const turnId = this.pendingAudio ? this.pendingAudio.turn_id : null;
    // History must not be spoken. A freshly loaded page resumes from cursor
    // zero, so the journal answers with every turn.audio the conversation
    // ever produced; playing those is the whole conversation at once at the
    // first tap. The transcript already carries the text, and the server
    // marks what is replay, so this is a decision and not a guess. The
    // samples are still KEPT: that is what makes the per-line replay button
    // work on a page that has just been reloaded.
    if (this.pendingAudio && this.pendingAudio.replayed) {
      playback.skippedReplay += 1;
      keepAudio(turnId, samples, rate);
      return;
    }
    // A turn the listener already cut off must not resume because more of its
    // audio was still in flight. The stop is remembered per turn, so the rest
    // of the frames are kept for the replay button and never scheduled.
    if (stoppedTurns.has(turnId)) {
      keepAudio(turnId, samples, rate);
      playback.skippedReplay += 1;
      return;
    }
    keepAudio(turnId, samples, rate);
    playback.currentTurn = turnId;
    playback.push(samples, rate);
    setTurnState(turnId, "speaking");
    showStop();
    if (uiState !== "recording") setState("speaking", "speaking");
    // Audio arrived and the output is not running: say it, once, in words the
    // person can act on. Silence here is the failure that cost five rounds --
    // the server sent every frame and the phone reported nothing wrong.
    if (playback.blocked && !this.warnedBlocked) {
      this.warnedBlocked = true;
      el("blocked").classList.add("on");
      setState("blocked", "sound blocked");
      reportCapture("playback-blocked");
    }
  }

  ping() {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.pingSentAt = Date.now();
    this.sendControl({ kind: "ping" });
  }

  sendFrame(buffer) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(buffer);
  }

  sendControl(payload) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(payload));
    }
  }
}

// ---------------------------------------------------------------------------
// The conversation stream.
//
// ONE list. A turn's live events and its durable transcript line address the
// SAME bubble, keyed by turn id, so the reader is never shown the same
// sentence twice in two panels -- which is what the previous surface did.
//
// Every one of these renders SERVER state. The client owns none of it: a
// reconnect replays the record, and a correction is a round trip, so two
// devices in the same session never disagree about who said what.
// ---------------------------------------------------------------------------
const bubbles = new Map();      // turn_id -> node
const lineNodes = new Map();    // line_id -> node
const lineData = new Map();     // line_id -> the server's line payload
let knownSpeakers = [];

/** A stable colour per speaker, so the eye can follow one voice down the
 *  scrollback without reading a single name.
 *
 * A plain string hash was tried first and it is what the screenshots caught:
 * `speaker-1`, `speaker-2` and `speaker-3` differ by one character, so their
 * hues landed within a few degrees of each other and all three rails came out
 * the same green. The minted ids carry an ordinal -- use it, and the first
 * speakers of a conversation are maximally far apart by construction.
 */
const SPEAKER_HUES = [140, 205, 32, 320, 265, 95, 15, 175];
function speakerColor(speakerId) {
  const key = String(speakerId || "?");
  const ordinal = key.match(/(\d+)\s*$/);
  let index;
  if (ordinal) {
    index = (parseInt(ordinal[1], 10) - 1) % SPEAKER_HUES.length;
  } else {
    let hash = 0;
    for (let i = 0; i < key.length; i++) {
      hash = (hash * 131 + key.charCodeAt(i)) | 0;
    }
    index = Math.abs(hash) % SPEAKER_HUES.length;
  }
  return "hsl(" + SPEAKER_HUES[(index + SPEAKER_HUES.length) % SPEAKER_HUES.length]
    + " 72% 58%)";
}

function initials(label) {
  const text = String(label || "?").trim();
  const match = text.match(/[\p{L}\p{N}]/u);
  return match ? match[0].toUpperCase() : "?";
}

function speakerLabel(speakerId) {
  const known = knownSpeakers.find((s) => s.speaker_id === speakerId);
  return (known && known.label) || speakerId || "";
}

/** Follow new lines unless the reader has deliberately scrolled up.
 *
 * `following` is STATE that remembers what the READER last did, and that is
 * the whole fix for the defect the auto-scroll arm caught (newest line 95 px
 * below the fold as soon as the transcript overflowed). The previous shape
 * sampled `atBottom()` at APPEND time and scrolled once. But a bubble keeps
 * GROWING after it is appended -- `turn.queued` writes a waiting notice,
 * every `turn.translation` partial adds a clause, the final event replaces
 * the accumulation, `turn.voice` un-hides a tag -- and none of those paths
 * scrolls at all. The reading taken at append time is stale by the time the
 * bubble reaches its final height.
 *
 * Re-measuring at growth time cannot replace the flag either: the growth is
 * precisely what pushed the content past the fold, so a measurement taken
 * after it always says "not at the bottom" and would latch the follow off on
 * the first long turn. Only a flag written by the SCROLL event -- the one
 * signal that is actually the reader's -- survives the growth.
 */
let following = true;
const FOLLOW_SLACK_PX = 60;
function atBottom() {
  const box = streamBox();
  return box.scrollHeight - box.scrollTop - box.clientHeight < FOLLOW_SLACK_PX;
}
function scrollToEnd() {
  const box = streamBox();
  box.scrollTop = box.scrollHeight;
}
function follow() {
  if (following) scrollToEnd();
}
/** Re-pin after something OUTSIDE the stream changed its height.
 *
 * A chip or a toast appearing shortens the scroll box, and the newest bubble
 * -- the one the reader is waiting for -- slides out of view without any
 * scroll event to react to. Caught in the state screenshots: a queued turn
 * was hidden behind the suggestion chip that arrived after it.
 */
function pinBottom() {
  if (!following) return;
  requestAnimationFrame(scrollToEnd);
}

/** The unread hint, which exists only while the reader is not being followed. */
function paintUnread(hasNew) {
  const pill = el("unread");
  if (!pill) return;
  if (following) { pill.hidden = true; return; }
  if (hasNew) pill.hidden = false;
}

/** Follow the stream by WATCHING it, not by scrolling at the append sites.
 *
 * A MutationObserver over the subtree catches every way a bubble grows,
 * including the ones added later by code that never heard of this function --
 * which is how the original defect got in, one event handler at a time. The
 * ResizeObserver covers the growth that leaves no mutation behind at all: a
 * reflow from rotation, a font finishing load, the on-screen keyboard
 * changing the viewport.
 */
//: Last 40 drag-gesture steps. On `window` deliberately: this exists to be
//: read off a REAL DEVICE (debug upload, remote inspector), and a
//: script-scope const is reachable from neither.
window.dragLog = [];
const dragLog = window.dragLog;

let streamResize = null;
function watchStream() {
  const box = streamBox();
  box.addEventListener("scroll", () => {
    // The reader's own verdict, and the only writer of `following` that turns
    // it back on. Our own scroll lands at the very bottom and therefore
    // re-affirms `true`, so this cannot fight the observer below.
    const now = atBottom();
    if (now === following) return;
    following = now;
    paintUnread(false);
  }, { passive: true });
  const restick = () => {
    if (following) scrollToEnd();
    else paintUnread(true);
  };
  new MutationObserver(restick).observe(box, {
    childList: true, subtree: true, characterData: true,
  });
  if (window.ResizeObserver) {
    // Observing the box measures the VIEWPORT, not the content, so each
    // bubble is observed as it is created (see `bubbleFor`); the box entry
    // covers the container shrinking under a banner or the keyboard.
    streamResize = new ResizeObserver(() => { if (following) scrollToEnd(); });
    streamResize.observe(box);
  }
  el("unread").onclick = () => {
    following = true;
    scrollToEnd();
    paintUnread(false);
  };
}

/** The bubble for a turn, created on whichever event mentions it first.
 *
 * The class list is load-bearing beyond styling: `line` is what the
 * acceptance gate counts to prove a transcript entry appeared live, and
 * `turn` + `dst.waiting` is what it reads to prove the queue was announced.
 */
function bubbleFor(turnId) {
  let node = bubbles.get(turnId);
  if (node) return node;
  node = document.createElement("article");
  node.className = "line turn";
  node.dataset.turn = turnId;
  node.innerHTML =
    '<div class="meta"><i class="avatar">?</i><span class="who"></span>'
    + '<span class="tag lang"></span><span class="tag badge" hidden></span>'
    + '<span class="tag voice" hidden></span>'
    + '<span class="tag stopmark" hidden>stopped</span>'
    + '<span class="tag work" hidden></span></div>'
    + '<div class="dst"></div><div class="src"></div>'
    + '<div class="cands" hidden></div><div class="tools"></div>';
  node.addEventListener("click", (event) => {
    if (event.target.closest("button")) return;
    replayTurn(node.dataset.turn);
  });
  bubbles.set(turnId, node);
  streamBox().appendChild(node);
  // Every LATER growth of this bubble is caught by the observers in
  // `watchStream`; this call is only the immediate one, so the newest line is
  // on screen within the same frame rather than one observer callback later.
  follow();
