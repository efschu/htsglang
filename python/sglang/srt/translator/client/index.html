<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>live translator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101014">
<!--
  The whole client: one file, no build system, no external asset.

  It must load over the tunnel with no internet route available, which rules
  out every CDN and every bundler output. It also has to survive a mobile
  network that drops: the connection layer at the bottom reconnects with
  backoff and resumes the journal from the last sequence it processed, so a
  dropout costs the current utterance and nothing else.

  Microphone capture goes through getUserMedia with echo cancellation, gain
  control and noise suppression enabled. That is the reason this is a browser
  client rather than a native one for the MVP: it dissolves the loudspeaker to
  microphone feedback loop that half-duplex playback would otherwise create,
  for free, on every platform.
-->
<style>
  :root { color-scheme: dark; --bg:#101014; --fg:#e8e8ef; --dim:#8a8a9a;
          --accent:#5ac8fa; --warn:#ffb340; --bad:#ff6b6b; --good:#63d471; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45
         system-ui, -apple-system, sans-serif; display:flex;
         flex-direction:column; height:100dvh; overscroll-behavior:none; }
  header { padding:10px 14px; display:flex; gap:10px; align-items:center;
           border-bottom:1px solid #24242e; flex-wrap:wrap; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--bad);
         flex:0 0 auto; }
  #dot.on { background:var(--good); } #dot.wait { background:var(--warn); }
  select, button { font:inherit; color:var(--fg); background:#1c1c26;
                   border:1px solid #33333f; border-radius:8px; padding:7px 10px; }
  button:active { background:#2a2a38; }
  button[disabled] { opacity:.45; }
  #log { flex:1; overflow-y:auto; padding:12px 14px; display:flex;
         flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .turn { border-left:3px solid #33333f; padding-left:10px; }
  .turn .who { font-size:12px; color:var(--dim); letter-spacing:.03em; }
  .turn .src { color:var(--dim); }
  .turn .dst { font-size:18px; }
  .turn.borrowed .who::after { content:" · borrowed voice"; color:var(--warn); }
  .sys { font-size:12px; color:var(--dim); }
  .sys.err { color:var(--bad); }
  footer { padding:12px 14px calc(12px + env(safe-area-inset-bottom));
           border-top:1px solid #24242e; display:flex; gap:10px;
           align-items:center; }
  #transcript { flex:1; overflow-y:auto; padding:8px 10px; min-height:120px; }
  #transcript .line { border-left:3px solid #2c2c3a; padding:5px 8px; margin:5px 0;
                      background:#16161e; border-radius:0 8px 8px 0; }
  #transcript .who { font:11px ui-monospace,Menlo,monospace; color:#8a8aa0; }
  #transcript .txt { font-size:15px; margin-top:2px; }
  #transcript .alt { font-size:14px; color:#9ad0b8; margin-top:3px;
                     padding-left:8px; border-left:2px solid #2c4a3e; }
  #transcript .alt.pending { color:#6a6a80; font-style:italic; }
  #transcript .line.uncertain { border-left-color:#c8912f; }
  #transcript .notice { color:#8a8aa0; font-size:12px; font-style:italic; }
  .cands { margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  .cand { font-size:12px; padding:3px 8px; border-radius:12px;
          border:1px solid #3a3a4c; background:#1c1c26; color:#d8d8e4; }
  .cand.new { border-style:dashed; }
  #chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 10px; }
  .chip { font-size:13px; padding:5px 9px; border-radius:14px;
          border:1px solid #3a5d7c; background:#1a2733; }
  .chip button { font-size:12px; margin-left:6px; padding:2px 7px; }
  #speakers { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  #speakers button { flex:1 1 auto; min-width:88px; padding:11px 8px;
                     font-size:14px; border-radius:11px; background:#1c1c26; }
  #speakers button.add { flex:0 0 auto; min-width:46px; }
  #diag { font:11px/1.5 ui-monospace,Menlo,Consolas,monospace; color:#7a7a8c;
          padding:6px 10px; word-break:break-all; }
  #talk { flex:1; padding:20px; font-size:19px; border-radius:14px;
          background:#1c1c26; }
  /* Android reads a long press on a normal element as "select text", which
     cancels the press and leaves the user holding a selection handle instead
     of recording. All four properties are needed: the callout is the iOS/
     WebKit half, user-select the selection half, touch-action the gesture
     half. */
  #talk, #speakers button, .cand, .chip button {
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.55 } }
  #talk.live, #speakers button.live { background:#7c2f3d; border-color:#c8556b;
                                      animation:pulse 1.1s infinite; }
  #meter { height:6px; border-radius:3px; background:#24242e; flex:0 0 70px; }
  #meter > i { display:block; height:100%; width:0; border-radius:3px;
               background:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #demo { display:none; padding:10px 14px; background:#4a3a12; color:#ffd479;
          border-bottom:1px solid #6b5418; font-size:13px; line-height:1.35; }
  #demo.on { display:block; }
  #demo b { color:#ffb340; }
  #routing { display:none; padding:10px 14px; border-bottom:1px solid #2a2a2a;
             font-size:13px; background:#161616; }
  #routing.on { display:block; }
  #routing .pair { display:flex; gap:6px; align-items:center; margin:4px 0; }
  #routing .pair select { flex:1; min-width:0; }
  #routing .arrows { color:var(--dim); font-size:15px; }
  #routing button.small { padding:2px 9px; font-size:15px; line-height:1.2; }
  #routing .note { color:var(--dim); margin-top:6px; line-height:1.35; }
  #routing .note.warn { color:#ffd479; }
  #routing option:disabled { color:#6a6a6a; }
</style>

<header>
  <span id="dot" title="connection"></span>
  <span id="status" class="sys">starting</span>
  <span style="flex:1"></span>
  <select id="mode" title="turn taking">
    <option value="ptt">push to talk</option>
    <option value="vad">auto (voice detect)</option>
  </select>
  <select id="langs" multiple size="1" title="conversation languages"></select>
  <select id="routemode" title="how a turn picks its target language">
    <option value="auto">auto routing</option>
    <option value="manual">language pairs</option>
  </select>
  <select id="voice" title="output voice">
    <option value="clone">own voices</option>
    <option value="preset">preset voices</option>
  </select>
  <button id="enroll" title="record 15 s of your voice">enroll</button>
</header>

<div id="demo"></div>
<div id="routing">
  <div id="pairs"></div>
  <div class="row" style="margin-top:6px">
    <button id="addpair" class="small">+ pair</button>
    <button id="applypairs">apply</button>
  </div>
  <div class="note" id="routingnote"></div>
</div>
<div id="log"></div>
<!-- The capture chain, on screen. The same values go to the server so a
     log reader sees exactly what the person holding the phone sees. -->
<!-- The conversation, as the reader scrolls it (design 17.2). Fed by
     transcript.line / transcript.update, restored whole on reconnect, and
     ended only by an explicit clear. -->
<div id="transcript"></div>
<div id="chips"></div>
<div id="diag">build ? | capture not started</div>

<footer>
  <div id="meter"><i></i></div>
  <!-- One hold-to-speak button per known speaker (design 17.5). Holding one
       attributes the utterance directly and skips identification. The general
       button stays large underneath. -->
  <div id="speakers"></div>
  <button id="talk" disabled>tap to speak</button>
</footer>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Configuration derived from the page, never hardcoded.
// ---------------------------------------------------------------------------
// Everything is addressed RELATIVE to where the page was served from, so the
// same file works at the site root and under a reverse-proxy path prefix
// (/translate/). The prefix is stripped by nginx, so the backend still sees
// its own paths; only the client has to know where it lives.
const BASE = location.pathname.replace(/[^/]*$/, "");
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://")
  + location.host + BASE + "api/translator/stream";
// Substituted by the server when it serves this file. Without it there is no
// way to tell a fixed client from a cached one, and every diagnosis is a
// guess about which code the phone is actually executing.
const CLIENT_BUILD = "__CLIENT_BUILD__";
const PIPELINE_RATE = 16000;   // confirmed by the server on handshake
const FRAME_MS = 20;

const el = (id) => document.getElementById(id);
const logBox = el("log");

function sys(text, bad) {
  const div = document.createElement("div");
  div.className = "sys" + (bad ? " err" : "");
  div.textContent = text;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(text, cls) {
  el("status").textContent = text;
  el("dot").className = cls || "";
}

// ---------------------------------------------------------------------------
// Playback queue.
//
// Synthesized audio arrives as a sequence of binary frames. Scheduling each
// one at "now" would produce clicks between chunks, so every buffer is
// scheduled at the end of the previous one on a shared clock. A gap of more
// than a few hundred milliseconds resets the clock, otherwise a long pause
// would leave the queue scheduling into the past.
// ---------------------------------------------------------------------------
class Playback {
  constructor() { this.ctx = null; this.cursor = 0; }
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  }
  push(float32, rate) {
    const ctx = this.ensure();
    const buffer = ctx.createBuffer(1, float32.length, rate);
    buffer.copyToChannel(float32, 0);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    const now = ctx.currentTime;
    if (this.cursor < now + 0.02) this.cursor = now + 0.05;
    source.start(this.cursor);
    this.cursor += buffer.duration;
  }
  get busy() { return this.ctx && this.cursor > this.ctx.currentTime; }
}
const playback = new Playback();

// ---------------------------------------------------------------------------
// Microphone capture.
//
// The AudioWorklet is defined inline and loaded from a blob so the page stays
// a single file. It hands raw float frames to the main thread, which
// downsamples to the pipeline rate and packs PCM16. Downsampling here rather
// than server-side keeps the uplink small, which is the whole game on mobile
// data.
// ---------------------------------------------------------------------------
const WORKLET_SOURCE = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.calls = 0; this.empty = 0; }
  process(inputs) {
    this.calls++;
    const first = inputs[0] || [];
    const ch = first[0];
    if (ch) {
      this.port.postMessage(new Float32Array(ch));
    } else {
      this.empty++;
    }
    // Liveness, not data. "process() is running but hands me nothing" and
    // "process() is never called" look identical from the main thread, and
    // they have completely different causes.
    if (this.calls === 1 || this.calls === 20 || this.calls % 200 === 0) {
      this.port.postMessage({
        tap: true, calls: this.calls, empty: this.empty,
        inputs: inputs.length, channels: first.length,
      });
    }
    return true;
  }
}
registerProcessor("tap", Tap);
`;

class Microphone {
  constructor(onFrame, onLevel, onNote) {
    this.onFrame = onFrame;
    this.onLevel = onLevel;
    this.onNote = onNote || function () {};
    this.ctx = null;
    this.node = null;
    this.stream = null;
    this.source = null;
    this.script = null;
    this.carry = new Float32Array(0);
    this.pending = new Float32Array(0);
    this.open = false;
    this.path = "worklet";
    this.tapCalls = 0;
    this.tapEmpty = 0;
    this.tapChannels = 0;
    this.chunks = 0;
    this.frames = 0;
    this.observedPeak = 0;
  }

  async start() {
    if (this.ctx) return;
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        // These three are why the client is a browser: they remove the
        // loudspeaker-into-microphone feedback loop for half-duplex playback
        // without any work on our side.
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
      },
    });
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    // RESUME, and do not assume it worked. This context is created AFTER an
    // await on getUserMedia -- on the first press that await also spans the
    // Android permission dialog -- so the user gesture that allowed audio has
    // already expired and Chrome starts the context SUSPENDED. A suspended
    // context never calls the worklet's process(), so no frame is ever
    // produced, nothing is ever sent, and the whole app looks dead while the
    // socket, the session and the server are all healthy. That is exactly
    // what happened on the first real phone test: nine WebSocket connections,
    // two sessions, and not one segment.
    await this.ctx.resume();
    const blob = new Blob([WORKLET_SOURCE], { type: "application/javascript" });
    const url = URL.createObjectURL(blob);
    await this.ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    this.source = this.ctx.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ctx, "tap");
    this.node.port.onmessage = (event) => this.handle(event.data);
    this.source.connect(this.node);
    // A zero-gain sink keeps the graph alive without echoing to the speaker.
    this.sink = this.ctx.createGain();
    this.sink.gain.value = 0;
    this.node.connect(this.sink).connect(this.ctx.destination);
    this.watchTrack();
  }

  /** Everything about the capture chain a log reader would need. */
  diagnostics() {
    const track = this.stream ? this.stream.getAudioTracks()[0] : null;
    const settings = track && track.getSettings ? track.getSettings() : {};
    return {
      build: CLIENT_BUILD,
      context_state: this.ctx ? this.ctx.state : "none",
      context_rate: this.ctx ? this.ctx.sampleRate : 0,
      track_rate: settings.sampleRate || 0,
      track_channels: settings.channelCount || 0,
      track_state: track ? track.readyState : "none",
      track_muted: track ? track.muted : null,
      track_enabled: track ? track.enabled : null,
      track_label: track ? String(track.label).slice(0, 60) : "",
      worklet_calls: this.tapCalls,
      worklet_empty: this.tapEmpty,
      worklet_channels: this.tapChannels,
      chunks: this.chunks,
      frames: this.frames || 0,
      peak: Math.round(this.observedPeak * 1000) / 1000,
      path: this.path,
    };
  }

  watchTrack() {
    const track = this.stream ? this.stream.getAudioTracks()[0] : null;
    if (!track) return;
    // Android hands the microphone to a phone call or another app by MUTING
    // the track rather than ending it, and a muted track delivers no audio
    // while every other indicator stays healthy.
    track.onmute = () => this.onNote("microphone muted by the system", true);
    track.onunmute = () => this.onNote("microphone unmuted", false);
    track.onended = () => this.onNote("microphone track ended", true);
  }

  /** Deprecated, universally supported, and the point is that it works. */
  startFallback() {
    if (this.path !== "worklet" || !this.ctx || !this.source) return;
    this.path = "scriptprocessor";
    const size = 2048;
    this.script = this.ctx.createScriptProcessor(size, 1, 1);
    this.script.onaudioprocess = (event) => {
      this.handle(new Float32Array(event.inputBuffer.getChannelData(0)));
    };
    this.source.connect(this.script);
    const mute = this.ctx.createGain();
    mute.gain.value = 0;
    this.script.connect(mute).connect(this.ctx.destination);
    this.onNote("switched capture to the ScriptProcessor fallback", false);
  }

  handle(chunk) {
    if (chunk && chunk.tap) {
      this.tapCalls = chunk.calls;
      this.tapEmpty = chunk.empty;
      this.tapChannels = chunk.channels;
      return;
    }
    this.chunks = (this.chunks || 0) + 1;
    let peak = 0;
    for (let i = 0; i < chunk.length; i++) {
      const v = Math.abs(chunk[i]);
      if (v > peak) peak = v;
    }
    this.onLevel(peak);
    if (peak > (this.observedPeak || 0)) this.observedPeak = peak;
    if (!this.open) return;

    const ratio = this.ctx.sampleRate / PIPELINE_RATE;
    const merged = new Float32Array(this.carry.length + chunk.length);
    merged.set(this.carry, 0);
    merged.set(chunk, this.carry.length);

    const outLength = Math.floor(merged.length / ratio);
    const out = new Float32Array(outLength);
    for (let i = 0; i < outLength; i++) {
      // Box-average decimation. The browser already band-limited the signal
      // at its own rate and speech energy above 8 kHz is not what the
      // recognizer uses, so a full polyphase filter would be cost without an
      // audible return on the uplink.
      const start = Math.floor(i * ratio);
      const end = Math.min(merged.length, Math.floor((i + 1) * ratio));
      let sum = 0;
      for (let j = start; j < end; j++) sum += merged[j];
      out[i] = end > start ? sum / (end - start) : 0;
    }
    this.carry = merged.slice(Math.floor(outLength * ratio));

    // ACCUMULATE the downsampled output across calls. This line is the whole
    // bug the first three phone tests were spent on: `out` used to be packed
    // into frames and then dropped, while only the INPUT remainder was
    // carried. A worklet quantum is 128 samples; at the 48 kHz Android picks,
    // that is ~42 samples at the pipeline rate, and a 20 ms frame needs 320.
    // So `start + frame <= out.length` was false on every single call and not
    // one frame was ever produced -- with the microphone open, the context
    // running and the worklet delivering (the phone reported 400 worklet
    // calls and 537 chunks against 0 frames, which is what finally located
    // it). Nothing on the server could see this, and the front-door harness
    // cannot: it pushes PCM straight into the socket and never runs a line of
    // this file.
    const held = this.pending || new Float32Array(0);
    const pending = new Float32Array(held.length + out.length);
    pending.set(held, 0);
    pending.set(out, held.length);

    const frame = Math.round(PIPELINE_RATE * FRAME_MS / 1000);
    let start = 0;
    for (; start + frame <= pending.length; start += frame) {
      const pcm = new DataView(new ArrayBuffer(frame * 2));
      for (let i = 0; i < frame; i++) {
        const s = Math.max(-1, Math.min(1, pending[start + i]));
        pcm.setInt16(i * 2, s * 32767, true);
      }
      this.frames = (this.frames || 0) + 1;
      this.onFrame(pcm.buffer);
    }
    this.pending = pending.slice(start);
  }

  setOpen(open) {
    this.open = open;
    if (!open) {
      this.carry = new Float32Array(0);
      this.pending = new Float32Array(0);
      return;
    }
    this.frames = 0;
    // Android suspends the capture context whenever the page is backgrounded,
    // and resuming it is not automatic on return. Cheap to repeat, silent to
    // omit.
    if (this.ctx && this.ctx.state !== "running") this.ctx.resume();
  }

  /** Frames handed to the sender since the last setOpen(true). */
  sent() {
    return this.frames || 0;
  }

  stop() {
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = null; this.node = null; this.stream = null; this.open = false;
  }
}

// ---------------------------------------------------------------------------
// Connection with resume.
//
// The session id and the journal cursor live here and survive the socket.
// Reconnect is not error handling: on a mobile network it is the normal case,
// so the backoff is short at first and the resume cursor is always sent.
// ---------------------------------------------------------------------------
class Connection {
  constructor(handlers) {
    this.handlers = handlers;
    this.ws = null;
    this.sessionId = sessionStorage.getItem("translator.session") || null;
    this.cursor = Number(sessionStorage.getItem("translator.cursor") || 0);
    this.participants = null;
    this.attempt = 0;
    this.closedByUser = false;
    this.pendingAudio = null;   // the turn a binary frame belongs to
  }

  connect() {
    this.closedByUser = false;
    setStatus("connecting", "wait");
    const ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";
    this.ws = ws;

    ws.onopen = () => {
      ws.send(JSON.stringify({
        kind: "hello",
        codecs: ["pcm16"],
        session_id: this.sessionId,
        resume_from: this.cursor,
        participants: this.participants,
      }));
    };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        this.onControl(JSON.parse(event.data));
      } else {
        this.onBinary(event.data);
      }
    };

    ws.onclose = () => {
      if (this.closedByUser) { setStatus("closed", ""); return; }
      const delay = Math.min(500 * Math.pow(1.7, this.attempt++), 15000);
      setStatus("reconnecting in " + Math.round(delay / 100) / 10 + "s", "wait");
      setTimeout(() => this.connect(), delay);
    };

    ws.onerror = () => { /* onclose does the work; avoid a double retry */ };
  }

  onControl(event) {
    if (typeof event.seq === "number") {
      this.cursor = Math.max(this.cursor, event.seq + 1);
      sessionStorage.setItem("translator.cursor", String(this.cursor));
    }
    if (event.kind === "ready") {
      this.attempt = 0;
      this.sessionId = event.session_id;
      sessionStorage.setItem("translator.session", this.sessionId);
      setStatus(event.resumed ? "resumed" : "connected", "on");
    }
    if (event.audio_follows) this.pendingAudio = event;
    this.handlers.onEvent(event);
  }

  onBinary(buffer) {
    const view = new DataView(buffer);
    const samples = new Float32Array(buffer.byteLength / 2);
    for (let i = 0; i < samples.length; i++) {
      samples[i] = view.getInt16(i * 2, true) / 32768;
    }
    const rate = (this.pendingAudio && this.pendingAudio.sample_rate)
      || PIPELINE_RATE;
    playback.push(samples, rate);
  }

  sendFrame(buffer) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(buffer);
  }

  sendControl(payload) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(payload));
    }
  }
}

// ---------------------------------------------------------------------------
// Turn rendering.
// ---------------------------------------------------------------------------
const turns = new Map();

function turnNode(id) {
  let node = turns.get(id);
  if (!node) {
    node = document.createElement("div");
    node.className = "turn";
    node.innerHTML = '<div class="who"></div><div class="src"></div>'
                   + '<div class="dst"></div>';
    turns.set(id, node);
    logBox.appendChild(node);
  }
  logBox.scrollTop = logBox.scrollHeight;
  return node;
}

// ---------------------------------------------------------------------------
// The transcript panel (design 17.2), the speaker row (17.5), the uncertainty
// badges (17.4) and the name chips (17.3).
//
// Every one of these renders SERVER state. The client owns none of it: a
// reconnect replays the record, and a correction is a round trip, so two
// devices in the same session never disagree about who said what.
// ---------------------------------------------------------------------------
const transcriptBox = el("transcript");
const speakerRow = el("speakers");
const chipBox = el("chips");
let knownSpeakers = [];

/** Follow new lines unless the reader has deliberately scrolled up. */
function atBottom() {
  return transcriptBox.scrollHeight - transcriptBox.scrollTop
         - transcriptBox.clientHeight < 40;
}

function renderLine(line) {
  const existing = transcriptBox.querySelector('[data-line="' + line.line_id + '"]');
  const follow = atBottom();
  const node = existing || document.createElement("div");
  if (!existing) {
    node.dataset.line = line.line_id;
    transcriptBox.appendChild(node);
  }
  if (line.kind === "notice") {
    node.className = "line notice";
    node.textContent = line.text;
  } else {
    node.className = "line" + (line.confidence === "uncertain" ? " uncertain" : "");
    const targets = Object.keys(line.translations || {}).sort();
    node.innerHTML = "";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = line.speaker_label + " · " + line.source_language
      + (line.origin === "manual" ? " · you said so" : "")
      + (line.resolved_by ? " · resolved (" + line.resolved_by + ")" : "");
    // BOTH, always. The original is what the speaker actually said and it is
    // the only thing they can check the translation against; showing one of
    // the two made the transcript unverifiable. Fan-out gets one line per
    // target with its language tag.
    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = line.source_text;
    node.append(who, txt);
    if (targets.length) {
      for (const target of targets) {
        const out = document.createElement("div");
        out.className = "alt";
        out.textContent = target + ": " + line.translations[target];
        node.appendChild(out);
      }
    } else {
      const out = document.createElement("div");
      out.className = "alt pending";
      out.textContent = "(translating)";
      node.appendChild(out);
    }
    if (line.confidence === "uncertain" && (line.candidates || []).length) {
      const row = document.createElement("div");
      row.className = "cands";
      for (const c of line.candidates) {
        const b = document.createElement("button");
        b.className = "cand" + (c.new ? " new" : "");
        b.textContent = (c.new ? c.label + " (new)" : c.label)
                        + " " + c.similarity;
        b.onclick = (e) => {
          e.stopPropagation();
          connection.sendControl({
            kind: "line.resolve", line_id: line.line_id,
            speaker_id: c.new ? null : c.speaker_id,
          });
        };
        row.appendChild(b);
      }
      node.appendChild(row);
    }
  }
  // Auto-scroll, but never yank a reader who went back to look at something.
  if (follow) transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

function applyTranscript(payload) {
  if (!payload.lines) return;
  if (payload.replace) transcriptBox.innerHTML = "";
  for (const line of payload.lines) renderLine(line);
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

function renderSpeakers(speakers) {
  knownSpeakers = speakers || [];
  speakerRow.innerHTML = "";
  for (const sp of knownSpeakers) {
    const b = document.createElement("button");
    b.dataset.speaker = sp.speaker_id;
    b.textContent = sp.label || sp.speaker_id;
    bindTalkButton(b, sp.speaker_id);
    let hold = null;
    b.addEventListener("pointerdown", () => {
      hold = setTimeout(() => {
        hold = null;
        // Mark the press as consumed so the pointerup does not also toggle
        // recording -- a rename must never start a turn.
        b.dataset.renamed = "1";
        renameSpeaker(sp.speaker_id, sp.label);
      }, 650);
    });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
      b.addEventListener(ev, () => { if (hold) { clearTimeout(hold); hold = null; } });
    }
    speakerRow.appendChild(b);
  }
  const add = document.createElement("button");
  add.className = "add";
  add.textContent = "+";
  add.title = "somebody new is speaking";
  add.onclick = addSpeaker;
  speakerRow.appendChild(add);
}

/** The "+" button: declare somebody new, with their voice class.
 *
 * The class is asked for because the user knows it and the F0 heuristic only
 * guesses -- and it is needed BEFORE the first utterance, which is when a
 * preset voice has to be picked. Without it a new speaker has to talk once
 * before sounding right.
 */
function addSpeaker() {
  const answer = (prompt(
    "new speaker - voice class: man / woman / boy / girl", "man") || ""
  ).trim().toLowerCase();
  if (!answer) return;
  if (["man", "woman", "boy", "girl"].indexOf(answer) < 0) {
    sys("unknown voice class " + answer, true);
    return;
  }
  const name = (prompt("name (optional)", "") || "").trim();
  connection.sendControl({
    kind: "speaker.add", voice_class: answer, label: name || null,
  });
}

/** Rename any speaker, automatic or manual (design 17.3, manual path).
 *
 * A typed name outranks every suggestion and is never overwritten by the
 * automatic path. Long-press, because the short press is hold-to-speak.
 */
function renameSpeaker(speakerId, current) {
  // One prompt does both, because a phone row has no space for a second
  // control per speaker and a hidden gesture nobody finds is not a feature.
  const name = prompt(
    "name for " + (current || speakerId) + "\n(empty = DELETE this speaker)",
    current || ""
  );
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) {
    if (!confirm("delete " + (current || speakerId)
                 + "? their voice reference is lost")) return;
    connection.sendControl({ kind: "speaker.delete", speaker_id: speakerId });
    return;
  }
  connection.sendControl({
    kind: "speaker.name", speaker_id: speakerId, label: trimmed,
  });
}

function chip(suggestion) {
  const node = document.createElement("div");
  node.className = "chip";
  const who = suggestion.speaker_id || "somebody";
  if (suggestion.applied) {
    // Already in force: a self-introduction leaves nothing to decide, so the
    // only useful control is taking it back.
    node.textContent = 'named ' + who + ' "' + suggestion.name + '"';
    const undo = document.createElement("button");
    undo.textContent = "undo";
    undo.onclick = () => {
      connection.sendControl({
        kind: "name.undo", suggestion_id: suggestion.suggestion_id,
      });
      node.remove();
    };
    node.appendChild(undo);
    chipBox.appendChild(node);
    setTimeout(() => node.remove(), 20000);
    return;
  }
  node.textContent = '"' + suggestion.name + '" — ' + who;
  const yes = document.createElement("button");
  yes.textContent = "name";
  yes.onclick = () => {
    connection.sendControl({
      kind: "suggestion.confirm", suggestion_id: suggestion.suggestion_id,
    });
    node.remove();
  };
  const no = document.createElement("button");
  no.textContent = "no";
  no.onclick = () => {
    connection.sendControl({
      kind: "suggestion.discard", suggestion_id: suggestion.suggestion_id,
    });
    node.remove();
  };
  node.append(yes, no);
  chipBox.appendChild(node);
}

function onEvent(event) {
  switch (event.kind) {
    case "transcript":
      applyTranscript({ lines: event.lines, replace: true });
      break;
    case "transcript.line":
    case "transcript.update":
      renderLine(event.line);
      break;
    case "transcript.cleared":
      transcriptBox.innerHTML = "";
      break;
    case "speaker.suggestion":
      chip(event);
      break;
    case "speaker.deleted":
      sys("deleted " + (event.label || event.speaker_id)
          + " (" + event.reference_seconds_released + "s of voice reference)",
          false);
      if (event.state) renderSpeakers(event.state.speakers);
      break;
    case "speaker.added":
    case "name.undone":
      if (event.state) renderSpeakers(event.state.speakers);
      break;
    case "speaker.named":
      connection.sendControl({ kind: "state" });
      break;
    case "state":
      if (event.state && event.state.speakers) {
        renderSpeakers(event.state.speakers);
      }
      break;
    case "session.ready":
    case "session.state":
      if (event.state && event.state.speakers) {
        renderSpeakers(event.state.speakers);
      }
      break;
    case "turn.transcript": {
      const node = turnNode(event.turn_id);
      node.querySelector(".src").textContent = event.text;
      node.dataset.lang = event.language;
      break;
    }
    case "ready":
      if (event.state && event.state.speakers) {
        renderSpeakers(event.state.speakers);
      }
      break;
    case "turn.speaker": {
      const node = turnNode(event.turn_id);
      node.dataset.speaker = event.speaker_id;
      // A voice the row does not know yet gets a button, so the correction
      // is available on the very next utterance rather than a turn later.
      if (!knownSpeakers.some((sp) => sp.speaker_id === event.speaker_id)) {
        renderSpeakers(
          knownSpeakers.concat([{ speaker_id: event.speaker_id, label: null }])
        );
      }
      node.querySelector(".who").textContent =
        event.speaker_id + " · " + (node.dataset.lang || "?");
      break;
    }
    case "turn.voice": {
      const node = turnNode(event.turn_id);
      const who = node.querySelector(".who");
      const voice = event.mode === "preset"
        ? (event.preset_label || event.preset)
        : "own voice";
      who.textContent = (node.dataset.speaker || "?") + " · "
        + (node.dataset.lang || "?") + " · " + voice;
      // A downgrade or a shared base voice is a real quality change and the
      // listener is told, rather than left to wonder why someone sounds
      // different from last turn.
      if (event.downgraded) node.classList.add("borrowed");
      if (event.notice) sys(event.notice, true);
      break;
    }
    case "turn.translation": {
      if (event.partial) break;
      const node = turnNode(event.turn_id);
      node.querySelector(".dst").textContent = event.text;
      break;
    }
    case "turn.done": {
      if (event.fallback_voice) turnNode(event.turn_id).classList.add("borrowed");
      break;
    }
    case "turn.dropped":
      sys("dropped a queued turn (" + event.reason + ")", true);
      break;
    case "resume.gap":
      sys("some turns were lost while offline", true);
      break;
    case "error":
      sys(event.stage + ": " + event.message, true);
      break;
  }
}

// ---------------------------------------------------------------------------
// Wiring.
// ---------------------------------------------------------------------------
const connection = new Connection({ onEvent });
const microphone = new Microphone(
  (frame) => connection.sendFrame(frame),
  (peak) => { el("meter").firstElementChild.style.width =
                Math.min(100, peak * 260) + "%"; },
  (text, bad) => sys(text, bad),
);

/** Show the capture chain on screen AND put it in the server log.
 *
 * Both, deliberately: the person holding the phone cannot read the server
 * log, and the person reading the log cannot see the phone. A defect that
 * lives between the microphone and the socket is invisible to each of them
 * alone -- which is exactly how the first two phone tests were spent.
 */
function reportCapture(reason) {
  const d = microphone.diagnostics();
  d.reason = reason;
  el("diag").textContent =
    "build " + d.build + " | " + d.path + " | ctx " + d.context_state + " @" +
    d.context_rate + " | track " + d.track_state +
    (d.track_muted ? " MUTED" : "") + " @" + d.track_rate +
    " | worklet " + d.worklet_calls + " (" + d.worklet_empty + " empty, ch " +
    d.worklet_channels + ") | chunks " + d.chunks + " | frames " + d.frames +
    " | peak " + d.peak;
  connection.sendControl({ kind: "diag", capture: d });
  return d;
}

const talk = el("talk");
let holding = false;
let silentCapture = null;

async function beginTalking() {
  if (holding) return;
  holding = true;
  try {
    await microphone.start();
  } catch (err) {
    // A refused or unavailable microphone must SAY so. Without this the flag
    // stayed true, the button never lit, and every later press was a silent
    // no-op -- indistinguishable from a broken server.
    holding = false;
    sys("microphone unavailable: " + (err && err.message ? err.message : err),
        true);
    setStatus("no microphone", "err");
    return;
  }
  playback.ensure();          // unlock audio output on the same gesture
  acquireWakeLock();          // keep the screen alive for the conversation
  microphone.setOpen(true);
  talk.classList.add("live");
  // If the capture graph is not actually producing frames, say so rather than
  // recording nothing in a lit-up button. 700 ms is several worklet quanta at
  // any sample rate the browser picks.
  clearTimeout(silentCapture);
  // Two stages. The first is early enough to still rescue the turn by
  // switching capture paths; the second reports whatever the outcome was.
  silentCapture = setTimeout(() => {
    if (!holding) return;
    const d = reportCapture("watchdog-400ms");
    if (d.chunks === 0) {
      // Nothing has reached the main thread at all. Whether the worklet is
      // not running or is running empty, the ScriptProcessor path does not
      // depend on either, so try it rather than losing the turn.
      microphone.startFallback();
    }
    silentCapture = setTimeout(() => {
      if (holding && microphone.sent() === 0) {
        const after = reportCapture("watchdog-1500ms");
        sys("no audio is arriving from the microphone (path " + after.path +
            ", worklet calls " + after.worklet_calls + ", chunks " +
            after.chunks + ")", true);
        setStatus("no audio from the microphone", "err");
      }
    }, 1100);
  }, 400);
}

function endTalking() {
  if (!holding) return;
  holding = false;
  clearTimeout(silentCapture);
  const sent = microphone.sent();
  microphone.setOpen(false);
  if (sent === 0) {
    // A release with no audio produces no segment and therefore no turn. The
    // server cannot distinguish it from a user who said nothing, so the
    // client is the only place this can be reported.
    reportCapture("release-empty");
    sys("released without any audio -- nothing was sent for this turn", true);
  } else {
    reportCapture("release-ok");
  }
  connection.sendControl({ kind: "release" });
  talk.classList.remove("live");
}

/** Hold-to-speak, optionally attributed to one speaker (design 17.5).
 *
 * A speaker button ARMS the server before recording, so the utterance skips
 * identification entirely rather than being identified and then overruled --
 * overruling would still have folded the segment into the wrong centroid on
 * the way past. The arming lasts exactly one utterance; the server clears it.
 */
let activeButton = null;
let startedAt = 0;
const MIN_TURN_MS = 300;

/** Tap to speak, tap again to stop (user order, replaces press-and-hold).
 *
 * Holding was the original design and it lost to the platform: on Android a
 * long press on any element is the text-selection gesture, so the press was
 * cancelled mid-utterance and the user was left holding a selection handle.
 * Tapping sidesteps the gesture entirely; the CSS hardening above stays
 * anyway, because a button that can be "selected" is a bug in either model.
 *
 * A speaker button ARMS the server first, so the utterance skips
 * identification rather than being identified and then overruled.
 */
function toggleTalk(node, speakerId) {
  if (activeButton && activeButton !== node) {
    // Switching speaker mid-recording ends the current turn rather than
    // silently reattributing it.
    stopTalk();
  }
  if (activeButton === node) {
    if (Date.now() - startedAt < MIN_TURN_MS) {
      // Named, not silent: a stray double tap would otherwise send an empty
      // turn and look like the app ignoring the press.
      sys("that was a double tap, still recording", false);
      return;
    }
    stopTalk();
    return;
  }
  if (speakerId) {
    connection.sendControl({ kind: "speaker.arm", speaker_id: speakerId });
  }
  activeButton = node;
  startedAt = Date.now();
  node.classList.add("live");
  node.dataset.idle = node.textContent;
  node.textContent = "tap to stop";
  beginTalking();
}

function stopTalk() {
  const node = activeButton;
  activeButton = null;
  if (node) {
    node.classList.remove("live");
    if (node.dataset.idle) node.textContent = node.dataset.idle;
  }
  endTalking();
}

function bindTalkButton(node, speakerId) {
  // Pointer events only, and the context menu is refused: both halves of the
  // long-press gesture have to be closed or Android reopens it.
  node.addEventListener("contextmenu", (e) => e.preventDefault());
  node.addEventListener("selectstart", (e) => e.preventDefault());
  node.addEventListener("pointerup", (e) => {
    e.preventDefault();
    if (node.dataset.renamed === "1") { node.dataset.renamed = "0"; return; }
    toggleTalk(node, speakerId);
  });
}

bindTalkButton(talk, null);

el("mode").addEventListener("change", async (e) => {
  if (e.target.value === "vad") {
    try {
      await microphone.start();
    } catch (err) {
      sys("microphone unavailable: " + (err && err.message ? err.message : err),
          true);
      setStatus("no microphone", "err");
      e.target.value = "ptt";
      return;
    }
    playback.ensure();
    acquireWakeLock();
    microphone.setOpen(true);         // server-side VAD segments the stream
    setTimeout(() => {
      if (microphone.sent() === 0) {
        sys("listening, but no audio is arriving from the microphone", true);
        setStatus("no audio from the microphone", "err");
      }
    }, 1000);
    talk.textContent = "listening (auto)";
    talk.disabled = true;
  } else {
    stopTalk();
    microphone.setOpen(false);
    talk.textContent = "tap to speak";
    talk.disabled = false;
  }
});

// Voice mode. Applies to the live session immediately; the server refuses
// preset mode when no pool is loaded and the refusal is shown rather than
// swallowed, because a toggle that appears to work and does not is worse than
// one that is greyed out.
el("voice").addEventListener("change", async (e) => {
  const mode = e.target.value;
  if (!connection.sessionId) { sys("no session yet", true); return; }
  const response = await fetch(
    BASE + "api/translator/sessions/" + connection.sessionId + "/voice",
    { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ mode }) });
  if (response.ok) {
    sys("voice mode: " + mode);
  } else {
    const detail = await response.json().catch(() => ({}));
    sys("voice mode refused: " + (detail.detail || response.status), true);
    e.target.value = mode === "preset" ? "clone" : "preset";
  }
});

// Screen-off operation is the known PWA wall: Android suspends a backgrounded
// page's AudioContext and no web API overrides that. A wake lock keeps the
// screen on while the app is in use, which makes screen-on the MVP's stated
// constraint rather than an unexplained failure. Losing the lock is not an
// error -- it is released automatically when the page hides.
let wakeLock = null;
async function acquireWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (err) {
    sys("screen wake lock unavailable; the screen may sleep mid-conversation");
  }
}

el("enroll").addEventListener("click", async () => {
  sys("enrollment: speak for 15 seconds after the beep");
  await microphone.start();
  const collected = [];
  const capture = (frame) => collected.push(new Uint8Array(frame));
  const original = microphone.onFrame;
  microphone.onFrame = capture;
  microphone.setOpen(true);
  setTimeout(async () => {
    microphone.setOpen(false);
    microphone.onFrame = original;
    let total = 0;
    collected.forEach((c) => (total += c.length));
    const merged = new Uint8Array(total);
    let at = 0;
    for (const c of collected) { merged.set(c, at); at += c.length; }
    let binary = "";
    for (let i = 0; i < merged.length; i++) binary += String.fromCharCode(merged[i]);
    const response = await fetch(
      BASE + "api/translator/enroll/" + connection.sessionId,
      { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          label: "user",
          audio: { encoding: "pcm16", sample_rate: PIPELINE_RATE,
                   data: btoa(binary) },
        }) });
    sys(response.ok ? "enrolled your voice" : "enrollment failed", !response.ok);
  }, 15000);
});

// The language picker is filled from the server's runtime-derived set. No
// language is written into this page: what the deployment can do is whatever
// the intersection of its backends says it can do.
// Fake backends must announce themselves. A tester who does not know the
// recognizer is a stub reads the resulting nonsense as "the translator is
// broken", which wastes their time and mine. The banner names exactly which
// stages are stubbed rather than saying "demo mode", because a partially real
// stack is the normal state during bring-up.
function announceFakeBackends(backends) {
  const stubbed = Object.entries(backends || {})
    .filter(([, name]) => String(name).startsWith("fake"))
    .map(([stage]) => stage);
  if (!stubbed.length) return;
  const box = el("demo");
  box.innerHTML =
    "<b>Transport test build.</b> These stages are stubs, not real models: "
    + "<b>" + stubbed.join(", ") + "</b>. "
    + "Connection, push-to-talk, reconnect and the UI are real and worth "
    + "testing. Transcripts and audio are placeholders \u2014 nonsense output "
    + "here is expected and is not a translator fault.";
  box.classList.add("on");
}

// ---------------------------------------------------------------------------
// Routing: a set of UNORDERED language pairs.
// ---------------------------------------------------------------------------
// One row is one relationship, both directions. A language appearing in two
// rows FANS OUT -- the utterance is rendered in both, played one after the
// other -- which is why the note below turns into a latency warning rather
// than an error: fan-out is what the user asked for, it just costs a second
// synthesis per extra target.
//
// The dropdowns are built from the capability endpoint's `selectable` list, so
// a language this deployment cannot run appears GREYED OUT WITH ITS REASON
// instead of quietly missing. "es is not in the list" is unactionable;
// "es -- TTS cannot speak it" tells the user which checkpoint is the problem.
const routing = { selectable: [], rows: [] };

function languageOptions(select, chosen) {
  select.innerHTML = "";
  const blank = document.createElement("option");
  blank.value = "";
  blank.textContent = "—";
  select.appendChild(blank);
  for (const entry of routing.selectable) {
    const option = document.createElement("option");
    option.value = entry.code;
    option.textContent = entry.endonym + " (" + entry.code + ")"
      + (entry.usable ? "" : " — " + entry.reason);
    option.disabled = !entry.usable;
    option.selected = entry.code === chosen;
    select.appendChild(option);
  }
}

function renderPairs() {
  const box = el("pairs");
  box.innerHTML = "";
  routing.rows.forEach((row, index) => {
    const line = document.createElement("div");
    line.className = "pair";
    const left = document.createElement("select");
    const arrows = document.createElement("span");
    arrows.className = "arrows";
    arrows.textContent = "↔";
    const right = document.createElement("select");
    languageOptions(left, row.a);
    languageOptions(right, row.b);
    left.addEventListener("change", () => { row.a = left.value; describeRouting(); });
    right.addEventListener("change", () => { row.b = right.value; describeRouting(); });
    const drop = document.createElement("button");
    drop.className = "small";
    drop.textContent = "−";
    drop.title = "remove this pair";
    drop.addEventListener("click", () => {
      routing.rows.splice(index, 1);
      renderPairs();
    });
    line.append(left, arrows, right, drop);
    box.appendChild(line);
  });
  describeRouting();
}

function describeRouting() {
  const note = el("routingnote");
  const counts = {};
  let complete = 0;
  for (const row of routing.rows) {
    if (!row.a || !row.b || row.a === row.b) continue;
    complete += 1;
    counts[row.a] = (counts[row.a] || 0) + 1;
    counts[row.b] = (counts[row.b] || 0) + 1;
  }
  const fanned = Object.entries(counts).filter(([, n]) => n > 1);
  if (!complete) {
    note.className = "note";
    note.textContent = "No complete pair yet. With none applied the system "
      + "routes automatically over the conversation languages.";
    return;
  }
  if (!fanned.length) {
    note.className = "note";
    note.textContent = complete + " pair" + (complete === 1 ? "" : "s")
      + ", both directions each.";
    return;
  }
  note.className = "note warn";
  note.textContent = fanned
    .map(([code, n]) => code + " → " + n + " languages")
    .join("; ")
    + ". Each extra target is a second translation and synthesis, played "
    + "after the first — so a turn takes noticeably longer than with a "
    + "single pair.";
}

el("routemode").addEventListener("change", async (e) => {
  const manual = e.target.value === "manual";
  el("routing").classList.toggle("on", manual);
  if (manual && !routing.rows.length) {
    routing.rows.push({ a: "", b: "" });
    renderPairs();
  }
  if (!manual) await sendPairs([]);
});

el("addpair").addEventListener("click", () => {
  routing.rows.push({ a: "", b: "" });
  renderPairs();
});

el("applypairs").addEventListener("click", async () => {
  const pairs = routing.rows
    .filter((row) => row.a && row.b && row.a !== row.b)
    .map((row) => ({ a: row.a, b: row.b }));
  await sendPairs(pairs);
});

async function sendPairs(pairs) {
  if (!connection.sessionId) { sys("not connected yet", true); return; }
  const response = await fetch(
    BASE + "api/translator/sessions/" + connection.sessionId + "/routing",
    { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ pairs }) });
  if (!response.ok) {
    let detail = "routing rejected";
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    sys(detail, true);
    return;
  }
  const state = await response.json();
  sys(state.routing_mode === "manual"
    ? "routing: " + state.routing_pairs.map((p) => p.a + "↔" + p.b).join(", ")
    : "routing: automatic");
}

fetch(BASE + "api/translator/languages").then((r) => r.json()).then((info) => {
  announceFakeBackends(info.backends);
  routing.selectable = info.selectable || [];
  const picker = el("langs");
  picker.size = Math.min(6, Math.max(2, info.bidirectional.length));
  for (const lang of info.bidirectional) {
    const option = document.createElement("option");
    option.value = lang.code;
    option.textContent = lang.endonym + " (" + lang.code + ")";
    option.selected = info.default_participants.includes(lang.code);
    picker.appendChild(option);
  }
  picker.addEventListener("change", () => {
    const chosen = Array.from(picker.selectedOptions).map((o) => o.value);
    if (chosen.length < 2) { sys("pick at least two languages", true); return; }
    connection.participants = chosen;
    sys("languages set to " + chosen.join(", ") + "; reconnecting");
    connection.sessionId = null;
    connection.cursor = 0;
    if (connection.ws) connection.ws.close();
  });
  if (!info.default_participants_supported) {
    sys("default pair unsupported: " + info.default_participants_error, true);
  }
  talk.disabled = false;
}).catch(() => sys("could not read the language set", true));

document.addEventListener("visibilitychange", () => {
  // Backgrounding a PWA suspends its AudioContext on Android. Nothing here can
  // prevent that; the reconnect path picks the conversation back up when the
  // page returns. Lock-screen operation needs a native client.
  if (!document.hidden) {
    acquireWakeLock();
    if (connection.ws && connection.ws.readyState !== WebSocket.OPEN) {
      connection.connect();
    }
  }
});

connection.connect();
</script>
