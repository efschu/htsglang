      // An `applied` suggestion is a rename that already happened (design
      // 17.3b: a self-introduction applies rather than queueing). The event
      // carries no roster, so the roster is asked for.
      if (event.applied) refreshRoster();
      break;
    case "suggestion.applied":
      refreshRoster();
      break;
    case "speaker.deleted":
      sys("deleted " + (event.label || event.speaker_id)
          + " (" + event.reference_seconds_released + "s of voice reference)",
          false);
      applyState(event.state);
      break;
    case "speaker.merged":
      // The reattributed lines arrive as ordinary transcript updates and have
      // already repainted themselves; this only says what happened and takes
      // the new roster. Said out loud because a merge is destructive and the
      // count is the one number that tells the user it did what they meant.
      sys("merged into " + (event.label || event.target_id) + " — "
          + event.lines_reattributed + " line"
          + (event.lines_reattributed === 1 ? "" : "s") + " re-attributed",
          false);
      applyState(event.state);
      break;
    case "speaker.added":
    case "name.undone":
      applyState(event.state);
      if (!event.state) refreshRoster();
      break;
    // Whatever the server side settles on for "this speaker changed", it
    // lands here: with a roster it is applied, without one it is asked for.
    case "speaker.updated":
    case "speaker.renamed":
      if (event.state) applyState(event.state);
      else refreshRoster();
      break;
    case "speaker.named":
      refreshRoster();
      break;
    case "speaker.armed":
      markArmed(event.speaker_id);
      break;
    case "output.mode":
      // The server's answer is the truth; the optimistic paint above is only
      // a guess until this arrives, and a refusal corrects it here.
      setOutputMode(event.mode, event.mode !== outputMode);
      break;
    case "turn.opened":
      setState("working", "translating");
      setTurnState(event.turn_id, "translating");
      // The arming the server just consumed is put back, so the NEXT segment
      // is still the pinned speaker's. See `pinnedSpeaker` for why this is a
      // mitigation and not the fix.
      rearmPin();
      break;
    // Per-unit synthesis state, one frame per transition in the worker. It
    // REFINES what the clock and the clause partials already show -- it does
    // not replace them, because the clock is the only thing that knows when
    // the listener has actually heard the tail, and it keeps working when
    // this frame does not arrive at all.
    case "turn.speech": {
      const spoken = event.state === "spoken";
      noteUnit(event.turn_id, event.unit_index, spoken);
      if (event.state === "queued") setTurnState(event.turn_id, "queued");
      else if (event.state === "synthesizing") {
        setTurnState(event.turn_id, "synthesizing");
      } else if (spoken && !playback.busy) {
        // The server has handed over the last unit and nothing is left on the
        // clock: only then is the turn finished from where the listener sits.
        const entry = turnUnits.get(event.turn_id);
        if (entry && entry.spoken >= entry.units) {
          setTurnState(event.turn_id, "done");
        }
      }
      paintActivity();
      break;
    }
    case "turn.transcript": {
      if (event.empty) {
        sys("nothing was recognised in that turn (" + event.reason + ")", true);
        setState("ready", "ready");
        break;
      }
      rearmPin();
      const node = bubbleFor(event.turn_id);
      node.querySelector(".src").textContent = event.text;
      node.querySelector(".lang").textContent = event.language || "";
      node.dataset.lang = event.language;
      setSide(node, event.language);
      renderTools(node, null);
      break;
    }
    case "turn.speaker": {
      const node = bubbleFor(event.turn_id);
      node.dataset.speaker = event.speaker_id;
      // A voice the row does not know yet gets a button, so the correction
      // is available on the very next utterance rather than a turn later.
      if (!knownSpeakers.some((sp) => sp.speaker_id === event.speaker_id)) {
        // Optimistic, so the correction is available on the very next
        // utterance -- and then reconciled against the session, which stays
        // the only authority on who exists and what they are called.
        renderSpeakers(
          knownSpeakers.concat([{ speaker_id: event.speaker_id, label: null }])
        );
        refreshRoster();
      }
      paintSpeaker(node, event.speaker_id, null);
      break;
    }
    case "turn.voice": {
      const node = bubbleFor(event.turn_id);
      const tag = node.querySelector(".voice");
      tag.hidden = false;
      if (event.output_mode === "silent") {
        tag.textContent = "reading mode";
      } else {
        tag.textContent = event.mode === "preset"
          ? (event.preset_label || event.preset) : "own voice";
      }
      // A downgrade or a shared base voice is a real quality change and the
      // listener is told, rather than left to wonder why someone sounds
      // different from last turn.
      if (event.downgraded) node.classList.add("borrowed");
      if (event.notice) sys(event.notice, true);
      break;
    }
    case "turn.queued": {
      // One synthesizer serves every conversation, so a turn can be waiting
      // rather than working. Saying which is the whole point: a queue nobody
      // can see is indistinguishable from a translator that has frozen.
      // Written into the translation slot, so the translation itself clears
      // it -- no timer, no second event to miss.
      const dst = bubbleFor(event.turn_id).querySelector(".dst");
      if (!dst.textContent) {
        dst.textContent = "waiting - another turn is being spoken";
        dst.className = "dst waiting";
      }
      // Short on purpose: the header pill shares one row with the
      // settings control, and a sentence there costs the user a button.
      setState("queued", "queued");
      setTurnState(event.turn_id, "queued");
      break;
    }
    case "turn.translation": {
      // PARTIALS ARE THE POINT, and this line used to be `if (event.partial)
      // break;` -- inherited from the surface before the server decoupled its
      // text. The server emits one event per clause as the translation is
      // produced, 2.6 to 5.8 s ahead of the audio, and every one of them was
      // dropped: the bubble sat on "translating" until the FINAL event, which
      // the server only sends after the audio worker has drained. So the user
      // watched a placeholder until the sentence had already been spoken --
      // the text was early and the screen was late.
      //
      // A partial carries ONE clause, not the text so far, so they are
      // accumulated in the order they arrive; the final non-partial carries
      // the whole joined text and replaces the accumulation, which keeps the
      // server the authority on the finished line.
      if (event.empty) {
        sys("not translated: " + event.reason, true);
        setState("ready", "ready");
        break;
      }
      const node = bubbleFor(event.turn_id);
      const dst = node.querySelector(".dst");
      if (dst.classList.contains("waiting")) { dst.textContent = ""; }
      dst.className = "dst";
      let row = dst.querySelector('[data-target="' + event.target + '"]');
      if (!row) {
        row = document.createElement("div");
        row.className = "tr";
        row.dataset.target = event.target || "";
        const code = document.createElement("span");
        code.className = "code";
        code.textContent = event.target || "";
        const text = document.createElement("span");
        text.className = "txt";
        row.append(code, text);
        dst.appendChild(row);
      }
      const txt = row.querySelector(".txt");
      if (event.partial) {
        // Joined with a space, the same way the server joins its pieces for
        // the final event, so the growing line and the finished one read
        // identically rather than reflowing at the end.
        const grown = (row.dataset.partial ? row.dataset.partial + " " : "")
          + String(event.text || "").trim();
        row.dataset.partial = grown;
        txt.textContent = grown;
        row.classList.add("growing");
        noteUnit(event.turn_id, null, false);
        // The talker is already working on the first clause by the time its
        // text lands, so this is "being spoken", not "still translating".
        setTurnState(event.turn_id, "synthesizing");
      } else {
        txt.textContent = event.text;
        row.classList.remove("growing");
        delete row.dataset.partial;
      }
      break;
    }
    case "turn.unrouted": {
      // The turn was understood and deliberately not translated. Saying so is
      // the difference between a configuration problem and a dead app.
      const node = bubbleFor(event.turn_id);
      const dst = node.querySelector(".dst");
      dst.className = "dst waiting";
      dst.textContent = "not translated — " + (event.reason || "no route");
      setTurnState(event.turn_id, "done");
      break;
    }
    case "turn.done": {
      if (event.fallback_voice) bubbleFor(event.turn_id).classList.add("borrowed");
      // `turn.done` means the SERVER is finished, not that the listener has
      // heard it: the tail is still on the output clock. The ticker retires
      // the turn when the clock actually drains -- which is the whole point
      // of the order, because "it looked finished and then kept talking" is
      // exactly this gap.
      setTurnState(event.turn_id,
                   playback.busy ? "speaking" : "done");
      if (uiState !== "recording") {
        setState(playback.busy ? "speaking" : "ready",
                 playback.busy ? "speaking" : "ready");
      }
      break;
    }
    case "turn.dropped":
      sys("dropped a queued turn (" + event.reason + ")", true);
      setTurnState(event.turn_id, "done");
      break;
    case "resume.gap":
      sys("some turns were lost while offline", true);
      break;
    // The ACK. Confirmation, not precondition: the audio was already cut when
    // the frame went out, so nothing here has to happen for the button to
    // have worked. What it adds is the server's own account -- which turn it
    // aborted (ours was a guess from the last frame seen) and how many queued
    // turns went with it, which is a real loss and therefore said out loud.
    case "playback.stop.ack":
      stopFramePending = Math.max(0, stopFramePending - 1);
      stopEpoch = Math.max(stopEpoch, Number(event.stop_epoch) || 0);
      markStopped(event.aborted_turn_id);
      if (event.dropped_queued) {
        sys("stopped: " + event.dropped_queued + " queued turn"
            + (event.dropped_queued === 1 ? "" : "s") + " dropped with it");
      }
      break;
    // The journalled event. Unlike the ack this REPLAYS, so it also arrives
    // on a reconnect -- which is what makes a stop survive in the record
    // rather than being something only the tab that did it remembers.
    case "playback.stopped":
      stopEpoch = Math.max(stopEpoch, Number(event.stop_epoch) || 0);
      markStopped(event.aborted_turn_id);
      break;
    case "error":
      // A protocol complaint about the stop frame is OUR problem, not the
      // user's: the client half shipped first, and the local cut already
      // happened. Swallow exactly one such complaint per frame sent, and
      // nothing else -- an error that is merely inconvenient must still be
      // shown, or this becomes the hole every later defect hides in.
      if (event.stage === "protocol" && stopFramePending > 0
          && String(event.message || "").indexOf(STOP_FRAME_KIND) >= 0) {
        stopFramePending -= 1;
        break;
      }
      sys(event.stage + ": " + event.message, true);
      break;
  }
}

// The language set is filled from the server's runtime-derived capability
// report. No language is written into this page: what the deployment can do
// is whatever the intersection of its backends says it can do.
fetch(BASE + "api/translator/languages").then((r) => r.json()).then((info) => {
  announceFakeBackends(info.backends);
  catalogue.bidirectional = info.bidirectional || [];
  catalogue.selectable = info.selectable || [];
  // ONE normalized list feeds the picker, whatever shape the capability
  // report arrives in. Every language any stage knows is in it -- the picker
  // marks what is missing rather than hiding the entry, because "es is not in
  // the list" is unactionable and "es -- TTS cannot speak it" is not.
  catalogue.all = normalizeLanguages(info);
  slots = (info.default_participants || []).slice();
  renderLangBar();
  if (!info.default_participants_supported) {
    sys("default pair unsupported: " + info.default_participants_error, true);
  }
  talk.disabled = false;
}).catch(() => sys("could not read the language set", true));

document.addEventListener("visibilitychange", () => {
  // Backgrounding a PWA suspends its AudioContext on Android -- SOMETIMES.
  // With a wake lock held it can keep running, which is how a phone in a
  // pocket spoke translations nobody was there for, and how a backlog fired
  // on return. The rule (user order 2026-08-04) is simple and enforced at
  // both ends: hidden means nothing plays AND nothing stays queued.
  if (document.hidden) {
    const cut = playback.stopAll();
    if (cut) playback.heldWhileHidden += cut;
    return;
  }
  acquireWakeLock();
  if (connection.ws && connection.ws.readyState !== WebSocket.OPEN) {
    connection.connect();
  }
  // Say what was withheld, once, as TEXT. The translations themselves are
  // already in the transcript above -- what the user needs is to know that
  // they happened while the screen was off, not to hear them now, detached
  // from the exchange they belonged to.
  if (playback.heldWhileHidden > 0) {
    sys("some translations arrived while the screen was off — they are in "
        + "the transcript, and were not spoken", false);
    playback.heldWhileHidden = 0;
  }
});

// The speaking state has no event of its own -- the output clock is the only
// thing that knows when the last buffer has been heard. Polled, cheaply,
// rather than guessed from a timer per turn.
let tick = 0;
setInterval(() => {
  tick += 1;
  if (uiState === "speaking" && !playback.busy) setState("ready", "ready");
  // A turn is finished when the LISTENER has heard it, which only the output
  // clock knows. `turn.done` arrives while the tail is still scheduled, and
  // treating that as finished is precisely the "it looked done and then kept
  // talking" the order is about.
  if (!playback.busy) {
    for (const [turnId, state] of Array.from(turnWork)) {
      if (state === "speaking") setTurnState(turnId, "done");
    }
    playback.currentTurn = null;
  }
  paintActivity();
  // The stop control exists exactly as long as there is something to stop --
  // including while the microphone is open, because a listener who starts
  // talking over the playback is precisely the person who wants it cut.
  if (playback.busy && outputMode !== "silent") showStop();
  else hideStop();
  // The link measurement is a background reading, not a heartbeat: once every
  // fifth tick is plenty and keeps the socket quiet.
  if (tick % 5 === 0 && (uiState === "ready" || uiState === "speaking")) {
    connection.ping();
  }
}, 1000);

initTheme();
watchStream();
setOutputMode("voice", false);
paintActivity();
el("gear").innerHTML = ICON.gear;
el("sheetclose").innerHTML = ICON.close;
updateLink();
renderSpeakers([]);
connection.connect();
</script>
