  if (streamResize) streamResize.observe(node);
  return node;
}

function setSide(node, language) {
  const index = slots.indexOf(language);
  node.dataset.side = index === 1 ? "right" : "left";
}

function paintSpeaker(node, speakerId, label) {
  const shown = label || speakerLabel(speakerId) || speakerId || "";
  node.style.setProperty("--sp", speakerColor(speakerId));
  node.querySelector(".avatar").textContent = initials(shown);
  node.querySelector(".who").textContent = shown;
}

/** Render one durable transcript line (design 17.2/17.3/17.4). */
function renderLine(line) {
  if (!line) return;
  lineData.set(line.line_id, line);

  if (line.kind === "notice") {
    let node = lineNodes.get(line.line_id);
    if (!node) {
      node = document.createElement("div");
      node.className = "line notice";
      lineNodes.set(line.line_id, node);
      streamBox().appendChild(node);
    }
    node.textContent = line.text;
    follow();
    return;
  }

  // Bind to the bubble the live events already created for this turn, so the
  // sentence is not shown twice.
  let node = lineNodes.get(line.line_id)
    || (line.turn_id ? bubbles.get(line.turn_id) : null);
  if (!node) {
    node = bubbleFor(line.turn_id || ("line:" + line.line_id));
  }
  node.dataset.line = line.line_id;
  lineNodes.set(line.line_id, node);
  if (line.turn_id) bubbles.set(line.turn_id, node);

  node.classList.toggle("uncertain", line.confidence === "uncertain");
  // The line knows a name the button row does not: ask the session, once.
  if (rosterLags(line)) refreshRoster();
  paintSpeaker(node, line.speaker_id, line.speaker_label);
  setSide(node, line.source_language);
  node.querySelector(".lang").textContent = line.source_language || "";
  node.querySelector(".src").textContent = line.source_text || "";

  const stopmark = node.querySelector(".stopmark");
  if (stopmark) stopmark.hidden = !node.classList.contains("stopped");
  const badge = node.querySelector(".badge");
  if (line.confidence === "uncertain") {
    badge.hidden = false;
    badge.className = "tag badge warn";
    badge.textContent = "who spoke?";
  } else if (line.origin === "manual") {
    badge.hidden = false;
    badge.className = "tag badge ok";
    badge.textContent = "you said so";
  } else if (line.resolved_by) {
    badge.hidden = false;
    badge.className = "tag badge ok";
    badge.textContent = "resolved";
  } else {
    badge.hidden = true;
  }

  const dst = node.querySelector(".dst");
  const targets = Object.keys(line.translations || {}).sort();
  if (targets.length) {
    dst.className = "dst";
    dst.innerHTML = "";
    for (const target of targets) {
      const row = document.createElement("div");
      row.className = "tr";
      const code = document.createElement("span");
      code.className = "code";
      code.textContent = target;
      const text = document.createElement("span");
      text.textContent = line.translations[target];
      row.append(code, text);
      dst.appendChild(row);
    }
  } else if (!dst.textContent) {
    dst.className = "dst waiting";
    dst.textContent = "translating";
  }

  // The top-3 candidates, ranked by the similarity the assignment itself
  // used (design 17.4). A tap resolves the line; nothing is folded into a
  // centroid before that.
  const cands = node.querySelector(".cands");
  cands.innerHTML = "";
  if (line.confidence === "uncertain" && (line.candidates || []).length) {
    cands.hidden = false;
    for (const candidate of line.candidates) {
      const button = document.createElement("button");
      button.className = "cand" + (candidate.new ? " new" : "");
      button.textContent = (candidate.new
        ? candidate.label + " (new)" : candidate.label)
        + "  " + candidate.similarity;
      button.onclick = (event) => {
        event.stopPropagation();
        connection.sendControl({
          kind: "line.resolve", line_id: line.line_id,
          speaker_id: candidate.new ? null : candidate.speaker_id,
        });
      };
      cands.appendChild(button);
    }
  } else {
    cands.hidden = true;
  }

  renderTools(node, line);
  follow();
}

/** Per-line controls: replay, fold the original away, undo a resolution. */
function renderTools(node, line) {
  const tools = node.querySelector(".tools");
  tools.innerHTML = "";
  const turnId = node.dataset.turn;
  if (turnId && audioStore.has(turnId)) {
    const play = document.createElement("button");
    play.innerHTML = ICON.play + "<span>replay</span>";
    play.onclick = (event) => { event.stopPropagation(); replayTurn(turnId); };
    tools.appendChild(play);
  }
  if (node.querySelector(".src").textContent) {
    const fold = document.createElement("button");
    const folded = node.classList.contains("folded");
    // Icon only: this control repeats on every bubble, and a worded button
    // per line turned the scrollback into a column of "hide original".
    fold.innerHTML = ICON.eye;
    fold.title = folded ? "show the original" : "hide the original";
    fold.setAttribute("aria-label", fold.title);
    fold.onclick = (event) => {
      event.stopPropagation();
      node.classList.toggle("folded");
      renderTools(node, line);
    };
    tools.appendChild(fold);
  }
  // A resolution is a human decision and must be undoable (design 17.0.4).
  if (line && line.resolved_by === "user") {
    const undo = document.createElement("button");
    undo.textContent = "undo";
    undo.onclick = (event) => {
      event.stopPropagation();
      connection.sendControl({ kind: "line.undo", line_id: line.line_id });
    };
    tools.appendChild(undo);
  }
}

function markReplayable(turnId) {
  const node = bubbles.get(turnId);
  if (!node) return;
  const line = node.dataset.line ? lineData.get(Number(node.dataset.line)) : null;
  renderTools(node, line);
}

function replayTurn(turnId) {
  const entry = audioStore.get(turnId);
  if (!entry) return;
  if (!playback.replay(entry)) {
    sys("the browser is not letting this page make a sound yet", true);
    el("blocked").classList.add("on");
  }
}

function clearStream() {
  // The nodes go with the innerHTML, and so must their resize observations --
  // an observer holding detached elements keeps them alive for nothing.
  if (streamResize) {
    for (const node of bubbles.values()) streamResize.unobserve(node);
  }
  streamBox().innerHTML = "";
  bubbles.clear();
  lineNodes.clear();
  lineData.clear();
  // An empty stream is at its end by definition; leaving `following` off here
  // would strand the reader off the live end of the NEXT conversation.
  following = true;
  paintUnread(false);
}

function applyTranscript(payload) {
  if (!payload.lines) return;
  if (payload.replace) clearStream();
  for (const line of payload.lines) renderLine(line);
  // A restore lands the reader at the live end regardless of where they were
  // before the reconnect: the scroll position they had belonged to a DOM that
  // no longer exists.
  following = true;
  scrollToEnd();
  paintUnread(false);
}

/** The transcript as text, for copy/share (design 19.6). */
function transcriptText() {
  const out = [];
  const ids = Array.from(lineData.keys()).sort((a, b) => a - b);
  for (const id of ids) {
    const line = lineData.get(id);
    if (line.kind === "notice") { out.push("-- " + line.text); continue; }
    out.push((line.speaker_label || line.speaker_id) + " ["
      + line.source_language + "]: " + line.source_text);
    for (const target of Object.keys(line.translations || {}).sort()) {
      out.push("    [" + target + "] " + line.translations[target]);
    }
  }
  return out.join("\n");
}

// ---------------------------------------------------------------------------
// Speaker row (design 17.5) and name chips (17.3).
// ---------------------------------------------------------------------------
/** What the CONNECTED server can do, from its own state frame.
 *
 * This page is served from the worktree and re-read per request, so a
 * client-side change is live the moment it is merged, while its server half
 * waits for a tenant restart. In that window a gesture whose control the
 * server does not understand would look like the app ignoring the user. The
 * capability is therefore asked for rather than assumed, and an older server
 * that does not send the key leaves the gesture unbound until it is restarted
 * -- with no second client deploy needed to switch it on.
 */
let serverSupports = {};

function renderSpeakers(speakers) {
  knownSpeakers = speakers || [];
  const row = el("speakers");
  row.innerHTML = "";
  for (const speaker of knownSpeakers) {
    const cell = document.createElement("div");
    cell.className = "sp";
    cell.dataset.speaker = speaker.speaker_id;
    const shown = speaker.label || speaker.speaker_id;

    const button = document.createElement("button");
    button.className = "who";
    button.dataset.speaker = speaker.speaker_id;
    const dot = document.createElement("i");
    dot.className = "avatar";
    dot.style.background = speakerColor(speaker.speaker_id);
    dot.textContent = initials(shown);
    const label = document.createElement("span");
    label.className = "lbl";
    label.textContent = shown;
    button.append(dot, label);
    bindTalkButton(button, speaker.speaker_id);
    bindSpeakerHold(cell, button, speaker);

    // Delete, on the main page, at the entry itself (user order 2026-08-03:
    // "man muss speaker direkt dort loeschen koennen auf der hauptseite").
    // It was only reachable through a long press into a sheet, which is a
    // gesture nobody finds and which now belongs to the merge drag.
    const kill = document.createElement("button");
    kill.className = "x";
    kill.textContent = "×";
    kill.title = "delete " + shown;
    kill.setAttribute("aria-label", "delete " + shown);
    kill.onclick = (event) => {
      event.stopPropagation();
      event.preventDefault();
      confirmDeleteSpeaker(speaker);
    };
    // The cell is inside the talk row; a stray press on the delete control
    // must never reach the speak button underneath it.
    kill.addEventListener("pointerdown", (e) => e.stopPropagation());
    kill.addEventListener("pointerup", (e) => e.stopPropagation());

    // Rename, on the main page (user order 2026-08-04). It had become
    // unreachable: naming lived behind the 600 ms long press into the sheet,
    // and `bindSpeakerHold` opens that sheet only `if (!canMerge)` -- so on a
    // server announcing `speaker_merge`, which is every server since the last
    // restart, the only surviving path was to start a merge drag and drop it
    // on empty space. A capability shipped for one feature silently removed
    // the affordance of another.
    const ren = document.createElement("button");
    ren.className = "ren";
    ren.textContent = "✎";
    ren.title = "rename " + shown;
    ren.setAttribute("aria-label", "rename " + shown);
    ren.onclick = (event) => {
      event.stopPropagation();
      event.preventDefault();
      promptRenameSpeaker(speaker);
    };
    ren.addEventListener("pointerdown", (e) => e.stopPropagation());
    ren.addEventListener("pointerup", (e) => e.stopPropagation());

    cell.append(button, ren, kill);
    row.appendChild(cell);
  }
  const add = document.createElement("button");
  add.className = "add";
  add.innerHTML = ICON.plus;
  add.setAttribute("aria-label", "somebody new is speaking");
  add.onclick = openAddSpeakerSheet;
  row.appendChild(add);
}

/** Delete one speaker, from the roster, with a confirmation.
 *
 * The transcript is explicitly NOT touched: the server keeps every line this
 * speaker said, under the name it had at the time (`speakers.remove`, whose
 * docstring argues the case). Saying so in the confirmation matters -- "their
 * voice is lost" reads as "the conversation is lost" if nobody says otherwise.
 */
async function confirmDeleteSpeaker(speaker) {
  const shown = speaker.label || speaker.speaker_id;
  const ok = await askConfirm(
    "delete " + shown + "?",
    "Their voice reference and their preset voice are released. Everything "
    + "they said stays in the transcript.", "delete");
  if (!ok) return;
  connection.sendControl({
    kind: "speaker.delete", speaker_id: speaker.speaker_id,
  });
}

/** Long press on a roster entry: lift it, and drop it on somebody to merge.
 *
 * MERGE IS DESTRUCTIVE, so the gesture is deliberately the slow one and the
 * drop is confirmed. Delete keeps the explicit control instead of sharing the
 * press: one gesture must not mean two irreversible things.
 *
 * Released without having moved onto another entry, the long press still
 * opens the speaker sheet, which is where renaming lives and where it stays.
 * That is why the sheet is opened on RELEASE rather than when the timer
 * fires: the same press has to be able to become a drag.
 */
function bindSpeakerHold(cell, button, speaker) {
  const row = el("speakers");
  const canMerge = !!serverSupports.speaker_merge;
  let hold = null;
  let dragging = false;
  let target = null;

  const cellAt = (x, y) => {
    const node = document.elementFromPoint(x, y);
    const found = node && node.closest ? node.closest("#speakers .sp") : null;
    return found && found !== cell ? found : null;
  };
  const paint = (next) => {
    if (target === next) return;
    if (target) target.classList.remove("droptarget");
    target = next;
    if (target) target.classList.add("droptarget");
  };
  const lift = () => {
    dragging = true;
    row.classList.add("merging");
    cell.classList.add("dragging");
    for (const other of row.querySelectorAll(".sp")) {
      if (other !== cell) other.classList.add("dropzone");
    }
    const hint = document.createElement("div");
    hint.className = "mergehint";
    hint.textContent = "drop on another speaker to merge them";
    row.appendChild(hint);
  };
  const drop = () => {
    row.classList.remove("merging");
    cell.classList.remove("dragging");
    for (const other of row.querySelectorAll(".sp")) {
      other.classList.remove("dropzone", "droptarget");
    }
    for (const hint of row.querySelectorAll(".mergehint")) hint.remove();
    const landed = target;
    target = null;
    dragging = false;
    return landed;
  };

  // Drag telemetry, on the page's own diagnostics. The gesture failed on a
  // real phone while every headless arm passed, and there was no way to ask
  // the device WHICH step it got to. Now there is.
  const note = (step, extra) => {
    dragLog.push(Object.assign(
      {at: Math.round(performance.now()), step, speaker: speaker.speaker_id},
      extra || {}
    ));
    while (dragLog.length > 40) dragLog.shift();
  };
  button.addEventListener("pointerdown", (event) => {
    note("pointerdown", {type: event.pointerType});
    if (hold) clearTimeout(hold);
    hold = setTimeout(() => {
      hold = null;
      // Consume the press either way: neither the sheet nor a merge gesture
      // may also start a turn.
      button.dataset.renamed = "1";
      if (!canMerge) {
        // No server half yet: the long press keeps doing what it always did.
        openSpeakerSheet(speaker);
        return;
      }
      lift();
      // Without capture the move events stop the moment the finger leaves
      // this button, which is the first thing a drag does.
      try { button.setPointerCapture(event.pointerId); } catch (err) { /* none */ }
    }, 600);
  });
  button.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    event.preventDefault();
    paint(cellAt(event.clientX, event.clientY));
  });
  button.addEventListener("pointerup", (event) => {
    if (hold) { clearTimeout(hold); hold = null; return; }
    if (!dragging) return;
    event.preventDefault();
    paint(cellAt(event.clientX, event.clientY));
    const landed = drop();
    try { button.releasePointerCapture(event.pointerId); } catch (err) { /* none */ }
    if (!landed) { openSpeakerSheet(speaker); return; }
    confirmMergeSpeakers(landed.dataset.speaker, speaker);
  });
  for (const type of ["pointercancel", "pointerleave"]) {
    button.addEventListener(type, () => {
      if (hold) { clearTimeout(hold); hold = null; }
      // A cancelled drag must clear its highlights; leaving them would make
      // the row look armed for a merge that is not happening.
      if (dragging) drop();
    });
  }
}

/** Confirm and send a merge. Destructive and irreversible, so it says so. */
async function confirmMergeSpeakers(targetId, source) {
  const target = knownSpeakers.find((s) => s.speaker_id === targetId);
  if (!target || targetId === source.speaker_id) return;
  const sourceName = source.label || source.speaker_id;
  const targetName = target.label || target.speaker_id;
  const ok = await askConfirm(
    "merge into " + targetName + "?",
    sourceName + " and " + targetName + " become one speaker, called "
    + targetName + ". Everything " + sourceName + " said is re-attributed to "
    + targetName + ". This cannot be undone.", "merge");
  if (!ok) return;
  connection.sendControl({
    kind: "speaker.merge", target_id: targetId, source_id: source.speaker_id,
  });
}

/** Ask the session for the roster, coalescing a burst into one request.
 *
 * THE FIELD DEFECT THIS EXISTS FOR (2026-08-03): a self-introduction was
 * applied server-side, the transcript lines came back relabelled "Matthias",
 * and the speaker buttons underneath still said `speaker-1` until a reload.
 * The bubbles render the line payload, which carries `speaker_label`; the
 * button row renders the SESSION STATE, and nothing was asking for it again.
 *
 * The fix is deliberately not "read the name off the line": that would give
 * the roster a second source and let the two disagree. The line is used only
 * as a HINT that something changed -- the answer still comes from `state()`,
 * which is the one place a name lives. It therefore also works for any server
 * path that relabels a speaker without emitting a roster frame at all.
 */
let rosterRefresh = null;
function refreshRoster() {
  if (rosterRefresh) return;
  rosterRefresh = setTimeout(() => {
    rosterRefresh = null;
    connection.sendControl({ kind: "state" });
  }, 150);
}

/** Does this line disagree with the roster about who its speaker is? */
function rosterLags(line) {
  if (!line || !line.speaker_id) return false;
  const known = knownSpeakers.find((s) => s.speaker_id === line.speaker_id);
  if (!known) return true;                       // a voice with no button yet
  const label = line.speaker_label || line.speaker_id;
  const shown = known.label || known.speaker_id;
  return label !== shown;
}

function markArmed(speakerId) {
  // Queried rather than walked over `children`: a roster entry is a cell that
  // CONTAINS the speak button since the delete control arrived, so the armed
  // class belongs on the button, one level down.
  for (const button of el("speakers").querySelectorAll("button.who")) {
    button.classList.toggle("armed", button.dataset.speaker === speakerId);
  }
}

function chip(suggestion) {
  const node = document.createElement("div");
  node.className = "chip";
  const text = document.createElement("span");
  text.className = "text";
  const who = suggestion.speaker_id || "somebody";
  node.appendChild(text);
  if (suggestion.applied) {
    // Already in force: a self-introduction leaves nothing to decide, so the
    // only useful control is taking it back.
    text.textContent = "named " + who + " “" + suggestion.name + "”";
    const undo = document.createElement("button");
    undo.className = "small";
    undo.textContent = "undo";
    undo.onclick = () => {
      connection.sendControl({
        kind: "name.undo", suggestion_id: suggestion.suggestion_id,
      });
      node.remove();
    };
    node.appendChild(undo);
    el("chips").appendChild(node);
    pinBottom();
    setTimeout(() => node.remove(), 20000);
    return;
  }
  text.textContent = "“" + suggestion.name + "” — " + who + "?";
  const yes = document.createElement("button");
  yes.className = "small primary";
  yes.textContent = "name";
  yes.onclick = () => {
    connection.sendControl({
      kind: "suggestion.confirm", suggestion_id: suggestion.suggestion_id,
    });
    node.remove();
  };
  const no = document.createElement("button");
  no.className = "small";
  no.textContent = "no";
  no.onclick = () => {
    connection.sendControl({
      kind: "suggestion.discard", suggestion_id: suggestion.suggestion_id,
    });
    node.remove();
  };
  node.append(yes, no);
  el("chips").appendChild(node);
  pinBottom();
}

// ---------------------------------------------------------------------------
// Sheets and dialogs. Everything that is not needed while talking lives here.
// ---------------------------------------------------------------------------
function openSheet(pane, title) {
  for (const node of document.querySelectorAll("#sheet .pane")) {
    node.classList.toggle("on", node.id === "pane-" + pane);
  }
  el("sheettitle").textContent = title;
  el("sheet").classList.add("on");
  el("scrim").classList.add("on");
}
function closeSheet() {
  el("sheet").classList.remove("on");
  el("scrim").classList.remove("on");
}

/** A confirmation that NAMES what is lost. Used wherever data goes away. */
function askConfirm(title, body, confirmLabel) {
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "box";
    const head = document.createElement("h3");
    head.textContent = title;
    const para = document.createElement("p");
    para.textContent = body;
    const actions = document.createElement("div");
    actions.className = "actions";
    const cancel = document.createElement("button");
    cancel.textContent = "cancel";
    const ok = document.createElement("button");
    ok.className = "danger";
    ok.textContent = confirmLabel || "continue";
    const done = (value) => { el("modal").classList.remove("on");
                              el("modal").innerHTML = ""; resolve(value); };
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    actions.append(cancel, ok);
    box.append(head, para, actions);
    el("modal").innerHTML = "";
    el("modal").appendChild(box);
    el("modal").classList.add("on");
  });
}

/** One text field, on a phone-sized dialog rather than a browser prompt. */
function askText(title, body, value, okLabel) {
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "box";
    const head = document.createElement("h3");
    head.textContent = title;
    const para = document.createElement("p");
    para.textContent = body;
    const input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    const actions = document.createElement("div");
    actions.className = "actions";
    const cancel = document.createElement("button");
    cancel.textContent = "cancel";
    const ok = document.createElement("button");
    ok.className = "primary";
    ok.textContent = okLabel || "save";
    const done = (result) => { el("modal").classList.remove("on");
                               el("modal").innerHTML = ""; resolve(result); };
    cancel.onclick = () => done(null);
    ok.onclick = () => done(input.value.trim());
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") done(input.value.trim());
    });
    actions.append(cancel, ok);
    box.append(head, para, input, actions);
    el("modal").innerHTML = "";
    el("modal").appendChild(box);
    el("modal").classList.add("on");
    setTimeout(() => input.focus(), 30);
  });
}

/** Rename or delete any speaker, automatic or manual (design 17.5b).
 *
 * A typed name outranks every suggestion and is never overwritten by the
 * automatic path.
 */
/** Ask for a name and send it. ONE implementation, two entry points.
 *
 * The sheet row and the roster's pencil both land here, for the same reason
 * the delete control has one implementation: two copies of a dialog drift,
 * and the copy nobody reads is the one that stops saying the right thing.
 */
async function promptRenameSpeaker(speaker) {
  const name = await askText(
    "name", "Applies to every line this speaker has already said, and to "
    + "all new ones.", speaker.label || "");
  if (name === null || !name) return;
  connection.sendControl({
    kind: "speaker.name", speaker_id: speaker.speaker_id, label: name,
  });
}

function openSpeakerSheet(speaker) {
  const pane = el("pane-speaker");
  pane.innerHTML = "";
  const group = document.createElement("div");
  group.className = "group";
  const head = document.createElement("h3");
  head.textContent = speaker.label || speaker.speaker_id;
  group.appendChild(head);

  const facts = document.createElement("p");
  facts.textContent = (speaker.observations || 0) + " utterances, "
    + (speaker.reference_seconds || 0) + " s of voice reference"
    + (speaker.clonable ? ", clonable" : ", not clonable yet");
  group.appendChild(facts);

  const rename = document.createElement("button");
  rename.className = "listrow";
  rename.innerHTML = "<span class='name'>give this speaker a name</span>";
  rename.onclick = () => {
    closeSheet();
    promptRenameSpeaker(speaker);
  };

  // The same delete as the "x" on the roster entry, deliberately one
  // implementation: two copies of a destructive confirmation drift, and the
  // one nobody reads is the one that stops warning about the right thing.
  const remove = document.createElement("button");
  remove.className = "listrow danger";
  remove.innerHTML = "<span class='name'>delete this speaker</span>";
  remove.onclick = () => {
    closeSheet();
    confirmDeleteSpeaker(speaker);
  };

  group.append(rename, remove);
  pane.appendChild(group);
  openSheet("speaker", "speaker");
}

/** The "+" button: declare somebody new, with their voice class.
 *
 * The class is asked for because the user knows it and the F0 heuristic only
 * guesses -- and it is needed BEFORE the first utterance, which is when a
 * preset voice has to be picked. Without it a new speaker has to talk once
 * before sounding right.
 */
function openAddSpeakerSheet() {
  const pane = el("pane-speaker");
  pane.innerHTML = "";
  const group = document.createElement("div");
  group.className = "group";
  const head = document.createElement("h3");
  head.textContent = "voice class";
  const note = document.createElement("p");
  note.textContent = "The preset pool is built from these four, and the "
    + "choice is needed before the first word is spoken.";
  group.append(head, note);

  const name = document.createElement("input");
  name.type = "text";
  name.placeholder = "name (optional)";
  name.style.margin = "10px 0";
  group.appendChild(name);

  for (const voiceClass of ["man", "woman", "boy", "girl"]) {
    const button = document.createElement("button");
    button.className = "listrow";
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = voiceClass;
    button.appendChild(label);
    button.onclick = () => {
      connection.sendControl({
        kind: "speaker.add", voice_class: voiceClass,
        label: name.value.trim() || null,
      });
      closeSheet();
    };
    group.appendChild(button);
  }
  pane.appendChild(group);
  openSheet("speaker", "new speaker");
}

// ---------------------------------------------------------------------------
// Languages: two big buttons and a swap, the pattern every established mobile
// translator settled on. The old header multi-select is gone.
//
// The conversation still carries a SET of participant languages -- three or
// more is expressible and fans out -- so the bar renders one button per
// participant with an add control; the first two are the pair the bubbles are
// sided by.
// ---------------------------------------------------------------------------
const catalogue = { bidirectional: [], selectable: [], all: [] };
let slots = [];

/** Does the CONNECTED server accept a participant language it cannot speak?
 *
 * It used not to: `TranslatorSession.__init__` called
 * `conversation.validate_against(matrix)`, which raises on the FIRST
 * unservable direction -- so a text-only participant did not degrade, it
 * refused to open the conversation at all and took every other language the
 * user had picked with it. The picker therefore showed every language and
 * said what was missing rather than offering a tap that produced a dead
 * session.
 *
 * The server now degrades instead (`direction_report`): the session opens on
 * the directions it can serve and tags the rest with `turn.unrouted`. This is
 * asked of the server rather than hardcoded for the same reason the merge
 * gesture is -- this page is live on merge while its server half waits for a
 * restart, and a picker that offers a language the RUNNING server still
 * refuses would produce exactly the dead session it was written to avoid.
 */
function partialParticipantsSupported() {
  return !!(serverSupports && serverSupports.partial_participants);
}

/** The picker's data source, in ONE shape, from whatever the server sends.
 *
 * Today the capability report carries `selectable` with `as_source` /
 * `as_target` / `usable` / `reason`; a per-stage frame is being added on the
 * server side. Both are folded here so the list itself never has to know
 * which one it got -- and an explicit `stages` block, when it arrives, wins
 * over the derived flags.
 */
function normalizeLanguages(info) {
  const byCode = new Map();
  const add = (raw, fallbackUsable) => {
    if (!raw || !raw.code) return;
    const stages = raw.stages || {};
    const asr = stages.asr !== undefined ? !!stages.asr : !!raw.as_source;
    const tts = stages.tts !== undefined ? !!stages.tts : !!raw.as_target;
    const usable = raw.usable !== undefined ? !!raw.usable : !!fallbackUsable;
    const previous = byCode.get(raw.code);
    byCode.set(raw.code, {
      code: raw.code,
      endonym: raw.endonym || (previous && previous.endonym) || raw.code,
      english: raw.english || (previous && previous.english) || "",
      asr: asr || (previous ? previous.asr : false),
      tts: tts || (previous ? previous.tts : false),
      usable: usable || (previous ? previous.usable : false),
      reason: raw.reason || (previous && previous.reason) || "",
    });
  };
  for (const entry of info.selectable || []) add(entry, false);
  // A bidirectional language is by definition usable in both directions, so
  // it is folded in even if it never appeared in `selectable`.
  for (const entry of info.bidirectional || []) {
    add({ ...entry, as_source: true, as_target: true, usable: true }, true);
  }
  return Array.from(byCode.values()).sort(
    (a, b) => a.endonym.localeCompare(b.endonym)
  );
}

function languageEntry(code) {
  return catalogue.all.find((entry) => entry.code === code) || null;
}

function endonymOf(code) {
  const found = languageEntry(code);
  return (found && found.endonym) || code;
}

/** Languages this device picked before, most recent first (Google/DeepL do
 *  this, and with a three-figure list it is the difference between two taps
 *  and a scroll). Device-local: it is a convenience, not conversation state. */
function recentLanguages() {
  try {
    const raw = JSON.parse(localStorage.getItem("translator.recent") || "[]");
    return Array.isArray(raw) ? raw.filter((c) => typeof c === "string") : [];
  } catch (err) {
    return [];
  }
}
function rememberLanguage(code) {
  try {
    const list = [code].concat(recentLanguages().filter((c) => c !== code));
    localStorage.setItem("translator.recent", JSON.stringify(list.slice(0, 6)));
  } catch (err) { /* private mode; the list is a convenience */ }
}

function renderLangBar() {
  const bar = el("langbar");
  bar.innerHTML = "";
  slots.forEach((code, index) => {
    const button = document.createElement("button");
    button.className = "lang" + (index === 1 ? " mine" : "");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = endonymOf(code);
    const tag = document.createElement("span");
    tag.className = "code";
    tag.textContent = code;
    button.append(name, tag);
    button.onclick = () => openLanguageSheet(index);
    bar.appendChild(button);
    if (index === 0 && slots.length > 1) {
      const swap = document.createElement("button");
      swap.className = "swap ghost";
      swap.innerHTML = ICON.swap;
      swap.setAttribute("aria-label", "swap sides");
      // Purely local: the server holds a set, so the order is only which side
      // of the stream a language's bubbles land on. Instant, no reconnect.
      swap.onclick = () => {
        const first = slots[0];
        slots[0] = slots[1];
        slots[1] = first;
        renderLangBar();
        resideBubbles();
      };
      bar.appendChild(swap);
    }
  });
  if (slots.length < 4) {
    const add = document.createElement("button");
    add.className = "addlang ghost";
    add.innerHTML = ICON.plus;
    add.setAttribute("aria-label", "add a language");
    add.onclick = () => openLanguageSheet(-1);
    bar.appendChild(add);
  }
}

function resideBubbles() {
  for (const node of streamBox().querySelectorAll(".line[data-line]")) {
    const line = lineData.get(Number(node.dataset.line));
    if (line) setSide(node, line.source_language);
  }
}

/** The language picker: every language the deployment knows, searchable.
 *
 * The two big buttons stay -- that is the pattern every established mobile
 * translator settled on -- but the LIST behind them is now the full
 * capability report rather than the bidirectional pair. At a hundred entries
 * a plain list is unusable on a phone, so it carries what Google and DeepL
 * carry: a search field, and the languages this device used before at the
 * top.
 *
 * Nothing is hidden. A language this deployment cannot hear or cannot speak
 * is LISTED, with the missing stage named on the row -- "text only" is a fact
 * the user is entitled to before choosing, not a surprise afterwards.
 */
function openLanguageSheet(index) {
  const pane = el("pane-language");
  pane.innerHTML = "";

  const group = document.createElement("div");
  group.className = "group";
  const note = document.createElement("p");
  note.textContent = "Changing the conversation languages starts a fresh "
    + "session, because the routing is decided when the session opens.";
  group.appendChild(note);

  const search = document.createElement("input");
  search.type = "text";
  search.placeholder = "search " + catalogue.all.length + " languages";
  search.setAttribute("aria-label", "search languages");
  search.style.margin = "8px 0";
  group.appendChild(search);

  const list = document.createElement("div");
  group.appendChild(list);

  const row = (entry, recent) => {
    const button = document.createElement("button");
    const chosen = slots[index] === entry.code;
    const taken = slots.indexOf(entry.code) >= 0 && !chosen;
    const speakable = entry.tts;
    const hearable = entry.asr;
    // A language that cannot be a participant here is shown and explained,
    // never silently dropped -- "es is not in the list" is unactionable.
    const partial = partialParticipantsSupported();
    const blocked = taken || (!entry.usable && !partial);
    button.className = "listrow" + (chosen ? " on" : "");
    button.disabled = taken;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = entry.endonym
      + (entry.english && entry.english !== entry.endonym
         ? "  \u00b7  " + entry.english : "");
    button.appendChild(name);
    if (taken) {
      const why = document.createElement("span");
      why.className = "why";
      why.textContent = "already in the conversation";
      button.appendChild(why);
    } else if (!speakable || !hearable) {
      const why = document.createElement("span");
      why.className = "why";
      why.textContent = !speakable && !hearable ? "text only, and not heard"
        : (!speakable ? "text only for this direction"
                      : "cannot be recognised from speech");
      button.appendChild(why);
    }
    if (recent) {
      const tag = document.createElement("span");
      tag.className = "code";
      tag.textContent = "recent";
      button.appendChild(tag);
    }
    const code = document.createElement("span");
    code.className = "code";
    code.textContent = entry.code;
    button.appendChild(code);
    button.onclick = () => {
      if (blocked) {
        // Named refusal, with the deployment's own reason. On a server that
        // does not degrade, applying it would not fall back to text -- the
        // session would refuse to open, and every other language chosen with
        // it would go too.
        sys(entry.endonym + " cannot be a conversation language on this "
            + "deployment yet: " + (entry.reason || "a stage is missing")
            + ". It is still available as a translation target in the "
            + "language pairs.", true);
        return;
      }
      if (!entry.usable && partial) {
        // Chosen with a stage missing, on a server that degrades. Said BEFORE
        // the first turn, because the alternative is a bubble that silently
        // never gets a translation and a user who reads that as a hang.
        sys(entry.endonym + " joins as far as this deployment goes: "
            + (entry.reason || "a stage is missing")
            + ". Turns it cannot serve are marked in the transcript.", false);
      }
      rememberLanguage(entry.code);
      if (index < 0) slots.push(entry.code);
      else slots[index] = entry.code;
      closeSheet();
      applyParticipants();
    };
    return button;
  };

  const heading = (text) => {
    const head = document.createElement("h3");
    head.textContent = text;
    head.style.marginTop = "14px";
    return head;
  };

  const paint = () => {
    const needle = search.value.trim().toLowerCase();
    const matches = (entry) => !needle
      || entry.code.toLowerCase().indexOf(needle) >= 0
      || entry.endonym.toLowerCase().indexOf(needle) >= 0
      || String(entry.english).toLowerCase().indexOf(needle) >= 0;
    list.innerHTML = "";
    const shown = catalogue.all.filter(matches);
    const recent = recentLanguages()
      .map(languageEntry)
      .filter((entry) => entry && matches(entry));
    if (recent.length && !needle) {
      list.appendChild(heading("recent"));
      for (const entry of recent) list.appendChild(row(entry, true));
      list.appendChild(heading("all languages"));
    }
    if (!shown.length) {
      const empty = document.createElement("p");
      empty.textContent = "No language matches " + search.value.trim() + ".";
      list.appendChild(empty);
      return;
    }
    for (const entry of shown) list.appendChild(row(entry, false));
  };
  search.addEventListener("input", paint);
  paint();

  if (index >= 0 && slots.length > 2) {
    const remove = document.createElement("button");
    remove.className = "listrow danger";
    remove.innerHTML = "<span class='name'>remove this language</span>";
    remove.onclick = () => {
      slots.splice(index, 1);
      closeSheet();
      applyParticipants();
    };
    group.appendChild(remove);
  }
  pane.appendChild(group);
  openSheet("language", index < 0 ? "add a language" : "language");
}

/** A participant change is a new conversation: reconnect with the new set. */
function applyParticipants() {
  renderLangBar();
  if (slots.length < 2) { sys("pick at least two languages", true); return; }
  connection.participants = slots.slice();
  sys("languages: " + slots.join(", ") + " — reconnecting");
  connection.sessionId = null;
  connection.cursor = 0;
  sessionStorage.setItem("translator.cursor", "0");
  if (connection.ws) connection.ws.close();
}

// ---------------------------------------------------------------------------
// Wiring.
// ---------------------------------------------------------------------------
const connection = new Connection({ onEvent });
const microphone = new Microphone(
  (frame) => connection.sendFrame(frame),
  (peak) => { el("meter").firstElementChild.style.width =
                Math.min(100, peak * 260) + "%"; },
  (text, bad) => sys(text, bad),
  (kind) => micLost(kind),
);

// ---------------------------------------------------------------------------
// Stopping the playback (user order).
//
// Two halves that do not depend on each other. The LOCAL half cuts what is
// already on the output clock and is instant; the REMOTE half asks the server
// to stop producing the rest of the turn. If the socket is down, the local
// half still works -- which is the case that decides whether this button is
// trusted.
// ---------------------------------------------------------------------------
//: Named by the server side, which is building the other half: it discards
//: the frames it has planned, cancels the queue, aborts a running synthesis
//: and answers with an ack. Kept as ONE constant, and the client's half is
//: complete and useful before that half lands -- the local cut does not
//: depend on it.
//: Length of the fade applied at the start of a playback run. Below the
//: ~20 ms at which a fade becomes audible as a soft attack, and long enough
//: to remove the step discontinuity that makes the click. Settable to 0 from
//: the console, which is what the can-fail arm does.
let ONSET_RAMP_S = 0.008;

const STOP_FRAME_KIND = "playback.stop";
//: Turns whose playback the listener cut. Their remaining audio is kept for
//: the replay button and never scheduled.
const stoppedTurns = new Set();
//: Set while a stop frame the server may not know yet is in flight, so its
//: protocol complaint is not shown to the user as a fault of theirs.
let stopFramePending = 0;
//: The server's stop counter. Monotonic, and the cheap way to tell a frame
//: that was already in flight when the stop happened from a fresh one.
let stopEpoch = 0;

function showStop() {
  if (outputMode === "silent") return;
  el("stopplay").classList.add("on");
  document.body.classList.add("playing");
}
/** A conversation that has been reset or cleared has nothing left to resume. */
function forgetStops() { stoppedTurns.clear(); }
function hideStop() {
  el("stopplay").classList.remove("on");
  document.body.classList.remove("playing");
}

// ---------------------------------------------------------------------------
// What each turn is DOING, on the bubble and above the thumb (user order).
//
// The complaint this answers: "you think it has long finished, then five
// seconds later speech comes out -- while you are already talking again."
// Full duplex is wanted; being invisible is not. So the state of every
// unfinished turn is on its own line AND summarised in a strip that sits
// inside the footer, which is the one region that stays in view while
// recording.
//
// The seconds come from the OUTPUT CLOCK, not from the server: the schedule
// already holds exactly how much speech is left, so the number is right
// without a frame, and stays right if the socket drops mid-turn.
// ---------------------------------------------------------------------------
const turnWork = new Map();     // turn_id -> "translating"|"synthesizing"|...
//: turn_id -> {units, spoken}. Fed by the server's per-unit speech states
//: when they are live, and by the clause partials before that, so the count
//: of sentences still to come is a count rather than an impression.
const turnUnits = new Map();

function noteUnit(turnId, unitIndex, spoken) {
  if (!turnId) return;
  let entry = turnUnits.get(turnId);
  if (!entry) { entry = { units: 0, spoken: 0 }; turnUnits.set(turnId, entry); }
  if (typeof unitIndex === "number") {
    entry.units = Math.max(entry.units, unitIndex + 1);
  } else {
    entry.units += 1;
  }
  if (spoken) entry.spoken += 1;
}

/** Units named but not yet spoken, across every unfinished turn. */
function outstandingUnits() {
  let pending = 0;
  for (const [turnId, entry] of turnUnits) {
    if (!turnWork.has(turnId)) continue;
    pending += Math.max(0, entry.units - entry.spoken);
  }
  return pending;
}
const WORK_LABEL = {
  translating: "translating",
  queued: "queued",
  synthesizing: "being spoken",
  speaking: "speaking",
};

function setTurnState(turnId, state) {
  if (!turnId) return;
  const was = turnWork.get(turnId);
  // A turn never walks backwards: a late partial must not pull a turn that is
  // already speaking back to "being spoken".
  const rank = { translating: 0, queued: 1, synthesizing: 2, speaking: 3,
                 done: 4 };
  if (was && (rank[state] || 0) < (rank[was] || 0) && state !== "done") return;
  if (state === "done") { turnWork.delete(turnId); turnUnits.delete(turnId); }
  else turnWork.set(turnId, state);
  const node = bubbles.get(turnId);
  if (node) {
    const badge = node.querySelector(".work");
    if (badge) {
      badge.hidden = state === "done";
      badge.textContent = WORK_LABEL[state] || state;
      badge.className = "tag work" + (state === "speaking" ? " ok" : " warn");
    }
  }
  paintActivity();
}

/** The strip above the speaking controls: what is still coming, and for how
 *  long. Its space is reserved even when empty, so it can never shift the
 *  talk button under a thumb that is already moving. */
function paintActivity() {
  const strip = el("activity");
  if (!strip) return;
  const remaining = playback.remaining;
  const speaking = playback.currentTurn && remaining > 0.15;
  const others = Array.from(turnWork.keys())
    .filter((id) => id !== playback.currentTurn).length;
  const parts = [];
  if (speaking) {
    parts.push("speaking, about " + Math.max(1, Math.round(remaining)) + " s left");
  } else if (turnWork.size) {
    const active = turnWork.get(playback.currentTurn)
      || turnWork.values().next().value;
    parts.push(WORK_LABEL[active] || active);
  }
  if (others > 0) {
    parts.push(others + " more turn" + (others === 1 ? "" : "s") + " to come");
  }
  const pending = outstandingUnits();
  if (pending > 1) {
    parts.push(pending + " sentences still to speak");
  }
  if (!parts.length) {
    strip.classList.remove("on");
    strip.textContent = "";
    return;
  }
  strip.classList.add("on");
  strip.classList.toggle("speaking", !!speaking);
  strip.textContent = parts.join(" \u00b7 ");
}

/** Record on the line that its audio was cut short.
 *
 * On the bubble, not only in the header: the record must say which turn was
 * cut, or a scrollback read later is misleading. Idempotent, because three
 * paths reach it -- the local tap, the server's ack, and the journalled
 * event that replays on a reconnect.
 */
function markStopped(turnId) {
  if (!turnId) return;
  stoppedTurns.add(turnId);
  const node = bubbles.get(turnId);
  if (!node) return;
  node.classList.add("stopped");
  const mark = node.querySelector(".stopmark");
  if (mark) mark.hidden = false;
  setTurnState(turnId, "done");
  const line = node.dataset.line ? lineData.get(Number(node.dataset.line)) : null;
  renderTools(node, line);
}

function stopPlayback() {
  const turnId = playback.currentTurn;
  const cut = playback.stopAll();
  hideStop();
  playback.currentTurn = null;
  // Our own guess at which turn was speaking; the ack corrects it if the
  // server aborted a different one.
  markStopped(turnId);
  setState(uiState === "recording" ? "recording" : "ready",
           uiState === "recording" ? "recording" : "stopped");
  // The remote half. Sent after the local cut, never before it. The server
  // discards its queue, aborts the running synthesis and answers with an ack
  // carrying the turn it aborted and how many queued turns went with it.
  stopFramePending += 1;
  connection.sendControl({ kind: STOP_FRAME_KIND, reason: "user" });
  reportCapture("playback-stopped");
  return cut;
}

el("stopplay").innerHTML = ICON.stop;
el("stopplay").addEventListener("contextmenu", (e) => e.preventDefault());
el("stopplay").onclick = stopPlayback;

function updateLink() {
  const open = connection.ws && connection.ws.readyState === WebSocket.OPEN;
  const parts = [];
  if (!open) parts.push("offline");
  else if (connection.rttMs === null) parts.push("linked");
  else parts.push(connection.rttMs + " ms");
  if (open && connection.wireRate) {
    parts.push(Math.round(connection.wireRate / 100) / 10 + " kHz");
  }
  el("link").textContent = parts.join(" · ");
}

/** Show the capture chain on screen AND put it in the server log.
 *
 * Both, deliberately: the person holding the phone cannot read the server
 * log, and the person reading the log cannot see the phone. A defect that
 * lives between the microphone and the socket is invisible to each of them
 * alone -- which is exactly how the first two phone tests were spent.
 */
/** Three-valued: on, off, or "the browser would not say". */
function flag(value) {
  if (value === null || value === undefined) return "?";
  return value ? "on" : "OFF";
}

function reportCapture(reason) {
  const d = microphone.diagnostics();
  d.reason = reason;
  //: How often the pin had to be put back. A high count against few turns is
  //: the per-segment consumption being visible from the client side.
  d.pin_rearms = pinRearms;
  // The OUTPUT half. Capture telemetry alone cannot distinguish "the server
  // sent no audio" from "the phone never played it", and that ambiguity is
  // exactly what a real device kept running into: 53 audio events sent, no
  // sound, and nothing in any log that could say which end was at fault.
  const p = playback.diagnostics();
  const box = el("diag");
  if (box) {
    box.textContent =
      "build " + d.build + " | " + d.path + " | ctx " + d.context_state + " @" +
      d.context_rate + " | track " + d.track_state +
      (d.track_muted ? " MUTED" : "") + " @" + d.track_rate +
      // What the track GOT, not what was asked for. A constraint dictionary
      // with plain `true` is "ideal", so a browser may drop echo
      // cancellation silently -- and then the answer to "why is my voice
      // noisy" is on the device, not in our source.
      " | aec " + flag(d.track_echo_cancellation) +
      " ns " + flag(d.track_noise_suppression) +
      " agc " + flag(d.track_auto_gain) +
      " | worklet " + d.worklet_calls + " (" + d.worklet_empty + " empty, ch " +
      d.worklet_channels + ") | chunks " + d.chunks + " | frames " + d.frames +
      " | peak " + d.peak +
      " || out " + p.state + " @" + p.rate + " t=" + p.current_time +
      " pushed " + p.pushed + "/" + p.scheduled +
      " dropped " + p.dropped + " replay-skipped " + p.skipped_replay +
      " resume " + p.last_resume + (p.blocked ? " BLOCKED" : "");
  }
  connection.sendControl({ kind: "diag", capture: d, playback: p });
  return d;
}

const talk = el("talk");
let holding = false;
let silentCapture = null;

function setButtonLive(node, live) {
  node.classList.toggle("live", live);
  const label = node.querySelector(".lbl");
  if (!label) return;
  if (live) {
    if (!node.dataset.idle) node.dataset.idle = label.textContent;
    label.textContent = "tap to stop";
  } else if (node.dataset.idle) {
    label.textContent = node.dataset.idle;
  }
  const ico = node.querySelector(".ico");
  if (ico) ico.innerHTML = live ? ICON.stop : ICON.mic;
}

async function beginTalking() {
  if (holding) return;
  holding = true;
  // Output is unlocked HERE, before the first await. `await microphone.start()`
  // ends the gesture's transient activation, and an output context started
  // after that point stays suspended on a phone -- audio is pushed, nothing
  // throws, nothing is heard. This line used to sit after the await.
  playback.unlock();
  try {
    await microphone.start();
  } catch (err) {
    // A refused or unavailable microphone must SAY so. Without this the flag
    // stayed true, the button never lit, and every later press was a silent
    // no-op -- indistinguishable from a broken server.
    holding = false;
    sys("microphone unavailable: " + (err && err.message ? err.message : err),
        true);
    setState("nomic", "no microphone");
    return;
  }
  playback.unlock();          // again, now that permission cannot be pending
  acquireWakeLock();          // keep the screen alive for the conversation
  microphone.setOpen(true);
  setState("recording", "recording");
  // If the capture graph is not actually producing frames, say so rather than
  // recording nothing in a lit-up button. 700 ms is several worklet quanta at
  // any sample rate the browser picks.
  clearTimeout(silentCapture);
  // Two stages. The first is early enough to still rescue the turn by
  // switching capture paths; the second reports whatever the outcome was.
  silentCapture = setTimeout(() => {
    if (!holding) return;
    const d = reportCapture("watchdog-400ms");
    if (d.chunks === 0) {
      // Nothing has reached the main thread at all. Whether the worklet is
      // not running or is running empty, the ScriptProcessor path does not
      // depend on either, so try it rather than losing the turn.
      microphone.startFallback();
    }
    silentCapture = setTimeout(() => {
      if (holding && microphone.sent() === 0) {
        const after = reportCapture("watchdog-1500ms");
        sys("no audio is arriving from the microphone (path " + after.path +
            ", worklet calls " + after.worklet_calls + ", chunks " +
            after.chunks + ")", true);
        setState("nomic", "no microphone audio");
      }
    }, 1100);
  }, 400);
}

function endTalking() {
  if (!holding) return;
  holding = false;
  clearTimeout(silentCapture);
  const sent = microphone.sent();
  microphone.setOpen(false);
  if (sent === 0) {
    // A release with no audio produces no segment and therefore no turn. The
    // server cannot distinguish it from a user who said nothing, so the
    // client is the only place this can be reported.
    reportCapture("release-empty");
    sys("released without any audio -- nothing was sent for this turn", true);
    setState("ready", "ready");
  } else {
    reportCapture("release-ok");
    setState("working", "translating");
  }
  connection.sendControl({ kind: "release" });
}

/** Tap to speak, tap again to stop (user order, replaces press-and-hold).
 *
 * Holding was the original design and it lost to the platform: on Android a
 * long press on any element is the text-selection gesture, so the press was
 * cancelled mid-utterance and the user was left holding a selection handle.
 * Tapping sidesteps the gesture entirely; the CSS hardening above stays
 * anyway, because a button that can be "selected" is a bug in either model.
 *
 * A speaker button ARMS the server first (design 17.5), so the utterance
 * skips identification rather than being identified and then overruled --
 * overruling would still have folded the segment into the wrong centroid on
 * the way past. The arming lasts exactly one utterance; the server clears it.
 */
let activeButton = null;
let startedAt = 0;
const MIN_TURN_MS = 300;

/** The speaker the user last pinned by tapping their button, held here.
 *
 * RE-ARM MITIGATION, and it is a race, not a fix. The server consumes an
 * arming PER SEGMENT (`session.py:1575`: `_armed_speaker` is cleared inside
 * `_identify`, whatever happens next), so a conversation of five segments
 * spends the pin on the first one and lets diarization mint phantom speakers
 * for the other four. Re-sending the arming at each turn boundary keeps the
 * pin alive across those boundaries and visibly reduces the flood.
 *
 * What it CANNOT do: close the window. The re-arm is sent when a turn opens
 * on the wire, and the next segment may already be inside `_identify` by the
 * time it lands -- there is no ordering between them. The real fix is the
 * server-side sticky pin, where the pin survives the segment boundary because
 * it is never consumed. This is what mitigates the symptom until that ships.
 *
 * Second honest limit: while the pin is held, a genuine OTHER speaker is
 * attributed to the pinned one as well. That is the sticky-pin semantic the
 * user asked for, and the §17.8.16 language filter is what will separate the
 * other-language case -- server-side, not here.
 */
let pinnedSpeaker = null;
let pinRearms = 0;

function rearmPin() {
  if (!pinnedSpeaker) return;
  // STAND DOWN against a server that holds the pin itself. This mitigation
  // existed only because the arming was consumed per segment; where the
  // server announces `sticky_pin`, re-sending is redundant traffic that would
  // also mask a regression in the server-side hold. Same capability mechanism
  // as the merge gesture -- an older server omits the key and keeps this.
  if (serverSupports.sticky_pin) return;
  connection.sendControl({ kind: "speaker.arm", speaker_id: pinnedSpeaker });
  markArmed(pinnedSpeaker);
  pinRearms += 1;
}

function toggleTalk(node, speakerId) {
  if (activeButton && activeButton !== node) {
    // Switching speaker mid-recording ends the current turn rather than
    // silently reattributing it.
    stopTalk();
  }
  if (activeButton === node) {
    if (Date.now() - startedAt < MIN_TURN_MS) {
      // Named, not silent: a stray double tap would otherwise send an empty
      // turn and look like the app ignoring the press.
      sys("that was a double tap, still recording", false);
      return;
    }
    stopTalk();
    return;
  }
  if (speakerId) {
    connection.sendControl({ kind: "speaker.arm", speaker_id: speakerId });
    pinnedSpeaker = speakerId;
  }
  activeButton = node;
  startedAt = Date.now();
  setButtonLive(node, true);
  beginTalking();
}

function stopTalk() {
  const node = activeButton;
  activeButton = null;
  // The pin is released by the same tap that ends the turn. Holding it past
  // the end would keep re-arming a speaker the user has stopped being.
  pinnedSpeaker = null;
  if (node) setButtonLive(node, false);
  markArmed(null);
  endTalking();
}

function bindTalkButton(node, speakerId) {
  // Pointer events only, and the context menu is refused: both halves of the
  // long-press gesture have to be closed or Android reopens it.
  node.addEventListener("contextmenu", (e) => e.preventDefault());
  node.addEventListener("selectstart", (e) => e.preventDefault());
  node.addEventListener("pointerup", (e) => {
    e.preventDefault();
    if (node.dataset.renamed === "1") { node.dataset.renamed = "0"; return; }
    toggleTalk(node, speakerId);
  });
}

bindTalkButton(talk, null);
talk.querySelector(".ico").innerHTML = ICON.mic;

// ---------------------------------------------------------------------------
// Segmented controls. Each one owns exactly one server-side setting and shows
// the server's answer, so a refused switch snaps back visibly rather than
// leaving the UI claiming something the session is not doing.
// ---------------------------------------------------------------------------
function segValue(id) {
  const on = el(id).querySelector("button.on");
  return on ? on.dataset.value : null;
}
function segSet(id, value) {
  for (const button of el(id).children) {
    button.classList.toggle("on", button.dataset.value === value);
  }
}
function segBind(id, handler) {
  for (const button of el(id).children) {
    button.onclick = () => {
      const previous = segValue(id);
      if (previous === button.dataset.value) return;
      segSet(id, button.dataset.value);
      handler(button.dataset.value, previous);
    };
  }
}

segBind("segmode", async (value) => {
  if (value === "vad") {
    try {
      await microphone.start();
    } catch (err) {
      sys("microphone unavailable: " + (err && err.message ? err.message : err),
          true);
      setState("nomic", "no microphone");
      segSet("segmode", "ptt");
      return;
    }
    playback.ensure();
    acquireWakeLock();
    microphone.setOpen(true);         // server-side VAD segments the stream
    setTimeout(() => {
      if (microphone.sent() === 0) {
        sys("listening, but no audio is arriving from the microphone", true);
        setState("nomic", "no microphone audio");
      }
    }, 1000);
    talk.querySelector(".lbl").textContent = "listening (automatic)";
    talk.disabled = true;
  } else {
    stopTalk();
    microphone.setOpen(false);
    talk.querySelector(".lbl").textContent = "tap to speak";
    talk.dataset.idle = "tap to speak";
    talk.disabled = false;
  }
});

/** The capture was taken away mid-session, and the UI must stop claiming it.
 *
 * THE LIVE FAILURE OF 2026-08-04, and the reason this is a state transition
 * rather than a toast. Android takes the microphone in two shapes: it MUTES
 * the track (an incoming call, another app claiming audio focus) or it ENDS
 * it. Both leave every other indicator healthy -- the socket is open, the
 * session is alive, the AudioContext is running -- so nothing else on the
 * page notices. In continuous mode the speak button is deliberately DISABLED
 * while listening (`talk.disabled = true` above), so what the user was left
 * with was: no audio reaching the server, and a record button that does
 * nothing when pressed. The server-side evidence was a session `attached: 1`
 * whose decision log simply stopped. The old handler answered all of that
 * with one line of text.
 *
 * A mute can recover on its own, an end cannot -- the track is gone and only
 * a fresh `getUserMedia` produces another. So a mute keeps the capture chain
 * and only hands the controls back; an end tears the chain down, because
 * `start()` returns early while `this.ctx` exists and would otherwise rebuild
 * nothing and "capture" from a track that no longer exists.
 */
function micLost(kind) {
  const wasListening = segValue("segmode") === "vad";
  microphone.setOpen(false);
  if (kind === "ended") microphone.stop();
  if (activeButton) stopTalk();
  // Continuous mode cannot continue without a microphone, and leaving the
  // control in "vad" would show a mode the page is not in.
  if (wasListening) segSet("segmode", "ptt");
  talk.querySelector(".lbl").textContent = "tap to speak";
  talk.dataset.idle = "tap to speak";
  talk.disabled = false;
  setState("nomic", kind === "muted" ? "microphone muted" : "microphone lost");
  sys(kind === "muted"
        ? "the system took the microphone -- a call or another app. Tap to "
          + "speak once it is free again"
        : "the microphone was disconnected. Tap to speak to pick it up again",
      true);
  reportCapture("microphone-" + kind);
}

// Voice mode. Applies to the live session immediately; the server refuses
// preset mode when no pool is loaded and the refusal is shown rather than
// swallowed, because a toggle that appears to work and does not is worse than
// one that is greyed out.
segBind("segvoice", async (mode, previous) => {
  if (!connection.sessionId) {
    sys("no session yet", true); segSet("segvoice", previous); return;
  }
  try {
    const response = await fetch(
      BASE + "api/translator/sessions/" + connection.sessionId + "/voice",
      { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ mode }) });
    if (response.ok) {
      sys("voice: " + mode);
    } else {
      const detail = await response.json().catch(() => ({}));
      sys("voice mode refused: " + (detail.detail || response.status), true);
      segSet("segvoice", previous);
    }
  } catch (err) {
    sys("voice mode failed: " + err, true);
    segSet("segvoice", previous);
  }
});

// ---------------------------------------------------------------------------
// Silence, which is the SAME THING as the reading mode (design 17.1).
//
// Checked at the code before being merged into one control rather than
// assumed from the two orders' wording: `session.py:1505` reads the session's
// output mode, and `speak()` returns at `session.py:1538` -- before the
// `tts.synthesize` call at :1553. So in `silent` the synthesis is never
// computed, which is exactly what the mute order asks for, and everything
// upstream of it (recognition, identification, routing, translation, the
// reference buffers) keeps running. One server state, therefore one control.
//
// It survives a reload because it lives in `state()` (`session.py:545`) and
// this client renders that state on every handshake -- it is not stored here.
// ---------------------------------------------------------------------------
let outputMode = "voice";

function setOutputMode(mode, tell) {
  outputMode = mode === "silent" ? "silent" : "voice";
  const muted = outputMode === "silent";
  const button = el("mute");
  button.innerHTML = muted ? ICON.muted : ICON.speaker;
  button.classList.toggle("muted", muted);
  button.setAttribute("aria-label",
    muted ? "translations are written only" : "translations are spoken aloud");
  button.title = muted ? "muted - tap to speak translations aloud"
                       : "spoken aloud - tap to mute";
  const note = el("outputnote");
  if (note) {
    note.textContent = muted
      ? "Muted. The whole pipeline still runs and only the synthesis is "
        + "skipped, so the transcript and the voice references keep filling. "
        + "The speaker icon in the header switches it back."
      : "Translations are spoken aloud. The speaker icon in the header mutes "
        + "them; muting skips the synthesis entirely rather than turning the "
        + "volume down, so nothing is computed that nobody will hear.";
  }
  if (muted) {
    // Nothing further will be synthesized, but a turn already on the clock
    // would keep talking through the switch -- which reads as a mute that
    // does not mute.
    playback.stopAll();
    hideStop();
  }
  if (tell) {
    sys(muted ? "muted: translations are written, not spoken"
              : "translations are spoken again");
  }
}

el("mute").onclick = () => {
  const next = outputMode === "silent" ? "voice" : "silent";
  // Painted immediately, then corrected by the server's own answer if it
  // refuses -- the control must not feel dead for a round trip.
  setOutputMode(next, false);
  connection.sendControl({ kind: "output.mode", mode: next });
};

segBind("segroute", async (value) => {
  const manual = value === "manual";
  el("routing").style.display = manual ? "block" : "none";
  if (manual && !routing.rows.length) {
    routing.rows.push({ a: "", b: "" });
    renderPairs();
  }
  if (!manual) await sendPairs([]);
});

el("gear").onclick = () => openSheet("settings", "settings");
el("sheetclose").onclick = closeSheet;
el("scrim").onclick = closeSheet;
el("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "light"
    ? "dark" : "light";
  applyTheme(next);
  try { localStorage.setItem("translator.theme", next); } catch (err) { /* private mode */ }
};
el("unblock").onclick = () => {
  // The tap IS the fix: an output context may only start on a user gesture.
  playback.unlock();
  playback.blocked = false;
  connection.warnedBlocked = false;
  el("blocked").classList.remove("on");
  setState("ready", "ready");
};

el("copytranscript").onclick = async () => {
  const text = transcriptText();
  if (!text) { sys("nothing to copy yet"); return; }
  try {
    await navigator.clipboard.writeText(text);
    sys("transcript copied");
  } catch (err) {
    // Clipboard access can be refused; a selectable field is the fallback
    // that always works.
    const area = document.createElement("textarea");
    area.value = text;
    area.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (inner) { ok = false; }
    area.remove();
    sys(ok ? "transcript copied" : "the browser refused the clipboard", !ok);
  }
};

el("cleartranscript").onclick = async () => {
  closeSheet();
  const ok = await askConfirm(
    "clear the transcript?",
    "Every line of this conversation is deleted on the server. The speakers, "
    + "their names and their voice references stay.", "clear");
  if (!ok) return;
  connection.sendControl({ kind: "transcript.clear" });
};

// The reset (design 19.3b). Effective on the SERVER, not only on screen:
// dropping the session takes the transcript, every speaker profile with its
// references and names, and any queued turn with it, and the reconnect that
// follows mints a fresh session id.
el("reset").onclick = async () => {
  closeSheet();
  const ok = await askConfirm(
    "reset the conversation?",
    "This deletes the transcript, every speaker with their names and voice "
    + "references, and any turn still waiting. A new session starts "
    + "immediately. It cannot be undone.", "reset");
  if (!ok) return;
  const id = connection.sessionId;
  // Stop the reconnect from racing the delete: the socket closing would
  // otherwise re-create the very session we are removing.
  connection.closedByUser = true;
  if (connection.ws) { try { connection.ws.close(); } catch (err) { /* gone */ } }
  if (id) {
    try {
      await fetch(BASE + "api/translator/sessions/" + id, { method: "DELETE" });
    } catch (err) {
      sys("the server did not confirm the reset: " + err, true);
    }
  }
  clearStream();
  el("chips").innerHTML = "";
  audioStore.clear();
  forgetStops();
  playback.stopAll();
  hideStop();
  renderSpeakers([]);
  connection.sessionId = null;
  connection.cursor = 0;
  sessionStorage.removeItem("translator.session");
  sessionStorage.setItem("translator.cursor", "0");
  sys("reset: a new conversation has started");
  connection.connect();
};

// Screen-off operation is the known PWA wall: Android suspends a backgrounded
// page's AudioContext and no web API overrides that. A wake lock keeps the
// screen on while the app is in use, which makes screen-on the MVP's stated
// constraint rather than an unexplained failure. Losing the lock is not an
// error -- it is released automatically when the page hides.
let wakeLock = null;
async function acquireWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (err) {
    sys("screen wake lock unavailable; the screen may sleep mid-conversation");
  }
}

el("enroll").addEventListener("click", async () => {
  closeSheet();
  sys("enrolment: speak for 15 seconds, starting now");
  try {
    await microphone.start();
  } catch (err) {
    sys("microphone unavailable: " + (err && err.message ? err.message : err),
        true);
    return;
  }
  const collected = [];
  const capture = (frame) => collected.push(new Uint8Array(frame));
  const original = microphone.onFrame;
  microphone.onFrame = capture;
  microphone.setOpen(true);
  setState("recording", "enrolling");
  setTimeout(async () => {
    microphone.setOpen(false);
    microphone.onFrame = original;
    setState("ready", "ready");
    let total = 0;
    collected.forEach((c) => (total += c.length));
    const merged = new Uint8Array(total);
    let at = 0;
    for (const c of collected) { merged.set(c, at); at += c.length; }
    let binary = "";
    for (let i = 0; i < merged.length; i++) binary += String.fromCharCode(merged[i]);
    try {
      const response = await fetch(
        BASE + "api/translator/enroll/" + connection.sessionId,
        { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({
            label: "user",
            audio: { encoding: "pcm16", sample_rate: PIPELINE_RATE,
                     data: btoa(binary) },
          }) });
      sys(response.ok ? "enrolled your voice" : "enrolment failed",
          !response.ok);
    } catch (err) {
      sys("enrolment failed: " + err, true);
    }
  }, 15000);
});

// Fake backends must announce themselves. A tester who does not know the
// recognizer is a stub reads the resulting nonsense as "the translator is
// broken", which wastes their time and mine. The banner names exactly which
// stages are stubbed rather than saying "demo mode", because a partially real
// stack is the normal state during bring-up.
function announceFakeBackends(backends) {
  const stubbed = Object.entries(backends || {})
    .filter(([, name]) => String(name).startsWith("fake"))
    .map(([stage]) => stage);
  if (!stubbed.length) return;
  const box = el("demo");
  box.innerHTML =
    "<b>Transport test build.</b> These stages are stubs, not real models: "
    + "<b>" + stubbed.join(", ") + "</b>. "
    + "Connection, tap-to-talk, reconnect and the UI are real and worth "
    + "testing. Transcripts and audio are placeholders — nonsense output "
    + "here is expected and is not a translator fault.";
  box.classList.add("on");
}

// ---------------------------------------------------------------------------
// Routing: a set of UNORDERED language pairs.
// ---------------------------------------------------------------------------
// One row is one relationship, both directions. A language appearing in two
// rows FANS OUT -- the utterance is rendered in both, played one after the
// other -- which is why the note below turns into a latency warning rather
// than an error: fan-out is what the user asked for, it just costs a second
// synthesis per extra target.
//
// The dropdowns are built from the capability endpoint's `selectable` list, so
// a language this deployment cannot run appears GREYED OUT WITH ITS REASON
// instead of quietly missing. "es is not in the list" is unactionable;
// "es -- TTS cannot speak it" tells the user which checkpoint is the problem.
const routing = { rows: [] };

function languageOptions(select, chosen) {
  select.innerHTML = "";
  const blank = document.createElement("option");
  blank.value = "";
  blank.textContent = "—";
  select.appendChild(blank);
  for (const entry of catalogue.selectable) {
    const option = document.createElement("option");
    option.value = entry.code;
    option.textContent = entry.endonym + " (" + entry.code + ")"
      + (entry.usable ? "" : " — " + entry.reason);
    option.disabled = !entry.usable;
    option.selected = entry.code === chosen;
    select.appendChild(option);
  }
}

function renderPairs() {
  const box = el("pairs");
  box.innerHTML = "";
  routing.rows.forEach((row, index) => {
    const line = document.createElement("div");
    line.className = "pair";
    const left = document.createElement("select");
    const arrows = document.createElement("span");
    arrows.className = "arrows";
    arrows.textContent = "↔";
    const right = document.createElement("select");
    languageOptions(left, row.a);
    languageOptions(right, row.b);
    left.addEventListener("change", () => { row.a = left.value; describeRouting(); });
    right.addEventListener("change", () => { row.b = right.value; describeRouting(); });
    const drop = document.createElement("button");
    drop.className = "small";
    drop.textContent = "−";
    drop.title = "remove this pair";
    drop.addEventListener("click", () => {
      routing.rows.splice(index, 1);
      renderPairs();
    });
    line.append(left, arrows, right, drop);
    box.appendChild(line);
  });
  describeRouting();
}

function describeRouting() {
  const note = el("routingnote");
  const counts = {};
  let complete = 0;
  for (const row of routing.rows) {
    if (!row.a || !row.b || row.a === row.b) continue;
    complete += 1;
    counts[row.a] = (counts[row.a] || 0) + 1;
    counts[row.b] = (counts[row.b] || 0) + 1;
  }
  const fanned = Object.entries(counts).filter(([, n]) => n > 1);
  if (!complete) {
    note.className = "";
    note.textContent = "No complete pair yet. With none applied the system "
      + "routes automatically over the conversation languages.";
    return;
  }
  if (!fanned.length) {
    note.className = "";
    note.textContent = complete + " pair" + (complete === 1 ? "" : "s")
      + ", both directions each.";
    return;
  }
  note.className = "warn";
  note.textContent = fanned
    .map(([code, n]) => code + " → " + n + " languages")
    .join("; ")
    + ". Each extra target is a second translation and synthesis, played "
    + "after the first — so a turn takes noticeably longer than with a "
    + "single pair.";
}

el("addpair").addEventListener("click", () => {
  routing.rows.push({ a: "", b: "" });
  renderPairs();
});

el("applypairs").addEventListener("click", async () => {
  const pairs = routing.rows
    .filter((row) => row.a && row.b && row.a !== row.b)
    .map((row) => ({ a: row.a, b: row.b }));
  await sendPairs(pairs);
});

async function sendPairs(pairs) {
  if (!connection.sessionId) { sys("not connected yet", true); return; }
  try {
    const response = await fetch(
      BASE + "api/translator/sessions/" + connection.sessionId + "/routing",
      { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ pairs }) });
    if (!response.ok) {
      let detail = "routing rejected";
      try { detail = (await response.json()).detail || detail; } catch (err) { /* no body */ }
      sys(detail, true);
      return;
    }
    const state = await response.json();
    sys(state.routing_mode === "manual"
      ? "routing: " + state.routing_pairs.map((p) => p.a + "↔" + p.b).join(", ")
      : "routing: automatic");
  } catch (err) {
    sys("routing failed: " + err, true);
  }
}

// ---------------------------------------------------------------------------
// Server state -> surface. Everything the session holds is rendered from the
// session, so a reconnect or a second device shows what is actually in force
// rather than what this page last set.
// ---------------------------------------------------------------------------
function applyState(state) {
  if (!state) return;
  // Read BEFORE the roster is painted: the merge drag is only bound when the
  // running server can carry it out (see `serverSupports`).
  if (state.supports) serverSupports = state.supports;
  if (state.speakers) renderSpeakers(state.speakers);
  if (state.armed_speaker !== undefined) markArmed(state.armed_speaker);
  if (state.voice_mode) segSet("segvoice", state.voice_mode);
  if (state.output_mode) setOutputMode(state.output_mode, false);
  if (state.routing_mode) {
    segSet("segroute", state.routing_mode);
    el("routing").style.display = state.routing_mode === "manual"
      ? "block" : "none";
    if (state.routing_mode === "manual" && Array.isArray(state.routing_pairs)) {
      routing.rows = state.routing_pairs.map((p) => ({ a: p.a, b: p.b }));
      renderPairs();
    }
  }
  if (Array.isArray(state.participants) && state.participants.length) {
    // Keep the user's chosen order for languages that are still there; a
    // swap must not be undone by every state frame.
    const kept = slots.filter((code) => state.participants.indexOf(code) >= 0);
    for (const code of state.participants) {
      if (kept.indexOf(code) < 0) kept.push(code);
    }
    if (kept.join(",") !== slots.join(",")) {
      slots = kept;
      renderLangBar();
      resideBubbles();
    }
  }
}

function onEvent(event) {
  switch (event.kind) {
    case "ready":
    case "state":
    case "session.ready":
    case "session.state":
      applyState(event.state);
      break;
    case "transcript":
      applyTranscript({ lines: event.lines, replace: true });
      break;
    case "transcript.line":
    case "transcript.update":
    case "line.resolved":
      renderLine(event.line);
      break;
    case "transcript.cleared":
      clearStream();
      forgetStops();
      sys("transcript cleared");
      break;
    case "speaker.suggestion":
      chip(event);
