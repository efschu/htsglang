<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 574" width="660" height="574" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="660.0" height="574.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">5 — Model too big for any single card → load-time expert offload to host</text><text x="20.0" y="45.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">RAM</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">122B-A10B Int4 on one RTX 5090 32 GB. Decisive setting: load-time MoE offload (§6, mechanism [in</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">progress] / 122B run [planned]).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Head-rank load-time MoE offload [in progress]: materialize only resident+cushion experts on the</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">GPU and stream the cold tier straight to host RAM at load — rather than materializing all experts</text><text x="20.0" y="131.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">on the GPU and then slicing.</text><text x="20.0" y="150.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Boots a model whose weights exceed a single card's VRAM at load. Mechanism validated on 35B-A3B;</text><text x="20.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">the full 122B-A10B Int4 run (~61 GB experts) is [planned] (download-gated).</text><text x="20.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Upstream sglang: no load-time host-spill path — a 122B model exceeds 32 GB; Expert Parallelism</text><text x="20.0" y="199.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">requires experts to fit aggregate VRAM, and the generic offload materializes on the GPU during</text><text x="20.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">load.</text><text x="115.0" y="238.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="251.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="259.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="259.0" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="275.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">attn + shared (dense) wts</text><rect x="40.0" y="285.4" width="150.0" height="52.8" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="315.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">resident experts (hot tier)</text><rect x="40.0" y="338.2" width="150.0" height="13.2" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="348.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">prefetch + cushion</text><rect x="40.0" y="351.4" width="150.0" height="39.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="374.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV cache</text><rect x="40.0" y="391.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="395.4" x2="198.0" y2="395.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="398.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="115.0" y="414.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">full model, TP=1</text><line x1="220.0" y1="399.8" x2="220.0" y2="445.8" stroke="#5a5a5a" stroke-width="2.2"/><text x="220.0" y="410.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">PCIe</text><text x="40.0" y="438.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#333">Pinned host RAM (DDR)</text><rect x="40.0" y="445.8" width="580.0" height="34.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="445.8" width="464.0" height="34.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="272.0" y="466.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#ffffff">~61 GB cold experts (pinned host RAM)</text><rect x="504.0" y="445.8" width="116.0" height="34.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="562.0" y="466.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><text x="20.0" y="509.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="515.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="175.0" y="515.8" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="192.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="330.0" y="515.8" width="12.0" height="12.0" rx="1" fill="#f2c07a" stroke="#333" stroke-width="0.8"/><text x="347.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">expert scratch / prefetch</text><rect x="485.0" y="515.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="502.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="20.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#c0504d" stroke="#333" stroke-width="0.8"/><text x="37.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">experts spilled to host RAM</text><rect x="175.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="192.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text></svg>