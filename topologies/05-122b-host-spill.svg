<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 559" width="660" height="559" font-family="sans-serif"><rect x="0.0" y="0.0" width="660.0" height="559.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">5 — Model too big for any single card → load-time expert offload to host</text><text x="20.0" y="45.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">RAM</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">122B-A10B Int4 on one RTX 5090 32 GB. Decisive setting: load-time MoE offload (§6, mechanism [in</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">progress] / 122B run [planned]).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Head-rank load-time MoE offload [in progress]: materialize only resident+cushion experts on the</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">GPU, stream the cold tier straight to host RAM at load — instead of materializing all experts then</text><text x="20.0" y="131.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">slicing (which OOMs at load).</text><text x="20.0" y="150.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Boots what used to OOM at load. Mechanism validated on 35B-A3B; the full 122B-A10B Int4 run (~61</text><text x="20.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">GB experts) is [planned] (download-gated).</text><text x="20.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: cannot run — a 122B model does not fit 32 GB, EP needs experts to fit aggregate</text><text x="20.0" y="199.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">VRAM, generic offload OOMs during load.</text><text x="115.0" y="223.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="236.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="244.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="244.0" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="260.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">attn + shared (dense) wts</text><rect x="40.0" y="270.4" width="150.0" height="52.8" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="300.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">resident experts (hot tier)</text><rect x="40.0" y="323.2" width="150.0" height="13.2" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="333.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">prefetch + cushion</text><rect x="40.0" y="336.4" width="150.0" height="39.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="359.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV cache</text><rect x="40.0" y="376.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="380.4" x2="198.0" y2="380.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="383.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="115.0" y="399.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">full model, TP=1</text><line x1="220.0" y1="384.8" x2="220.0" y2="430.8" stroke="#5a5a5a" stroke-width="2.2"/><text x="220.0" y="395.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">PCIe</text><text x="40.0" y="423.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#333">Pinned host RAM (DDR)</text><rect x="40.0" y="430.8" width="580.0" height="34.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="430.8" width="464.0" height="34.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="272.0" y="451.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#ffffff">~61 GB cold experts (pinned host RAM)</text><rect x="504.0" y="430.8" width="116.0" height="34.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="562.0" y="451.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><text x="20.0" y="494.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="500.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="510.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="175.0" y="500.8" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="192.0" y="510.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="330.0" y="500.8" width="12.0" height="12.0" rx="1" fill="#f2c07a" stroke="#333" stroke-width="0.8"/><text x="347.0" y="510.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">expert scratch / prefetch</text><rect x="485.0" y="500.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="502.0" y="510.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="20.0" y="516.8" width="12.0" height="12.0" rx="1" fill="#c0504d" stroke="#333" stroke-width="0.8"/><text x="37.0" y="526.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">experts spilled to host RAM</text><rect x="175.0" y="516.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="192.0" y="526.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text></svg>