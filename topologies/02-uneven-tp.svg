<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 612" width="1320" height="612" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="612.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">2 — Uneven TP (--rank-tp-ratio): size each weight shard to the specific card</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs a homogeneous upstream even-TP config for the same 27B workload.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): 27B TP=3, --rank-tp-ratio 2,1,1 --rank-gpu-memory-mib 26000,15000,15000, one rank per GPU. Q heads split 12/6/6, the 5090 carries the 2x shard; measured weight shards 12.7 / 8.0 / 8.0</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">GiB. KV is sized as the measured remainder (262k auto-fit).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream even-TP gives every rank an IDENTICAL shard, so it wants N equal cards (2x 24 GB shown). On mixed cards it would size every rank to the smallest and strand the surplus of</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">the larger one. TP=3 is illegal for this model (4 KV heads).</text><rect x="30.0" y="144.0" width="318.7" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — uneven-TP ratio 2,1,1 on the rig</text><rect x="676.0" y="144.0" width="298.0" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x identical 24 GB, even TP=2</text><text x="183.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="183.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · ratio 2</text><rect x="113.0" y="221.0" width="140.0" height="50.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="249.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard (2x)</text><rect x="113.0" y="271.8" width="140.0" height="2.2" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="274.0" width="140.0" height="3.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="277.2" width="140.0" height="58.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="277.2" width="140.0" height="58.0" fill="url(#hatch)" stroke="none"/><text x="183.0" y="309.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV = measured remainder</text><rect x="113.0" y="335.2" width="140.0" height="16.2" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="346.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="113.0" y="221.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · ratio 1</text><rect x="267.0" y="269.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="288.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="267.0" y="301.4" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="303.3" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="306.4" width="140.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="306.4" width="140.0" height="35.2" fill="url(#hatch)" stroke="none"/><text x="337.0" y="327.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV remainder</text><rect x="267.0" y="341.6" width="140.0" height="9.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="269.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="491.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="491.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · ratio 1</text><rect x="421.0" y="269.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="288.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="421.0" y="301.4" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="303.3" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="306.4" width="140.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="306.4" width="140.0" height="35.2" fill="url(#hatch)" stroke="none"/><text x="491.0" y="327.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV remainder</text><rect x="421.0" y="341.6" width="140.0" height="9.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="269.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="911.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · even shard</text><rect x="841.0" y="255.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="255.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (equal)</text><rect x="841.0" y="305.4" width="140.0" height="38.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="305.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="327.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="841.0" y="343.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="343.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="349.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="349.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="255.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="1065.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · even shard</text><rect x="995.0" y="255.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="255.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (equal)</text><rect x="995.0" y="305.4" width="140.0" height="38.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="305.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="327.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="343.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="343.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="349.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="349.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="255.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Weight shards + GDN + ctx MEASURED; KV is the measured remainder (exact per-rank GiB for this config not</text><text x="40.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">separately dumped -&gt; drawn ESTIMATED). Earlier 68 / 97 tok/s figures used a contaminated bench</text><text x="40.0" y="422.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">(pre-2026-07-22) and are withdrawn, not shown as fact.</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Even-TP is clean ON identical cards; the contrast is the hardware premise (N equal cards), not the per-card</text><text x="686.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">layout. Assumed card size named; not measured.</text><rect x="40.0" y="449.8" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="467.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork sizes each shard to the specific card, using a 32 GB + 2x20 GB set as-is; upstream even-TP gives identical shards and therefore wants N equal cards (and strands a bigger card if</text><text x="54.0" y="482.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">mixed) — a hardware-premise difference, not a speed claim.</text><text x="20.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="667.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="547.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="557.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="588.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="579.8" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>