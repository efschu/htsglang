<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 660" width="1320" height="660" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="660.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">2 — Uneven TP (heterogeneous / asymmetric TP) = the WEIGHT axis: size each weight shard to the card's compute (ratio 2:1:1, Q-heads 12/6/6)</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Read this diagram for the weight shards (foreground); the KV here is just the leftover remainder (grey). Fork on the rig vs a homogeneous upstream even-TP config for the same 27B workload.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): 27B TP=3, --rank-tp-ratio 2,1,1 --rank-gpu-memory-mib 26000,15000,15000, one rank per GPU. The MESSAGE is the blue weight shards: Q heads split 12 / 6 / 6, the 5090 carries the 2x shard</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">— measured weight shards 12.7 / 8.0 / 8.0 GiB (ratio 2 : 1 : 1, sized to card COMPUTE). KV here is only the leftover remainder (grey), not the point.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1d6b34">This is a DIFFERENT axis from Uneven DCP (§1): §2 sizes the WEIGHT shards to card compute; §1 sizes the KV TOKENS to card VRAM. On the rig both run together — --rank-tp-ratio auto sets the weight split</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1d6b34">AND the KV token split at once — so do not read the two diagrams as the same thing.</text><text x="20.0" y="135.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream even-TP gives every rank an IDENTICAL shard, so it wants N equal cards (2x 24 GB shown). On mixed cards it would size every rank to the smallest and strand the surplus of</text><text x="20.0" y="150.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">the larger one. TP=3 is illegal for this model (4 KV heads).</text><rect x="30.0" y="178.0" width="498.1" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="193.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — uneven-TP: WEIGHT axis, ratio 2:1:1 (weights foregrounded)</text><rect x="676.0" y="178.0" width="298.0" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="193.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x identical 24 GB, even TP=2</text><text x="183.0" y="236.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="183.0" y="248.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · ratio 2 · Q 12</text><rect x="113.0" y="255.0" width="140.0" height="50.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard 2x (Q 12/24)</text><rect x="113.0" y="255.0" width="140.0" height="50.8" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="113.0" y="305.8" width="140.0" height="2.2" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="308.0" width="140.0" height="3.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="311.2" width="140.0" height="58.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="311.2" width="140.0" height="58.0" fill="url(#hatch)" stroke="none"/><text x="183.0" y="343.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">KV (just the remainder)</text><rect x="113.0" y="369.2" width="140.0" height="16.2" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="380.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="113.0" y="255.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="284.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="296.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · ratio 1 · Q 6</text><rect x="267.0" y="303.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="322.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard (Q 6/24)</text><rect x="267.0" y="303.4" width="140.0" height="32.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="267.0" y="335.4" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="337.3" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="340.4" width="140.0" height="35.2" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="340.4" width="140.0" height="35.2" fill="url(#hatch)" stroke="none"/><text x="337.0" y="361.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">KV (remainder)</text><rect x="267.0" y="375.6" width="140.0" height="9.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="303.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="491.0" y="284.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="491.0" y="296.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · ratio 1 · Q 6</text><rect x="421.0" y="303.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="322.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard (Q 6/24)</text><rect x="421.0" y="303.4" width="140.0" height="32.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="421.0" y="335.4" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="337.3" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="340.4" width="140.0" height="35.2" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="340.4" width="140.0" height="35.2" fill="url(#hatch)" stroke="none"/><text x="491.0" y="361.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">KV (remainder)</text><rect x="421.0" y="375.6" width="140.0" height="9.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="303.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="270.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="911.0" y="282.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · even shard</text><rect x="841.0" y="289.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="289.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="317.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (equal)</text><rect x="841.0" y="289.4" width="140.0" height="50.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="841.0" y="339.4" width="140.0" height="38.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="339.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="361.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">KV</text><rect x="841.0" y="377.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="377.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="383.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="383.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="289.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="270.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="1065.0" y="282.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · even shard</text><rect x="995.0" y="289.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="289.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="317.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (equal)</text><rect x="995.0" y="289.4" width="140.0" height="50.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="995.0" y="339.4" width="140.0" height="38.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="339.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="361.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">KV</text><rect x="995.0" y="377.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="377.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="383.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="383.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="289.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="191.0" x2="660.0" y2="403.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="428.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Weight shards (blue, foreground) + GDN + ctx are MEASURED; the weight ratio 2:1:1 (Q-heads 12/6/6) is the</text><text x="40.0" y="442.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">message — shards sized to card COMPUTE. KV is drawn GREY because here it is only the measured remainder</text><text x="40.0" y="456.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">(exact per-rank GiB not separately dumped -&gt; ESTIMATED). Earlier 68 / 97 tok/s figures used a contaminated</text><text x="40.0" y="469.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">bench (pre-2026-07-22) and are withdrawn, not shown as fact.</text><text x="686.0" y="428.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Even-TP is clean ON identical cards; the contrast is the hardware premise (N equal cards), not the per-card</text><text x="686.0" y="442.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">layout. Assumed card size named; not measured.</text><rect x="40.0" y="497.6" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="515.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork sizes each WEIGHT shard to the specific card's compute (ratio 2:1:1), using a 32 GB + 2x20 GB set as-is; upstream even-TP gives identical shards and therefore wants N equal cards</text><text x="54.0" y="530.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">(and strands a bigger card if mixed). (Contrast §1, which is about the KV/TOKEN axis; on the rig both run together.)</text><text x="20.0" y="573.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="579.6" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="589.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="579.6" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="589.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="579.6" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="589.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="579.6" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="667.0" y="589.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="595.6" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="605.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="636.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="627.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="637.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="627.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="627.6" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="637.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="627.6" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="637.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>