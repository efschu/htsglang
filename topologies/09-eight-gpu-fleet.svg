<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="sans-serif"><rect x="0.0" y="0.0" width="1180.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">9 — Eight-GPU mixed fleet → several capabilities combined in one TP group</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">5090 + 2×4090 + 3090 + 3×3080 + 2080Ti, mixed PCIe x16/x8/x4, no NVLink. Composite of §1/§6/§9/§10.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">One TP group across 8 mixed cards combines: uneven-TP (proportional shards), uneven-DCP (token-KV), per-expert host offload (bottom bar), two weightless-KV workers on the x4 cards</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">(pure KV headroom), and PD-style placement (prefill on the fast x16 5090).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: even TP forces the whole group down to the 11 GB 2080Ti's shard (or excludes it); no token-KV, no weightless workers, no quant-aware offload — most of the fleet's</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">VRAM is wasted or unusable for one model.</text><text x="108.8" y="142.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="108.8" y="154.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">32GB • x16</text><rect x="51.0" y="161.0" width="115.5" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.3"/><rect x="51.0" y="161.0" width="115.5" height="35.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="108.8" y="181.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">wts</text><rect x="51.0" y="196.2" width="115.5" height="35.2" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="108.8" y="216.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">resident exp</text><rect x="51.0" y="231.4" width="115.5" height="61.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="108.8" y="265.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV</text><rect x="51.0" y="293.0" width="115.5" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><text x="108.8" y="313.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#333">prefill + hot exp</text><text x="246.2" y="177.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 4090</text><text x="246.2" y="189.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">24GB • x16</text><rect x="188.5" y="196.2" width="115.5" height="105.6" rx="2" fill="none" stroke="#222" stroke-width="1.3"/><rect x="188.5" y="196.2" width="115.5" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="246.2" y="214.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="norm