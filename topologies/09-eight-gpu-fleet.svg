1a1a">RTX 3080</text><text x="796.2" y="196.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">20 GB • x4</text><rect x="737.5" y="202.8" width="117.5" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="737.5" y="202.8" width="117.5" height="1.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="737.5" y="204.6" width="117.5" height="77.4" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="796.2" y="246.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV token-shard ONLY</text><rect x="737.5" y="282.0" width="117.5" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><text x="796.2" y="303.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#333">weightless KV worker</text><text x="933.8" y="184.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="933.8" y="196.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">20 GB • x4</text><rect x="875.0" y="202.8" width="117.5" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="875.0" y="202.8" width="117.5" height="1.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="875.0" y="204.6" width="117.5" height="77.4" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="933.8" y="246.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV token-shard ONLY</text><rect x="875.0" y="282.0" width="117.5" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><text x="933.8" y="303.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#333">weightless KV worker</text><text x="1071.2" y="224.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 2080Ti</text><text x="1071.2" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">11 GB • x4</text><rect x="1012.5" y="242.4" width="117.5" height="48.4" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="1012.5" y="242.4" width="117.5" height="13.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="1071.2" y="252.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">weights</text><rect x="1012.5" y="255.6" width="117.5" height="26.4" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="1071.2" y="271.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV</text><rect x="1012.5" y="282.0" width="117.5" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><text x="1071.2" y="303.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#333">decode rank</text><text x="40.0" y="329.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#333">Pinned host RAM (DDR)</text><rect x="40.0" y="335.8" width="1100.0" height="34.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="335.8" width="660.0" height="34.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="370.0" y="356.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#ffffff">cold MoE experts (pinned host RAM)</text><rect x="700.0" y="335.8" width="440.0" height="34.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="920.0" y="356.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><text x="20.0" y="60.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">One TP group across 8 mixed cards combines: uneven-TP (proportional shards), uneven-DCP (token-KV), per-expert host offload,</text><text x="20.0" y="76.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">two weightless-KV workers on the x4 cards (pure KV headroom), and PD-style placement (prefill on the fast x16 5090).</text><text x="20.0" y="92.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: even TP forces the whole group down to the 11 GB 2080Ti's shard (or excludes it); no token-KV, no weightless workers, no quant-aware offload.</text><text x="20.0" y="480.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="483.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="493.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="483.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="493.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="483.0" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="337.0" y="493.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="470.0" y="483.0" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="487.0" y="493.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged KV</text><rect x="20.0" y="499.0" width="12.0" height="12.0" rx="1" fill="#c0504d" stroke="#333" stroke-width="0.8"/><text x="37.0" y="509.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">experts spilled to host RAM</text><rect x="170.0" y="499.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="187.0" y="509.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="320.0" y="499.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="337.0" y="509.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>