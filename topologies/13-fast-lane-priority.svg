<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 545" width="1060" height="545" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1060.0" height="545.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">13 (mechanism) — Fast-lane: a fairness / anti-starvation layer on the priority path</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Opt-in binary lane with two anti-starvation guarantees. Decisive setting: --enable-fast-lane (§16, implemented).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Upstream supplies the priority axis (continuous integer priority + a preemption threshold). The fork's fast-lane is a binary opt-in lane ON that path whose delta</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">is two anti-starvation guarantees generic priority does not have — a reserved floor of heavy slots that are never preempted, and heavy-aging that promotes a</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">long-waiting normal request ahead of the fast tier — plus coupling to session KV spill. Stated as what each side does, not a ranking.</text><text x="40.0" y="152.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#111">Running batch (slot budget)</text><rect x="40.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="62.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="90.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="112.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="140.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="162.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="190.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.1"/><text x="212.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">resv</text><text x="212.0" y="195.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7" font-weight="normal" text-anchor="middle" fill="#1a1a1a">heavy</text><rect x="240.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.1"/><text x="262.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">resv</text><text x="262.0" y="195.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7" font-weight="normal" text-anchor="middle" fill="#1a1a1a">heavy</text><text x="40.0" y="220.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#1d6b34">Guarantee 1 — RESERVED HEAVY SLOTS (--fast-lane-reserved-heavy-slots): at least N normal ("heavy") requests are never preempted below this floor</text><text x="40.0" y="233.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#333">(schedule_policy.py: max_heavy_preemptible = num_heavy_running − reserved_slots; preemption stops at the floor) → sustained fast load cannot fully starve normal requests.</text><rect x="40.0" y="256.0" width="150.0" height="28.0" rx="3" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.3"/><text x="115.0" y="274.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">"lane":"fast" request</text><line x1="195.0" y1="270.0" x2="300.0" y2="270.0" stroke="#c65b9b" stroke-width="1.7" marker-end="url(#arr)"/><text x="360.0" y="262.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#c65b9b">binary opt-in: sets a fixed high fast_lane_priority (no manual integer)</text><text x="360.0" y="275.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#555">and preempts into the running batch, down to the reserved floor.</text><text x="40.0" y="300.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1d6b34">Guarantee 2 — HEAVY AGING (--fast-lane-heavy-aging-ms): a normal request waiting past the window is promoted to fast_lane_priority−1</text><text x="40.0" y="313.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#333">and jumps ahead of the fast tier → a stream of fast requests cannot block a waiting normal one indefinitely.</text><rect x="40.0" y="334.0" width="980.0" height="46.0" rx="4" fill="#fdf3e3" stroke="#c88a2b" stroke-width="1.2"/><text x="52.0" y="352.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#8a5a2b">Coupling with session KV spill (§20): a fast request can spill a normal session's KV to host RATHER than queue,</text><text x="52.0" y="367.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#8a5a2b">a spilled session's restore is held while a fast request waits, and a fast request is never itself spilled.</text><rect x="40.0" y="394.0" width="980.0" height="44.0" rx="4" fill="#eef1f4" stroke="#4a5568" stroke-width="1.2"/><text x="52.0" y="411.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#4a5568">Upstream baseline (schedule_policy.py, verified): priority scheduling sorts the waiting queue by a continuous integer priority and</text><text x="52.0" y="425.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#4a5568">preempts a running request when priority_diff &gt; priority_scheduling_preemption_threshold — general, with no reserved floor for the preempted and no aging.</text><text x="40.0" y="456.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Default off (--enable-fast-lane opt-in): the default scheduling path is unchanged.</text><text x="20.0" y="496.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="502.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="37.0" y="512.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="230.0" y="502.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="247.0" y="512.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>