<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 581" width="940" height="581" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="581.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">10 — The model both stacks run: 48-layer hybrid-GDN, 256-expert MoE</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Qwen3.5-122B-A10B-GPTQ-Int4. Shared structure; the fork's work is in the split, shown next.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Full-attention layers carry the KV cache (2 KV heads); GDN layers carry a fixed recurrent state. The MTP/NEXTN draft head is one extra layer</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">on rank0 (§3, shipped).</text><rect x="90.0" y="135.0" width="150.0" height="17.0" rx="1.5" fill="#c65b9b" stroke="#2b2b2b" stroke-width="0.8"/><text x="165.0" y="146.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">MTP / NEXTN draft head</text><line x1="240.0" y1="144.0" x2="266.0" y2="144.0" stroke="#c65b9b" stroke-width="1.7" marker-end="url(#arr)"/><text x="270.0" y="140.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">1 draft layer, lives on rank0 (5090);</text><text x="270.0" y="153.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">own small KV reservation (see KV-layout diagram).</text><rect x="90.0" y="161.0" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="167.4" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="173.8" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="180.2" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="186.6" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="193.0" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="199.4" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="205.8" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="212.2" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="218.6" width="150.0" heig