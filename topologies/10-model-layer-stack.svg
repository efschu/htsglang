="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="340.2" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="346.6" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="353.0" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="359.4" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="365.8" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="372.2" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="378.6" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="385.0" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="391.4" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="397.8" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="404.2" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="410.6" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="417.0" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="423.4" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="429.8" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="436.2" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="442.6" width="150.0" height="6.4" rx="0" fill="#2f6f8f" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="449.0" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="455.4" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="461.8" width="150.0" height="6.4" rx="0" fill="#7d5ba6" stroke="#ffffff" stroke-width="0.4"/><rect x="90.0" y="161.0" width="150.0" height="307.2" rx="2" fill="none" stroke="#222" stroke-width="1.5"/><text x="82.0" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="end" fill="#555">L47</text><text x="82.0" y="467.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="end" fill="#555">L0</text><text x="165.0" y="484.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">48 decoder layers</text><text x="165.0" y="498.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">hybrid-GDN, ~3:1 (GDN : full-attn)</text><line x1="242.0" y1="189.8" x2="322.0" y2="179.0" stroke="#2f6f8f" stroke-width="1.7" marker-end="url(#arr)"/><line x1="242.0" y1="196.2" x2="322.0" y2="253.0" stroke="#7d5ba6" stroke-width="1.7" marker-end="url(#arr)"/><rect x="330.0" y="165.0" width="13.0" height="13.0" rx="2" fill="#2f6f8f" stroke="#333" stroke-width="0.8"/><text x="350.0" y="175.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">full-attention layer (12 of 48): holds a growing KV cache — 2 GQA KV heads, 32 Q heads. KV grows</text><text x="350.0" y="189.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">per token, so it is TOKEN-sharded across ranks by uneven-DCP (dcp-size 3).</text><rect x="330.0" y="247.0" width="13.0" height="13.0" rx="2" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="350.0" y="257.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attention layer (36 of 48): holds a fixed-size recurrent state, not a per-token KV</text><text x="350.0" y="271.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">cache — its VRAM does not grow with sequence length.</text><text x="330.0" y="299.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">Model: Qwen3.5-122B-A10B-GPTQ-Int4 — 256 experts/layer, top-8 routing, ~10B active. This structure is</text><text x="330.0" y="313.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">identical under htsglang and upstream sglang; the difference is entirely in HOW each layer is split</text><text x="330.0" y="327.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">across the 3 mismatched cards (next diagrams).</text><text x="20.0" y="532.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="538.2" width="12.0" height="12.0" rx="1" fill="#2f6f8f" stroke="#333" stroke-width="0.8"/><text x="37.0" y="548.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">full-attention layer (KV)</text><rect x="210.0" y="538.2" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="227.0" y="548.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="400.0" y="538.2" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="417.0" y="548.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP / NEXTN draft head</text><rect x="590.0" y="538.2" width="12.0" height="12.0" rx="1" fill="#c9b8e0" stroke="#333" stroke-width="0.8"/><text x="607.0" y="548.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN recurrent state</text></svg>