<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 612" width="1320" height="612" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="612.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">8 — Measured VRAM budget: an absolute per-rank MiB budget with a per-segment registry</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs upstream's single global fraction across identical cards.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): --rank-gpu-memory-mib gives each rank an ABSOLUTE MiB budget (not a fraction). Every component — weights, KV pool, GDN state, draft pool, graphs, CUDA context, fragmentation,</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">required-free — is read from a measured registry after boot + one warm request; KV is the measured remainder. Two-boot self-calibration via a logged split-hint vector.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream sizes memory by ONE global fraction (mem-fraction-static / gpu-memory-utilization, e.g. 0.806) applied uniformly, with no per-rank absolute MiB budget and no measured</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">per-segment registry. On identical cards a single fraction is a natural fit.</text><rect x="30.0" y="144.0" width="429.1" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — measured per-rank registry (rank0, no-spec boot)</text><rect x="676.0" y="144.0" width="242.8" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — global fraction 0.806</text><text x="337.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="337.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · absolute MiB budget</text><rect x="262.0" y="221.0" width="150.0" height="3.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="262.0" y="224.2" width="150.0" height="50.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="252.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">param+buffer weights</text><rect x="262.0" y="275.0" width="150.0" height="2.2" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="262.0" y="277.2" width="150.0" height="1.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="262.0" y="278.8" width="150.0" height="46.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="305.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV = measured remainder</text><rect x="262.0" y="324.8" width="150.0" height="0.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="262.0" y="325.3" width="150.0" height="12.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="333.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#1a1a1a">required-free (safety)</text><rect x="262.0" y="337.3" width="150.0" height="14.1" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="347.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="262.0" y="221.0" width="150.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="988.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical card</text><text x="988.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">0.806 fraction</text><rect x="913.0" y="255.4" width="150.0" height="2.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="255.4" width="150.0" height="2.4" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="257.8" width="150.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="257.8" width="150.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="286.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="913.0" y="307.8" width="150.0" height="36.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="307.8" width="150.0" height="36.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="329.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV (within fraction)</text><rect x="913.0" y="343.8" width="150.0" height="7.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="343.8" width="150.0" height="7.6" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Entire registry MEASURED per rank. Corridor rule (Option A): fail a card if nvml_free &lt; 400 MiB (floor) or</text><text x="40.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">nvml_free − measured transients &gt; 1536 MiB (net waste). Self-calibration vector across boots: C 215488 →</text><text x="40.0" y="422.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">282560 → 484160 → 524160.</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">One fraction, no per-segment readout. Natural on identical cards. Not measured.</text><rect x="40.0" y="449.8" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="467.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork gives each rank an absolute measured MiB budget with a per-segment registry and a corridor rule; upstream uses one global fraction across identical cards — an observability /</text><text x="54.0" y="482.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">capability difference, not a speed claim.</text><text x="20.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="667.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="547.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="557.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="588.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="579.8" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="579.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="589.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>