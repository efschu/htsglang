<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 563" width="1120" height="563" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="563.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">17 — Adaptive drafter routing: switch draft algorithm at round boundaries</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Two draft algorithms resident at once; one chosen per batch. Decisive setting: drafter routing (§5, work in progress).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">NEXTN/MTP and DFLASH are both loaded (the inactive one held at ≈0 VRAM via VMM tag-aliasing). A per-round router selects one, either by a deterministic ctx→rung policy</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">table (recommended default) or an acceptance-driven bandit (opt-in), with a context-length gate that keeps DFLASH to its trained range. Upstream adaptive spec-decode</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">adapts k / num-draft-tokens for a single drafter; switching between draft algorithms is the fork addition.</text><text x="40.0" y="148.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#111">Both drafters resident at once (cross_algo_worker, dual residence):</text><rect x="40.0" y="158.0" width="150.0" height="30.0" rx="1.5" fill="#c65b9b" stroke="#2b2b2b" stroke-width="0.8"/><text x="115.0" y="176.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#fff">NEXTN / MTP</text><rect x="205.0" y="158.0" width="150.0" height="30.0" rx="2" fill="#e4dcf1" stroke="#7d5ba6" stroke-width="1.4"/><text x="280.0" y="177.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3b66">DFLASH</text><rect x="370.0" y="158.0" width="130.0" height="30.0" rx="2" fill="#eef1f4" stroke="#4a5568" stroke-width="1.1"/><text x="435.0" y="171.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">solo-draft pool</text><text x="435.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.6" font-weight="normal" text-anchor="middle" fill="#555">sized to threshold (→160 MiB)</text><text x="520.0" y="171.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#7d5ba6">the inactive drafter holds ≈0 VRAM</text><text x="520.0" y="183.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#7d5ba6">(VMM tag-alias, #93/#102)</text><rect x="40.0" y="210.0" width="1040.0" height="30.0" rx="4" fill="#f3f6fa" stroke="#3b6fb0" stroke-width="1.3"/><text x="50.0" y="229.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">Per-round-boundary router — picks ONE drafter for the next batch; the choice is made by one of two modes:</text><rect x="40.0" y="258.0" width="505.0" height="132.0" rx="5" fill="#eef5ef" stroke="#1d6b34" stroke-width="1.4"/><text x="52.0" y="275.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#1d6b34">policy  —  recommended default</text><text x="52.0" y="290.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#333">deterministic ctx → rung table (--speculative-drafter-policy)</text><text x="60.0" y="317.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1a1a1a">ctx &lt; 4096</text><text x="150.0" y="317.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#555">→</text><rect x="172.0" y="304.0" width="168.0" height="20.0" rx="2" fill="#e4dcf1" stroke="#7d5ba6" stroke-width="1.0"/><text x="256.0" y="318.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#4a3b66">DFLASH, k=16</text><text x="60.0" y="343.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1a1a1a">ctx ≥ 4096</text><text x="150.0" y="343.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#555">→</text><rect x="172.0" y="330.0" width="168.0" height="20.0" rx="2" fill="#c65b9b" stroke="#8a3b6b" stroke-width="1.0"/><text x="256.0" y="344.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#fff">NEXTN, k* (analytic)</text><text x="52.0" y="366.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#333">k* = argmax_k  E[accept]/round_s  from per-depth accept EMA.</text><text x="52.0" y="380.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#333">Fixed switch point = drafter training-ctx; probing not needed.</text><rect x="575.0" y="258.0" width="505.0" height="132.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.4"/><text x="587.0" y="275.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#4a5568">auto / bandit  —  opt-in (--speculative-cross-algorithm)</text><text x="587.0" y="291.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#333">acceptance-driven, for unknown drafters or content-split 4-8k loads</text><rect x="587.0" y="300.0" width="481.0" height="24.0" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.0"/><text x="595.0" y="316.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#1a1a1a">score = EMA[accept-tokens / round] ÷ EMA[round seconds]</text><text x="587.0" y="340.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#333">rank-0 decides, gloo-broadcasts every 16 rounds; dwell 64,</text><text x="587.0" y="353.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#333">dead-zone 6%. Costs a small steady-state probe overhead.</text><text x="587.0" y="374.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#555">Prior art: BanditSpec (arXiv 2505.15141, ICML'25).</text><rect x="40.0" y="408.0" width="1040.0" height="30.0" rx="4" fill="#fdf3e3" stroke="#c88a2b" stroke-width="1.2"/><text x="50.0" y="427.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#8a5a2b">Context-length gate (--speculative-cross-algorithm-ctx-gate, from the drafter training config, ~8k): above the gate DFLASH is ineligible and is not probed.</text><text x="40.0" y="456.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">Honest claim: robustness / no-regret across mixed streams — not a peak speedup. A switching mode carries ≈+5.7% systemic overhead vs a single static drafter (warm-keep + dual</text><text x="40.0" y="470.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">capture), so the win is confined to streams that actually change regime. Feature status: work in progress (§5).</text><text x="20.0" y="514.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="520.0" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="37.0" y="530.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP / NEXTN draft head</text></svg>