<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 673" width="1320" height="673" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="673.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">7 — MoE expert offload: run a 122B on 3 mismatched cards by spilling cold experts to host RAM</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs a realistic homogeneous upstream config that also offloads weights to host RAM.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): Qwen3.5-122B-A10B-GPTQ-Int4, TP=3, --rank-tp-ratio auto, SGLANG_MOE_RESIDENT_EXPERT_FRACTION=0.25. Per-rank GPU 25.5 / 16.6 / 15.4 GiB; 64 resident + 16 scratch experts/layer stay</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">on-GPU, 176/layer spill to pinned host RAM (host floor 24.4 GiB). Throughput 6.97 (eager) → 10.61 (graph) → 16.34 tok/s (graph+hotset).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream runs the same 122B on a realistic homogeneous config too — 2 identical RTX 3090 (24 GB each, even TP=2) plus --cpu-offload-gb, keeping part of the weights on-device and the</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">rest in system RAM. The whole right panel is estimated (stock cpu-offload was not benched here).</text><rect x="30.0" y="144.0" width="394.6" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — 122B TP=3, expert offload f=0.25 (measured)</text><rect x="676.0" y="144.0" width="387.7" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x RTX 3090 24 GB, TP=2 + --cpu-offload-gb</text><text x="193.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="193.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · 25.5 GB</text><rect x="128.0" y="221.0" width="130.0" height="12.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="229.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">shard</text><rect x="128.0" y="233.0" width="130.0" height="64.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="268.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">64+16 experts/layer x48</text><rect x="128.0" y="297.0" width="130.0" height="20.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="310.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV band</text><rect x="128.0" y="317.0" width="130.0" height="4.0" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="128.0" y="321.0" width="130.0" height="30.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="339.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="128.0" y="221.0" width="130.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · 16.6 GB</text><rect x="272.0" y="269.4" width="130.0" height="8.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="272.0" y="278.2" width="130.0" height="44.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="303.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">experts/layer</text><rect x="272.0" y="322.2" width="130.0" height="13.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="331.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">KV band</text><rect x="272.0" y="335.8" width="130.0" height="15.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="346.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="272.0" y="269.4" width="130.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="481.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="481.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · 15.4 GB</text><rect x="416.0" y="269.4" width="130.0" height="8.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="416.0" y="278.2" width="130.0" height="40.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="481.0" y="301.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">experts/layer</text><rect x="416.0" y="318.2" width="130.0" height="12.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="481.0" y="327.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">KV band</text><rect x="416.0" y="331.0" width="130.0" height="20.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="481.0" y="344.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="416.0" y="269.4" width="130.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="906.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3090</text><text x="906.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · TP=2 + offload</text><rect x="831.0" y="255.4" width="150.0" height="56.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="255.4" width="150.0" height="56.0" fill="url(#hatch)" stroke="none"/><text x="906.0" y="286.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">on-device layer-group weights</text><rect x="831.0" y="311.4" width="150.0" height="30.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="311.4" width="150.0" height="30.0" fill="url(#hatch)" stroke="none"/><text x="906.0" y="329.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="831.0" y="341.4" width="150.0" height="8.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="341.4" width="150.0" height="8.0" fill="url(#hatch)" stroke="none"/><rect x="831.0" y="349.4" width="150.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="349.4" width="150.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="831.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1070.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3090</text><text x="1070.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · TP=2 + offload</text><rect x="995.0" y="255.4" width="150.0" height="56.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="255.4" width="150.0" height="56.0" fill="url(#hatch)" stroke="none"/><text x="1070.0" y="286.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">on-device layer-group weights</text><rect x="995.0" y="311.4" width="150.0" height="30.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="311.4" width="150.0" height="30.0" fill="url(#hatch)" stroke="none"/><text x="1070.0" y="329.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="341.4" width="150.0" height="8.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="341.4" width="150.0" height="8.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="349.4" width="150.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="349.4" width="150.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="383.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — spilled experts (measured floor)</text><rect x="40.0" y="389.4" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="389.4" width="178.2" height="32.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="129.1" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">176 experts/layer x48 (pinned) — floor 24.4 GB</text><rect x="218.2" y="389.4" width="415.8" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="426.1" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1a1a1a">of 108 GB (no swap)</text><text x="686.0" y="383.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — --cpu-offload-gb: offloaded weights</text><rect x="686.0" y="389.4" width="604.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="686.0" y="389.4" width="332.2" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="686.0" y="389.4" width="332.2" height="32.0" fill="url(#hatch)" stroke="none"/><text x="852.1" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">offloaded layer-group weights — streamed EVERY forward</text><rect x="1018.2" y="389.4" width="271.8" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="1018.2" y="389.4" width="271.8" height="32.0" fill="url(#hatch)" stroke="none"/><text x="1154.1" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1a1a1a">reserved (--cpu-offload-gb N)</text><text x="40.0" y="440.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Per-rank GPU + host floor MEASURED. Not bit-identical to no-offload (marlin ~1e-2 argmax at near-ties);</text><text x="40.0" y="454.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">bar is coherence + self-determinism (5/5).</text><text x="686.0" y="440.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">--cpu-offload-gb (server_args.py: "How many GBs of RAM to reserve for CPU offloading") is a GENERIC</text><text x="686.0" y="454.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">per-layer-weight offload: the offloaded weights are streamed back in EVERY forward, regardless of which</text><text x="686.0" y="468.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">experts a token routes. Assumed 2x 3090; stock cpu-offload not benched here.</text><rect x="40.0" y="495.8" width="1250.0" height="63.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="513.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — both run a 122B on modest cards by using host RAM; the mechanism differs — the fork offload is EXPERT-GRANULAR (per token-wave it fetches only the routed top-K experts from host), whereas</text><text x="54.0" y="528.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">--cpu-offload-gb streams a fixed offloaded weight fraction back on every forward. At the same VRAM budget the fork moves less data per token; upstream moves the full offloaded fraction per</text><text x="54.0" y="543.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">forward — a capability / data-volume difference, stated neutrally.</text><text x="20.0" y="586.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="592.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="602.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="592.8" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="602.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="440.0" y="592.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="457.0" y="602.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="650.0" y="592.8" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="667.0" y="602.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP draft head / draft pool</text><rect x="20.0" y="608.8" width="12.0" height="12.0" rx="1" fill="#c0504d" stroke="#333" stroke-width="0.8"/><text x="37.0" y="618.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">experts spilled to host RAM</text><rect x="230.0" y="608.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="247.0" y="618.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="649.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="640.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="650.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="640.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="640.8" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="650.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="640.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="650.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>