<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 722" width="1320" height="722" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="722.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">7 — MoE expert offload: run a 122B on 3 mismatched cards by spilling cold experts to host RAM</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs the homogeneous upstream hardware a 122B-A10B would otherwise need.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): Qwen3.5-122B-A10B-GPTQ-Int4, TP=3, --rank-tp-ratio auto, SGLANG_MOE_RESIDENT_EXPERT_FRACTION=0.25. Per-rank GPU 25.5 / 16.6 / 15.4 GiB; 64 resident + 16 scratch experts/layer stay</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">on-GPU, 176/layer spill to pinned host RAM (host floor 24.4 GiB). Throughput 6.97 (eager) → 10.61 (graph) → 16.34 tok/s (graph+hotset).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream has no per-wave host-spill load path, so the experts must fit aggregate device VRAM — e.g. 2 identical 80 GB cards at even TP=2 (2 KV heads), or an 8-card Expert-Parallel</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">fleet. On 3 mismatched 20–32 GB cards (72 GB total) upstream cannot place the model.</text><rect x="30.0" y="144.0" width="394.6" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — 122B TP=3, expert offload f=0.25 (measured)</text><rect x="676.0" y="144.0" width="298.0" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x identical 80 GB, even TP=2</text><text x="193.0" y="325.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="193.0" y="337.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · 25.5 GB</text><rect x="128.0" y="344.2" width="130.0" height="7.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="128.0" y="352.0" width="130.0" height="41.6" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="376.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">64+16 experts/layer x48</text><rect x="128.0" y="393.6" width="130.0" height="13.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="402.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">KV band</text><rect x="128.0" y="406.6" width="130.0" height="2.6" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="128.0" y="409.2" width="130.0" height="19.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="193.0" y="422.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="128.0" y="344.2" width="130.0" height="84.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="356.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="368.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · 16.6 GB</text><rect x="272.0" y="375.7" width="130.0" height="5.7" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="272.0" y="381.4" width="130.0" height="28.6" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="398.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">experts/layer</text><rect x="272.0" y="410.0" width="130.0" height="8.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="272.0" y="418.9" width="130.0" height="10.1" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="272.0" y="375.7" width="130.0" height="53.3" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="481.0" y="356.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="481.0" y="368.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · 15.4 GB</text><rect x="416.0" y="375.7" width="130.0" height="5.7" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="416.0" y="381.4" width="130.0" height="26.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="481.0" y="397.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">experts/layer</text><rect x="416.0" y="407.4" width="130.0" height="8.3" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="416.0" y="415.7" width="130.0" height="13.3" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="481.0" y="425.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="416.0" y="375.7" width="130.0" height="53.3" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 80 GB</text><text x="911.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · even TP=2</text><rect x="841.0" y="221.0" width="140.0" height="85.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="221.0" width="140.0" height="85.8" fill="url(#hatch)" stroke="none"/><text x="911.0" y="267.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">½ weights (all experts resident)</text><rect x="841.0" y="306.8" width="140.0" height="78.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="306.8" width="140.0" height="78.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="349.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="841.0" y="384.8" width="140.0" height="7.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="384.8" width="140.0" height="7.8" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="392.6" width="140.0" height="36.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="392.6" width="140.0" height="36.4" fill="url(#hatch)" stroke="none"/><text x="911.0" y="414.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="841.0" y="221.0" width="140.0" height="208.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 80 GB</text><text x="1065.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · even TP=2</text><rect x="995.0" y="221.0" width="140.0" height="85.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="221.0" width="140.0" height="85.8" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="267.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">½ weights (all experts resident)</text><rect x="995.0" y="306.8" width="140.0" height="78.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="306.8" width="140.0" height="78.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="349.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="384.8" width="140.0" height="7.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="384.8" width="140.0" height="7.8" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="392.6" width="140.0" height="36.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="392.6" width="140.0" height="36.4" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="414.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="995.0" y="221.0" width="140.0" height="208.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="447.0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="461.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — spilled experts (measured floor)</text><rect x="40.0" y="467.0" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="467.0" width="178.2" height="32.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="129.1" y="486.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">176 experts/layer x48 (pinned) — floor 24.4 GB</text><rect x="218.2" y="467.0" width="415.8" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="426.1" y="486.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1a1a1a">of 108 GB (no swap)</text><text x="40.0" y="518.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Per-rank GPU + host floor MEASURED. Not bit-identical to no-offload (marlin ~1e-2 argmax at near-ties);</text><text x="40.0" y="531.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">bar is coherence + self-determinism (5/5).</text><text x="686.0" y="472.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Illustrative 80 GB cards named; the point is experts must fit aggregate device VRAM. Not measured.</text><rect x="40.0" y="559.6" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="577.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork runs a 122B on 3 mismatched cards plus 108 GB host RAM by spilling cold experts to system RAM; upstream needs the experts to fit aggregate device VRAM — 2x 80 GB or an 8-card EP</text><text x="54.0" y="592.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">fleet of identical cards — a capacity / hardware-cost difference.</text><text x="20.0" y="635.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="641.6" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="651.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="641.6" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="651.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="440.0" y="641.6" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="457.0" y="651.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="650.0" y="641.6" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="667.0" y="651.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP draft head / draft pool</text><rect x="20.0" y="657.6" width="12.0" height="12.0" rx="1" fill="#c0504d" stroke="#333" stroke-width="0.8"/><text x="37.0" y="667.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">experts spilled to host RAM</text><rect x="230.0" y="657.6" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="247.0" y="667.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="698.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="689.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="699.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="689.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="689.5999999999999" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="699.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="689.6" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="699.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>