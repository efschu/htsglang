<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="sans-serif"><rect x="0.0" y="0.0" width="680.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="24.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">2 — Three mismatched cards → uneven-TP auto + uneven-DCP (token-sharded KV)</text><text x="20.0" y="41.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">1×5090 + 2×3080. Decisive setting: --rank-tp-ratio auto (sets DCP=TP), token-axis KV.</text><text x="115.0" y="100.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="113.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="120.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="120.0" width="150.0" height="48.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="147.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="40.0" y="168.4" width="150.0" height="83.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="213.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV token-shard</text><rect x="40.0" y="252.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="256.4" x2="198.0" y2="256.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="259.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="no