font-weight="normal" text-anchor="middle" fill="#5a5a5a">DCP LSE-merge (PCIe)</text><text x="525.0" y="152.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="525.0" y="165.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="450.0" y="172.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="450.0" y="172.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="191.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="450.0" y="203.6" width="150.0" height="48.4" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="231.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV token-shard</text><rect x="450.0" y="252.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="256.4" x2="608.0" y2="256.4" stroke="#888" stroke-width="0.8"/><text x="611.0" y="259.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="525.0" y="275.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 2  •  KV owns a proportional token slice</text><line x1="395.0" y1="270.0" x2="450.0" y2="270.0" stroke="#5a5a5a" stroke-width="2.4"/><text x="422.5" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">DCP LSE-merge (PCIe)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">--rank-tp-ratio auto  +  uneven-DCP token sharding (KV split along the TOKEN axis, not the KV-head axis).</text><text x="20.0" y="74.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Fills every card; the big card is not throttled to the small ones. Doc: ≈+2.5-3x KV context vs a naive equal split.</text><text x="20.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: even TP + head-axis KV — needs equal shards and num_kv_heads divisible by rank count; wastes the 5090.</text><text x="20.0" y="394.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="397.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="407.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="397.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="407.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="397.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="337.0" y="407.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="470.0" y="397.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="487.0" y="407.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>