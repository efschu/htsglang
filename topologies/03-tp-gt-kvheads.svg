<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="sans-serif"><rect x="0.0" y="0.0" width="680.0" height="450.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="24.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">3 — Low-KV-head model, TP=3 → TP &gt; num_kv_heads (replicated KV + token-shard)</text><text x="20.0" y="41.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">1×5090 + 2×3080, model with 2 KV heads. Decisive setting: replicated-KV path (§1/§9).</text><text x="115.0" y="110.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="130.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="130.0" width="150.0" height="48.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="157.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="40.0" y="178.4" width="150.0" height="74.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="219.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV token-shard</text><rect x="40.0" y="253.2" width="150.0" height="8.8" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="257.6" x2="198.0" y2="257.6" stroke="#888" stroke-width="0.8"/><text x="201.0" y="261.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">replicated KV heads</text><rect x="40.0" y="262.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="266.4" x2="198.0" y2="266.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="115.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 0</text><text x="320.0" y="162.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="320.0" y="175.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="245.0" y="182.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="182.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="201.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="245.0" y="213.6" width="150.0" height="39.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="237.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV token-shard</text><rect x="245.0" y="253.2" width="150.0" height="8.8" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="257.6" x2="403.0" y2="257.6" stroke="#888" stroke-width="0.8"/><text x="406.0" y="261.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">replicated KV heads</text><rect x="245.0" y="262.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="266.4" x2="403.0" y2="266.4" stroke="#888" stroke-width="0.8"/><text x="406.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="320.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 1</text><text x="525.0" y="162.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="525.0" y="175.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="450.0" y="182.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="450.0" y="182.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="201.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard</text><rect x="450.0" y="213.6" width="150.0" height="39.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="237.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV token-shard</text><rect x="450.0" y="253.2" width="150.0" height="8.8" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="257.6" x2="608.0" y2="257.6" stroke="#888" stroke-width="0.8"/><text x="611.0" y="261.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">replicated KV heads</text><rect x="450.0" y="262.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="266.4" x2="608.0" y2="266.4" stroke="#888" stroke-width="0.8"/><text x="611.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="525.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 2</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Model has 2 GQA KV heads; TP=3. Cannot head-shard (2 heads &lt; 3 ranks).</text><text x="20.0" y="74.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Fork: replicate the few KV heads across ranks + token-shard the KV (LSE-merge). Query heads still sharded normally.</text><text x="20.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">The small salmon slice is the only duplicated part (single-digit % KV overhead per the doc); the bulk of KV is still split.</text><text x="20.0" y="106.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: head-axis TP is structurally impossible here — TP is capped at num_kv_heads (=2), the 3rd card cannot join.</text><text x="20.0" y="406.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="409.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="419.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="409.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="419.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="409.0" width="12.0" height="12.0" rx="1" fill="#f2c07a" stroke="#333" stroke-width="0.8"/><text x="337.0" y="419.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">expert scratch / prefetch</text><rect x="470.0" y="409.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="487.0" y="419.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="425.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="435.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>