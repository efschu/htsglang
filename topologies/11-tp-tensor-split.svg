<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 448" width="1320" height="448" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="448.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">11 — One layer's tensors across 3 mismatched cards: uneven-TP vs even-TP</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Decisive setting: --rank-tp-ratio auto (§1, shipped). Cell heights are proportional to each rank's share.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">htsglang sizes each rank's Q-head / FFN / expert shard to its VRAM budget (16/8/8 Q, 512/256/256 FFN = 4/2/2 GPTQ groups). Stock even-TP=3 cannot: 32, 1024 and the 2 KV heads are not divisible by 3, and</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">341.3 is not group-128-aligned.</text><line x1="660.0" y1="123.0" x2="660.0" y2="457.0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="30.0" y="110.0" width="310.0" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — uneven-TP=3, ratio [28,19,19]</text><rect x="680.0" y="110.0" width="194.8" height="21.0" rx="5" fill="#f6e7e7" stroke="#8a2b2b" stroke-width="1.3"/><text x="691.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#8a2b2b">stock sglang — even-TP=3</text><text x="106.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank0 — 5090</text><text x="106.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">cuda:0 · 28000 MiB</text><rect x="40.0" y="171.0" width="132.0" height="58.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="106.0" y="203.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">Q: 16 heads</text><rect x="40.0" y="232.0" width="132.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="106.0" y="247.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV: 2 heads (repl.)</text><rect x="40.0" y="259.0" width="132.0" height="46.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="106.0" y="285.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">FFN 512 = 4 grp</text><rect x="40.0" y="308.0" width="132.0" height="22.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="106.0" y="322.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">256 experts →offload</text><rect x="36.0" y="167.0" width="140.0" height="166.0" rx="4" fill="none" stroke="#1d6b34" stroke-width="2.0"/><text x="271.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank1 — 3080</text><text x="271.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">cuda:1 · 19000 MiB</text><rect x="205.0" y="171.0" width="132.0" height="30.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="271.0" y="189.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">Q: 8</text><rect x="205.0" y="204.0" width="132.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="271.0" y="219.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV: 2 (repl.)</text><rect x="205.0" y="231.0" width="132.0" height="24.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="271.0" y="246.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">FFN 256 = 2 grp</text><rect x="205.0" y="258.0" width="132.0" height="22.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="271.0" y="272.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">experts →offload</text><rect x="201.0" y="167.0" width="140.0" height="116.0" rx="4" fill="none" stroke="#1d6b34" stroke-width="2.0"/><text x="436.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank2 — 3080</text><text x="436.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">cuda:2 · 19000 MiB</text><rect x="370.0" y="171.0" width="132.0" height="30.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="436.0" y="189.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">Q: 8</text><rect x="370.0" y="204.0" width="132.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="436.0" y="219.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV: 2 (repl.)</text><rect x="370.0" y="231.0" width="132.0" height="24.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="436.0" y="246.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">FFN 256 = 2 grp</text><rect x="370.0" y="258.0" width="132.0" height="22.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="436.0" y="272.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">experts →offload</text><rect x="366.0" y="167.0" width="140.0" height="116.0" rx="4" fill="none" stroke="#1d6b34" stroke-width="2.0"/><text x="40.0" y="349.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">Every dimension divides cleanly: 32 Q = 16+8+8, 1024 FFN = 512+256+256,</text><text x="40.0" y="363.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">each FFN shard is a whole multiple of group_size 128 (4/2/2 groups). 2 KV heads &lt; 3 ranks, so KV is replicated + token-sharded (next).</text><text x="760.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank0</text><text x="760.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">even 1/3 share</text><rect x="700.0" y="171.0" width="120.0" height="34.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="760.0" y="191.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">Q 32/3 = 10.7  ✗</text><rect x="700.0" y="208.0" width="120.0" height="26.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="760.0" y="224.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">KV 2/3 = 0.7  ✗</text><rect x="700.0" y="237.0" width="120.0" height="40.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="760.0" y="260.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">FFN 1024/3 = 341.3  ✗</text><rect x="700.0" y="280.0" width="120.0" height="22.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="760.0" y="294.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">not ÷128  ✗</text><rect x="696.0" y="167.0" width="128.0" height="138.0" rx="4" fill="none" stroke="#8a2b2b" stroke-width="2.0"/><text x="910.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank1</text><text x="910.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">even 1/3 share</text><rect x="850.0" y="171.0" width="120.0" height="34.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="910.0" y="191.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">Q 32/3 = 10.7  ✗</text><rect x="850.0" y="208.0" width="120.0" height="26.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="910.0" y="224.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">KV 2/3 = 0.7  ✗</text><rect x="850.0" y="237.0" width="120.0" height="40.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="910.0" y="260.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">FFN 1024/3 = 341.3  ✗</text><rect x="850.0" y="280.0" width="120.0" height="22.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="910.0" y="294.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">not ÷128  ✗</text><rect x="846.0" y="167.0" width="128.0" height="138.0" rx="4" fill="none" stroke="#8a2b2b" stroke-width="2.0"/><text x="1060.0" y="151.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank2</text><text x="1060.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#555">even 1/3 share</text><rect x="1000.0" y="171.0" width="120.0" height="34.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="1060.0" y="191.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">Q 32/3 = 10.7  ✗</text><rect x="1000.0" y="208.0" width="120.0" height="26.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="1060.0" y="224.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">KV 2/3 = 0.7  ✗</text><rect x="1000.0" y="237.0" width="120.0" height="40.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="1060.0" y="260.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">FFN 1024/3 = 341.3  ✗</text><rect x="1000.0" y="280.0" width="120.0" height="22.0" rx="2" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.0"/><text x="1060.0" y="294.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">not ÷128  ✗</text><rect x="996.0" y="167.0" width="128.0" height="138.0" rx="4" fill="none" stroke="#8a2b2b" stroke-width="2.0"/><text x="700.0" y="349.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Even split does not divide: 32, 1024 and 2 are not multiples of 3,</text><text x="700.0" y="363.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">and FFN 341.3 is not a multiple of group_size 128 → GPTQ group-alignment assert. sglang refuses to launch TP=3 here.</text><text x="20.0" y="399.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="405.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="210.0" y="405.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="227.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="400.0" y="405.0" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="417.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="590.0" y="405.0" width="12.0" height="12.0" rx="1" fill="#e9d7d7" stroke="#333" stroke-width="0.8"/><text x="607.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">stock: impossible / wasted</text></svg>