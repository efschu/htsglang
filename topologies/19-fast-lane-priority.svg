<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 469" width="1000" height="469" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1000.0" height="469.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">19 — Fast-lane priority scheduling: preempt a tagged request into the batch</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Opt-in latency-priority class with a starvation guard. Decisive setting: --enable-fast-lane (§16, implemented).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">A request tagged "lane":"fast" preempts into the running batch at once, taking one of a reserved floor of heavy slots; heavy-aging raises long-waiting</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">heavy requests so fast traffic cannot starve them. It composes with session KV spill (a fast request can spill a normal session to host). Default off —</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">the default path is unchanged. Upstream has priority scheduling the fork builds on; this reserved-floor fast-lane class is the fork addition.</text><text x="40.0" y="152.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#111">Running batch (slot budget)</text><rect x="40.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="62.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="90.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="112.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="140.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.1"/><text x="162.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">req</text><rect x="190.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.1"/><text x="212.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">resv</text><text x="212.0" y="195.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7" font-weight="normal" text-anchor="middle" fill="#1a1a1a">heavy</text><rect x="240.0" y="164.0" width="44.0" height="40.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.1"/><text x="262.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">resv</text><text x="262.0" y="195.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7" font-weight="normal" text-anchor="middle" fill="#1a1a1a">heavy</text><text x="40.0" y="220.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#333">reserved-heavy-slots: a floor kept for latency-priority work</text><rect x="40.0" y="242.0" width="150.0" height="28.0" rx="3" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.3"/><text x="115.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">"lane":"fast" request</text><line x1="195.0" y1="256.0" x2="300.0" y2="256.0" stroke="#c65b9b" stroke-width="1.7" marker-end="url(#arr)"/><text x="360.0" y="248.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#c65b9b">preempts INTO the running batch immediately</text><text x="360.0" y="261.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#555">(takes a reserved-heavy slot; no queue wait)</text><text x="40.0" y="286.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">heavy-aging (--fast-lane-heavy-aging-ms): a long-waiting heavy request ages up in priority so fast traffic cannot starve it.</text><rect x="40.0" y="310.0" width="920.0" height="46.0" rx="4" fill="#fdf3e3" stroke="#c88a2b" stroke-width="1.2"/><text x="52.0" y="328.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#8a5a2b">Interaction with session KV spill (§20): fast-lane outranks FCFS — admitting a fast request can spill a normal</text><text x="52.0" y="343.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#8a5a2b">session's KV to host to make room, and a spilled session's restore is held while a fast request is still waiting.</text><text x="40.0" y="378.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Default off (--enable-fast-lane opt-in): the default scheduling path is unchanged.</text><text x="20.0" y="420.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="426.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="37.0" y="436.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="210.0" y="426.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="227.0" y="436.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>