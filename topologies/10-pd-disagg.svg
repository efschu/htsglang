<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 596" width="1320" height="596" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="596.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">10 — PD-disaggregation: pin prefill to the fast x16 card so its collectives skip the x4 lane</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs upstream, which fuses one TP group or needs a homogeneous PD fleet.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left: the prefill instance runs solo TP=1 on the fast x16 5090 (zero cross-GPU traffic); the decode instance runs uneven-TP=3 + DCP on the x4/x8 cards; KV is handed off via mooncake_tcp loopback. Both</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">instances are CUDA-graph-covered by default (prefill = breakable graph, decode = full graph, MEASURED). Two instances = two weight copies; the combined per-card split was not dumped.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream runs PD across identical cards (a prefill pool + a decode pool of equal GPUs) or a single fused TP group. On identical cards there is no x4 lane to route around, so the</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">fork's specific advantage (isolating the slow lane) is rig-specific.</text><rect x="30.0" y="144.0" width="394.6" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — prefill solo on 5090 + decode TP=3 on 3080s</text><rect x="676.0" y="144.0" width="298.0" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — identical PD fleet / fused TP</text><text x="183.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="183.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">prefill TP=1 · x16</text><rect x="113.0" y="221.0" width="140.0" height="100.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="221.0" width="140.0" height="100.0" fill="url(#hatch)" stroke="none"/><text x="183.0" y="274.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">full weights fp8 (prefill)</text><rect x="113.0" y="321.0" width="140.0" height="12.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="321.0" width="140.0" height="12.0" fill="url(#hatch)" stroke="none"/><text x="183.0" y="329.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">prefill KV (handed off)</text><rect x="113.0" y="333.0" width="140.0" height="8.0" rx="2" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="113.0" y="341.0" width="140.0" height="10.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="221.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">decode rank0 · x4</text><rect x="267.0" y="269.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="269.4" width="140.0" height="32.0" fill="url(#hatch)" stroke="none"/><text x="337.0" y="288.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">decode shard</text><rect x="267.0" y="301.4" width="140.0" height="12.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="301.4" width="140.0" height="12.0" fill="url(#hatch)" stroke="none"/><text x="337.0" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">handed KV in</text><rect x="267.0" y="313.4" width="140.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="313.4" width="140.0" height="24.0" fill="url(#hatch)" stroke="none"/><text x="337.0" y="328.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="267.0" y="337.4" width="140.0" height="14.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="347.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="267.0" y="269.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="491.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="491.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">decode rank1 · x8</text><rect x="421.0" y="269.4" width="140.0" height="32.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="269.4" width="140.0" height="32.0" fill="url(#hatch)" stroke="none"/><text x="491.0" y="288.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">decode shard</text><rect x="421.0" y="301.4" width="140.0" height="12.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="301.4" width="140.0" height="12.0" fill="url(#hatch)" stroke="none"/><text x="491.0" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#ffffff">handed KV in</text><rect x="421.0" y="313.4" width="140.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="313.4" width="140.0" height="24.0" fill="url(#hatch)" stroke="none"/><text x="491.0" y="328.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="421.0" y="337.4" width="140.0" height="14.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="347.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="421.0" y="269.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical</text><text x="911.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">prefill pool</text><rect x="841.0" y="255.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="255.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="841.0" y="305.4" width="140.0" height="36.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="305.4" width="140.0" height="36.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="326.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="841.0" y="341.4" width="140.0" height="10.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="341.4" width="140.0" height="10.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="255.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical</text><text x="1065.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">decode pool</text><rect x="995.0" y="255.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="255.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="995.0" y="305.4" width="140.0" height="36.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="305.4" width="140.0" height="36.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="326.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="341.4" width="140.0" height="10.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="341.4" width="140.0" height="10.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="255.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Graph coverage MEASURED; the two-weight-copy combined per-card VRAM was never registry-dumped ("not</text><text x="40.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">captured"). Faster TTFT is EXPECTED (prefill avoids the x4-lane collectives) but the TTFT factor is an</text><text x="40.0" y="422.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">ESTIMATE, not benchmarked on this no-P2P/no-NVLink rig.</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">On identical cards there is no x4 bottleneck to isolate. Illustrative sizes.</text><rect x="40.0" y="449.8" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="467.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork pins prefill to the fast x16 card so its collectives skip the x4 lane; upstream fuses one TP group (prefill uses every link) or needs a homogeneous PD fleet — a placement /</text><text x="54.0" y="482.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">latency-hiding difference that is rig-specific and interconnect-bound here, not a raw-speed win.</text><text x="20.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="457.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged / spilled KV</text><rect x="650.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="667.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="572.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="563.8" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>