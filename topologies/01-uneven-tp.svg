<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="sans-serif"><rect x="0.0" y="0.0" width="680.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="24.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">1 — Two mismatched GPUs, PCIe, no NVLink → uneven Tensor Parallelism</text><text x="20.0" y="41.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">RTX 5090 32 GB + RTX 3080 20 GB. Decisive setting: --rank-tp-ratio (proportional shards).</text><text x="115.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="103.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="110.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="110.0" width="150.0" height="57.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="142.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard (rank0)</text><rect x="40.0" y="167.2" width="150.0" height="57.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="199.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV cache</text><rect x="40.0" y="224.4" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="228.8" x2="198.0" y2="228.8" stroke="#888" stroke-width="0.8"/><text x="201.0" y="232.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><rect x="40.0" y="233.2" width="150.0" height="17.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="245.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><text x="115.0" y="265.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 0  •  ratio 8</text><text x="320.0" y="142.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="320.0" y="155.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="245.0" y="162.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="162.8" width="150.0" height="35.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">weight shard (rank1)</text><rect x="245.0" y="198.0" width="150.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="219.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV cache</text><rect x="245.0" y="233.2" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="237.6" x2="403.0" y2="237.6" stroke="#888" stroke-width="0.8"/><text x="406.0" y="241.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><rect x="245.0" y="242.0" width="150.0" height="8.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="246.4" x2="403.0" y2="246.4" stroke="#888" stroke-width="0.8"/><text x="406.0" y="249.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free</text><text x="320.0" y="265.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 1  •  ratio 5</text><line x1="190.0" y1="170.0" x2="245.0" y2="170.0" stroke="#5a5a5a" stroke-width="2.4"/><text x="217.5" y="166.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">TP collective — NCCL over PCIe host-staging (no NVLink)</text><text x="20.0" y="60.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">--rank-tp-ratio 8,5   (shards sized to each card, not to the smallest)</text><text x="20.0" y="76.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: even TP only — both ranks capped to the 3080's shard; ~12 GB of the 5090 goes unused (grey).</text><text x="520.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a2b2b">stock even-TP</text><rect x="460.0" y="110.0" width="120.0" height="140.8" rx="2" fill="none" stroke="#8a2b2b" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="460.0" y="110.0" width="120.0" height="35.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="520.0" y="131.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">weights (capped)</text><rect x="460.0" y="145.2" width="120.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="520.0" y="166.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV (capped)</text><rect x="460.0" y="180.4" width="120.0" height="70.4" rx="2" fill="none" stroke="#8a2b2b" stroke-width="1.0" stroke-dasharray="4 3"/><text x="520.0" y="215.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a2b2b">WASTED</text><text x="520.0" y="229.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#8a2b2b">~12 GB idle</text><text x="20.0" y="384.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="387.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="397.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="387.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="397.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="387.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="337.0" y="397.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="470.0" y="387.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="487.0" y="397.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>