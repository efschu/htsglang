<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 542" width="660" height="542" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="660.0" height="542.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">4 — MoE with more experts than fit VRAM → per-expert host offload +</text><text x="20.0" y="45.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">uneven-TP</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">35B-A3B on 1×5090 + 2×3080. Decisive setting: resident-fraction expert offload (§6, [in</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">progress]).</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">SGLANG_MOE_RESIDENT_EXPERT_FRACTION&lt;1 [in progress]: a fixed set of experts stays resident</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">(amber), the rest spill to pinned host RAM (red) and are prefetched per forward.</text><text x="20.0" y="135.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Wave-over-tokens prefetch → byte-identical (doc #120: ≈+0.15% ppl, 15/15 batteries). Cost is</text><text x="20.0" y="150.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">throughput (decode ≈1.4×), not quality.</text><text x="20.0" y="169.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: only --cpu-offload-gb (generic, layer-granular, not quant/MoE-aware, slow) or EP</text><text x="20.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">(needs all experts to fit aggregate VRAM).</text><text x="115.0" y="208.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="221.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="229.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="229.0" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="245.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">attn+shared wts</text><rect x="40.0" y="255.4" width="150.0" height="35.2" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="276.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">resident experts</text><rect x="40.0" y="290.6" width="150.0" height="13.2" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="300.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">prefetch</text><rect x="40.0" y="303.8" width="150.0" height="57.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="336.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">KV cache</text><rect x="40.0" y="361.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="365.4" x2="198.0" y2="365.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="368.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="115.0" y="384.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">rank 0</text><text x="320.0" y="260.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="320.0" y="273.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="245.0" y="281.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="281.8" width="150.0" height="17.6" rx="2" fill="#3b6fb0" strok