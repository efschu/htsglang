art" fill="#333">ctx</text><text x="525.0" y="414.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">rank 2</text><line x1="217.5" y1="399.8" x2="217.5" y2="443.8" stroke="#5a5a5a" stroke-width="2.2"/><text x="217.5" y="410.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">PCIe</text><line x1="422.5" y1="399.8" x2="422.5" y2="443.8" stroke="#5a5a5a" stroke-width="2.2"/><text x="422.5" y="410.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a">PCIe</text><text x="40.0" y="436.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#333">Pinned host RAM (DDR)</text><rect x="40.0" y="443.8" width="560.0" height="34.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="443.8" width="403.2" height="34.0" rx="2" fill="#c0504d" stroke="#2b2b2b" stroke-width="1.0"/><text x="241.6" y="464.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#ffffff">cold experts (pinned) — fetched per token-wave</text><rect x="443.2" y="443.8" width="156.8" height="34.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="521.6" y="464.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><text x="20.0" y="507.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="513.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="523.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-a