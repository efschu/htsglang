ont-weight="normal" text-anchor="start" fill="#2b6b3a">Slow-card weight VRAM → ≈0 (thin blue sliver); ≈14 GB freed per worker → doc: ≈4× context on the 27B test model. Extend Δ=0 vs full-TP=1.</text><text x="20.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: every rank must hold layer weights — the slow cards spend VRAM on weight replicas/shards instead of pure KV headroom.</text><text x="20.0" y="430.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="337.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="470.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="487.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>