<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 819" width="1320" height="819" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="819.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">6 — Weightless-KV lane: free the workers of weights so their freed VRAM becomes device KV</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig (head holds all weights, workers become device-KV donors) vs upstream, where every rank splits VRAM between weights and KV.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured, PRIMARY): --weightless-kv-fastlane, TP=3 + DCP. rank0 (5090) is the HEAD — it holds ALL layer weights (TP=1). rank1/2 (3080) are WEIGHTLESS meta-device workers with ZERO layer weights</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">(~14 GiB freed EACH, MEASURED); that freed VRAM instead carries DEVICE KV — KV token-shards + KV-heads — and the workers compute the attention over it. The slow cards become on-device KV DONORS: pooled</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">device KV across the freed workers is the capacity win.</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a5a2b">Secondary (extreme context only): an OPTIONAL host-KV tier sits ON TOP, used only for context that exceeds the pooled device KV — up to 262k tokens proven (~12.6 GiB pinned host, #134 B1/B2,</text><text x="20.0" y="131.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a5a2b">needle-at-midpoint retrieved). It is an extension, not the primary store; the 262k extreme config deliberately shrinks the device pool and pushes most KV to host (40000 device / 64000 host slots),</text><text x="20.0" y="146.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a5a2b">whereas in the normal case the freed worker VRAM holds the device KV.</text><text x="20.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): a homogeneous upstream even-TP holds the layer weights on EVERY rank, so each identical card splits its VRAM between weights and KV — there are no weightless workers, so per-card</text><text x="20.0" y="180.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">context is bounded without more/bigger equal cards.</text><rect x="30.0" y="208.0" width="525.7" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="223.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — head holds weights, workers become device-KV donors (measured)</text><rect x="676.0" y="208.0" width="373.9" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="223.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — N identical cards, weights on every rank</text><text x="183.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="183.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">HEAD · 22.8 GB used</text><rect x="113.0" y="285.0" width="140.0" height="68.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="322.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">ALL layer weights (TP=1)</text><rect x="113.0" y="353.0" width="140.0" height="16.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="353.0" width="140.0" height="16.0" fill="url(#hatch)" stroke="none"/><text x="183.0" y="364.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">head KV</text><rect x="113.0" y="369.0" width="140.0" height="7.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="113.0" y="369.0" width="140.0" height="7.2" fill="url(#hatch)" stroke="none"/><rect x="113.0" y="376.2" width="140.0" height="39.2" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="399.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="113.0" y="285.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="314.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="326.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">weightless worker</text><rect x="267.0" y="333.4" width="140.0" height="1.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="334.6" width="140.0" height="64.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="369.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">device KV (freed VRAM)</text><rect x="267.0" y="398.6" width="140.0" height="2.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="267.0" y="398.6" width="140.0" height="2.8" fill="url(#hatch)" stroke="none"/><rect x="267.0" y="401.4" width="140.0" height="14.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="411.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="267.0" y="333.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="491.0" y="314.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="491.0" y="326.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">weightless worker</text><rect x="421.0" y="333.4" width="140.0" height="1.2" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="334.6" width="140.0" height="64.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="369.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">device KV (freed VRAM)</text><rect x="421.0" y="398.6" width="140.0" height="2.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="421.0" y="398.6" width="140.0" height="2.8" fill="url(#hatch)" stroke="none"/><rect x="421.0" y="401.4" width="140.0" height="14.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="411.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="421.0" y="333.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="300.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="911.0" y="312.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · even TP</text><rect x="841.0" y="319.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="319.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="347.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (every rank)</text><rect x="841.0" y="369.4" width="140.0" height="38.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="369.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="391.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="841.0" y="407.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="407.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="413.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="413.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="319.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="300.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="1065.0" y="312.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · even TP</text><rect x="995.0" y="319.4" width="140.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="319.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="347.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights (every rank)</text><rect x="995.0" y="369.4" width="140.0" height="38.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="369.4" width="140.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="391.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="407.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="407.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="413.4" width="140.0" height="2.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="413.4" width="140.0" height="2.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="319.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="221.0" x2="660.0" y2="433.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="447.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — OPTIONAL extreme-context tier (only beyond pooled device KV)</text><rect x="40.0" y="453.4" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="453.4" width="249.5" height="32.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="164.7" y="472.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">~12.6 GB pinned — beyond device pool → 262k (#134)</text><rect x="289.5" y="453.4" width="344.5" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="40.0" y="504.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">PRIMARY win = pooled DEVICE KV on the freed workers (0 layer weights, ~14 GiB freed each, MEASURED; head</text><text x="40.0" y="518.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">22.8 / worker 3.7 GiB VRAM in the 262k run). The host tier is a SECONDARY extension for context beyond</text><text x="40.0" y="532.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">that; it stages only ~C/dcp_size per rank (3.5x host-RAM saving), no unverified context multiplier</text><text x="40.0" y="545.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">claimed.</text><text x="40.0" y="572.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">Throughput is interconnect-bound, NOT a "fast" claim: ~25 tok/s @8k · ~7 @28k · ~1.5 @262k eager</text><text x="40.0" y="586.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">(graph+prefetch raises exact-rung to ~26-29). After #136a/#136b the PCIe wall is mostly hidden, so the</text><text x="40.0" y="600.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">deep-context floor is now block-attention compute + per-layer collectives on the slow workers, not H2D</text><text x="40.0" y="614.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">bandwidth.</text><text x="686.0" y="458.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Weights compete with KV on every identical card; no weightless workers. Illustrative sizes.</text><rect x="40.0" y="641.8" width="1250.0" height="63.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="659.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork frees the worker cards of ALL weights (~14 GiB each) so their VRAM becomes pooled DEVICE KV — the slow cards turn into KV donors that also compute attention; an OPTIONAL host tier</text><text x="54.0" y="674.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">extends context to a proven 262k only beyond the pooled device KV. Upstream spends every identical card's VRAM on both weights and KV. A capacity feature — throughput is interconnect-bound on</text><text x="54.0" y="689.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">this no-NVLink rig, not a speed win.</text><text x="20.0" y="732.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="738.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="748.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="738.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="748.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="738.8" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="457.0" y="748.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged / spilled KV</text><rect x="650.0" y="738.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="667.0" y="748.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="754.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="764.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="795.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="786.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="796.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="786.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="786.7999999999996" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="796.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="786.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="796.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>