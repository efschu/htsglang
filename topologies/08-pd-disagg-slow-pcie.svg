<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 482" width="700" height="482" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="700.0" height="482.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">8 — A slow PCIe x4 link in the rig → PD-disaggregation placement</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">5090 on x16 (prefill), 3080s on x4 (decode). Decisive setting: single-node PD-disagg (§2).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">One decode card sits behind a slow PCIe x4 link (dashed brown). Put PREFILL on the fast x16 card so it</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">runs alone, zero cross-GPU comm; the KV handoff uses mooncake_tcp loopback (teal region on the decode</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">cards).</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Faster TTFT is expected because prefill avoids the x4-lane collectives; decode stays distributed and</text><text x="20.0" y="131.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">largely unchanged. Handoff is crash-robust and tears down to 0 MiB. (The TTFT factor is an estimate, not</text><text x="20.0" y="146.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">benchmarked on this rig.)</text><text x="20.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Upstream sglang: a single fused TP group runs every prefill collective over every link in the group,</text><text x="20.0" y="180.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">including the x4 lane.</text><text x="115.0" y="204.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="217.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">32 GB • PCIe x16</text><rect x="40.0" y="225.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="225.0" width="150.0" height="61.6" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="259.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">full weights — PREFILL</text><rect x="40.0" y="286.6" width="150.0" height="61.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="321.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">prefill KV (handed off)</text><rect x="40.0" y="348.2" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="352.6" x2="198.0" y2="352.6" stroke="#888" stroke-width="0.8"/><text x="201.0" y="355.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><rect x="40.0" y="357.0" width="150.0" height="8.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="361.4" x2="198.0" y2="361.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="364.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">free</text><text x="115.0" y="380.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">solo prefill TP=1 • zero cross-GPU traffic</text><text x="320.0" y="256.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="320.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">20 GB • PCIe x4</text><rect x="245.0" y="277.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="277.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="296.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode wt shard</text><rect x="245.0" y="308.6" width="150.0" height="17.6" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="321.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">handed KV in</text><rect x="245.0" y="326.2" width="150.0" height="30.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="345.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="245.0" y="357.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="361.4" x2="403.0" y2="361.4" stroke="#888" stroke-width="0.8"/><text x="406.0" y="364.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="320.0" y="380.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">decode rank 0 (TP=2 uneven+DCP)</text><text x="525.0" y="256.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="525.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#444">20 GB • PCIe x4</text><rect x="450.0" y="277.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="450.0" y="277.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="296.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode wt shard</text><rect x="450.0" y="308.6" width="150.0" height="17.6" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="321.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">handed KV in</text><rect x="450.0" y="326.2" width="150.0" height="30.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="345.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="450.0" y="357.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="361.4" x2="608.0" y2="361.4" stroke="#888" stroke-width="0.8"/><text x="611.0" y="364.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="525.0" y="380.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">decode rank 1 (TP=2 uneven+DCP)</text><line x1="190.0" y1="315.0" x2="245.0" y2="315.0" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="217.5" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#8a5a2b">x4 KV in</text><line x1="395.0" y1="345.0" x2="450.0" y2="345.0" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="422.5" y="340.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#8a5a2b">x4</text><text x="20.0" y="417.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="423.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="433.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="185.0" y="423.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="202.0" y="433.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="350.0" y="423.8" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="367.0" y="433.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged KV</text><rect x="515.0" y="423.8" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="532.0" y="433.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="439.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="449.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>