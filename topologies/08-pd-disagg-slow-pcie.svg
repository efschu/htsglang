<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="sans-serif"><rect x="0.0" y="0.0" width="640.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="24.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">8 — A slow PCIe x4 link in the rig → PD-disaggregation placement</text><text x="20.0" y="41.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">5090 on x16 (prefill), 3080s on x4 (decode). Decisive setting: single-node PD-disagg (§2).</text><text x="115.0" y="105.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090 (PCIe x16)</text><text x="115.0" y="118.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="125.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="125.0" width="150.0" height="61.6" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="159.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">full weights — PREFILL role</text><rect x="40.0" y="186.6" width="150.0" height="61.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="221.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">prefill KV (handed off)</text><rect x="40.0" y="248.2" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="252.6" x2="198.0" y2="252.6" stroke="#888" stroke-width="0.8"/><text x="201.0" y="256.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><rect x="40.0" y="257.0" width="150.0" height="8.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="261.4" x2="198.0" y2="261.4" stroke="#888" stroke-width="0.8"/><text x="201.0" y="264.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free</text><text x="115.0" y="280.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">solo prefill TP=1  •  zero cross-GPU traffic</text><text x="320.0" y="157.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080 (PCIe x4)</text><text x="320.0" y="170.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="245.0" y="177.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="177.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="196.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode weight shard</text><rect x="245.0" y="208.6" width="150.0" height="13.2" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="215.2" x2="403.0" y2="215.2" stroke="#888" stroke-width="0.8"/><text x="406.0" y="218.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">handed-off KV in</text><rect x="245.0" y="221.8" width="150.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="243.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="245.0" y="257.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="261.4" x2="403.0" y2="261.4" stroke="#888" stroke-width="0.8"/><text x="406.0" y="264.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="320.0" y="280.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">decode rank 0  (TP=2 uneven+DCP)</text><text x="525.0" y="157.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080 (PCIe x4)</text><text x="525.0" y="170.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="450.0" y="177.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="450.0" y="177.8" width="150.0" height="30.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="196.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode weight shard</text><rect x="450.0" y="208.6" width="150.0" height="13.2" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="215.2" x2="608.0" y2="215.2" stroke="#888" stroke-width="0.8"/><text x="611.0" y="218.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">handed-off KV in</text><rect x="450.0" y="221.8" width="150.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="243.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">decode KV</text><rect x="450.0" y="257.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="261.4" x2="608.0" y2="261.4" stroke="#888" stroke-width="0.8"/><text x="611.0" y="264.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="525.0" y="280.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">decode rank 1  (TP=2 uneven+DCP)</text><line x1="190.0" y1="165.0" x2="245.0" y2="165.0" stroke="#8a5a2b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="217.5" y="161.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#8a5a2b">KV handoff (mooncake_tcp loopback)</text><line x1="395.0" y1="290.0" x2="450.0" y2="290.0" stroke="#8a5a2b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="422.5" y="286.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#8a5a2b">decode collective</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">One decode card sits behind a slow PCIe x4 link (dashed brown). Put PREFILL on the fast x16 card so it runs alone, zero cross-GPU comm.</text><text x="20.0" y="74.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Doc: ≈2-5× faster TTFT; decode stays distributed (negligible ≈-2% long ctx). Crash-robust handoff, tears down to 0 MiB.</text><text x="20.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: a single TP group forces every prefill collective over the x4 link too — the slow lane throttles time-to-first-token.</text><text x="20.0" y="430.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="337.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged KV</text><rect x="470.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="487.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="449.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="459.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>