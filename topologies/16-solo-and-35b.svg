al to</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">TP=1 under uneven-TP+DCP.</text><line x1="600.0" y1="123.0" x2="600.0" y2="427.0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="30.0" y="110.0" width="302.8" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1d6b34">solo 1-card 122B — f=0.15 (39 resident)</text><rect x="620.0" y="110.0" width="310.0" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="631.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1d6b34">35B-A3B TP=3 — 2/1/1 groups, 11.83 tok/s</text><text x="130.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090 (solo, TP=1)</text><rect x="60.0" y="177.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.5"/><rect x="60.0" y="177.0" width="140.0" height="16.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="130.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">attn+shared wts</text><rect x="60.0" y="193.0" width="140.0" height="48.0" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="130.0" y="220.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">39 resident experts/layer</text><rect x="60.0" y="241.0" width="140.0" height="8.0" rx="2" fill="#f2c07a" stroke="#2b2b2b" stroke-width="1.0"/><rect x="60.0" y="249.0" width="140.0" height="24.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"