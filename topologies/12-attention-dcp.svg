<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 546" width="1320" height="546" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="546.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">12 — 2 KV heads across 3 ranks: the DCP token-shard (the crux)</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Decisive setting: replicated-KV + uneven-DCP (§1/§9, shipped). Why 2 KV heads on 3 cards is the hard case.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">The 122B has only 2 GQA KV heads but runs TP=3. It cannot head-shard (2&lt;3), so the fork REPLICATES the 2 KV heads on every rank and shards the KV cache by TOKEN (dcp-size 3): each rank attends its</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">token-slice, then a Q-broadcast + LSE-merge stitches the partial softmaxes.</text><line x1="660.0" y1="123.0" x2="660.0" y2="487.0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="30.0" y="110.0" width="454.0" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — TP &gt; num_kv_heads: replicate KV + DCP token-shard</text><rect x="680.0" y="110.0" width="259.6" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="691.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#4a5568">upstream sglang — head-sharded KV</text><text x="40.0" y="161.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">sequence KV (per full-attn layer), split along the TOKEN axis:</text><rect x="40.0" y="167.0" width="218.4" height="26.0" rx="2" fill="#cfe0f0" stroke="#2b2b2b" stroke-width="1.0"/><text x="149.2" y="183.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">rank0: tokens 0..t0</text><rect x="258.4" y="167.0" width="150.8" height="26.0" rx="2" fill="#d4ecd9" stroke="#2b2b2b" stroke-width="1.0"/><text x="333.8" y="183.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">rank1: t0..t1</text><rect x="409.2" y="167.0" width="150.8" height="26.0" rx="2" fill="#f5e3c7" stroke="#2b2b2b" stroke-width="1.0"/><text x="484.6" y="183.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">rank2: t1..T</text><rect x="40.0" y="225.0" width="150.0" height="20.0" rx="1.5" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="0.8"/><text x="115.0" y="237.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">Q (new token), 32 heads</text><rect x="40.0" y="277.0" width="150.0" height="74.0" rx="3" fill="#cfe0f0" stroke="#2b2b2b" stroke-width="1.2"/><text x="115.0" y="291.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank0</text><rect x="48.0" y="299.0" width="60.0" height="16.0" rx="1.5" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="0.8"/><text x="78.0" y="309.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">2 KV</text><text x="145.0" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">Q 16 heads</text><text x="115.0" y="329.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">partial attn</text><text x="115.0" y="342.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">+ local LSE</text><line x1="115.0" y1="245.0" x2="115.0" y2="275.0" stroke="#3b6fb0" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrB)"/><rect x="220.0" y="277.0" width="150.0" height="74.0" rx="3" fill="#d4ecd9" stroke="#2b2b2b" stroke-width="1.2"/><text x="295.0" y="291.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank1</text><rect x="228.0" y="299.0" width="60.0" height="16.0" rx="1.5" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="0.8"/><text x="258.0" y="309.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">2 KV</text><text x="325.0" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">Q 8 heads</text><text x="295.0" y="329.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">partial attn</text><text x="295.0" y="342.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">+ local LSE</text><line x1="115.0" y1="245.0" x2="295.0" y2="275.0" stroke="#3b6fb0" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrB)"/><rect x="400.0" y="277.0" width="150.0" height="74.0" rx="3" fill="#f5e3c7" stroke="#2b2b2b" stroke-width="1.2"/><text x="475.0" y="291.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank2</text><rect x="408.0" y="299.0" width="60.0" height="16.0" rx="1.5" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="0.8"/><text x="438.0" y="309.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">2 KV</text><text x="505.0" y="310.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">Q 8 heads</text><text x="475.0" y="329.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">partial attn</text><text x="475.0" y="342.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555">+ local LSE</text><line x1="115.0" y1="245.0" x2="475.0" y2="275.0" stroke="#3b6fb0" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrB)"/><rect x="180.0" y="377.0" width="200.0" height="26.0" rx="3" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.2"/><text x="280.0" y="393.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#fff">LSE-merge → attention out</text><line x1="115.0" y1="351.0" x2="280.0" y2="375.0" stroke="#227a3a" stroke-width="1.7" marker-end="url(#arrG)"/><line x1="295.0" y1="351.0" x2="280.0" y2="375.0" stroke="#227a3a" stroke-width="1.7" marker-end="url(#arrG)"/><line x1="475.0" y1="351.0" x2="280.0" y2="375.0" stroke="#227a3a" stroke-width="1.7" marker-end="url(#arrG)"/><text x="40.0" y="425.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">Each rank holds BOTH KV heads (replicated) but only its token-slice of the</text><text x="40.0" y="439.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">cache. Q is broadcast; ranks attend their slice; LSE-merge stitches the</text><text x="40.0" y="453.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">partial softmaxes. Aggregate KV capacity scales with ranks (§1, shipped).</text><text x="700.0" y="161.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#333">upstream shards KV by HEAD — one KV head per rank:</text><rect x="700.0" y="167.0" width="90.0" height="40.0" rx="1.5" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="0.8"/><text x="745.0" y="190.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV head 0</text><rect x="810.0" y="167.0" width="90.0" height="40.0" rx="1.5" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="0.8"/><text x="855.0" y="190.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#fff">KV head 1</text><line x1="745.0" y1="211.0" x2="730.0" y2="271.0" stroke="#227a3a" stroke-width="1.7" marker-end="url(#arrG)"/><line x1="855.0" y1="211.0" x2="850.0" y2="271.0" stroke="#227a3a" stroke-width="1.7" marker-end="url(#arrG)"/><rect x="700.0" y="277.0" width="130.0" height="60.0" rx="3" fill="#cfe0f0" stroke="#2b2b2b" stroke-width="1.2"/><text x="765.0" y="297.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank0</text><text x="765.0" y="317.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">KV head 0</text><rect x="850.0" y="277.0" width="130.0" height="60.0" rx="3" fill="#d4ecd9" stroke="#2b2b2b" stroke-width="1.2"/><text x="915.0" y="297.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank1</text><text x="915.0" y="317.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">KV head 1</text><rect x="1000.0" y="277.0" width="130.0" height="60.0" rx="3" fill="#e9d7d7" stroke="#2b2b2b" stroke-width="1.2"/><text x="1065.0" y="297.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rank2</text><text x="1065.0" y="317.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a5568">no head-axis KV</text><text x="700.0" y="377.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#4a5568">2 KV heads, 3 ranks: rank2 is not covered by the head split.</text><text x="700.0" y="392.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#4a5568">Head-axis KV requires num_kv_heads ≥ tp (2 &lt; 3 here).</text><text x="700.0" y="407.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#4a5568">Replicating the whole KV on every rank is possible and stores</text><text x="700.0" y="421.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#4a5568">the full cache on each card (no token-capacity gain from more cards).</text><text x="20.0" y="497.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="503.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="513.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="210.0" y="503.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="227.0" y="513.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="400.0" y="503.0" width="12.0" height="12.0" rx="1" fill="#e9d7d7" stroke="#333" stroke-width="0.8"/><text x="417.0" y="513.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">upstream: unused / not admitted here</text></svg>