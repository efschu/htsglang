<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="540.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">18 — Session KV spill: overflow the newest session to host RAM, keep decoding</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Per-session KV offload under VRAM pressure. Decisive setting: --enable-kv-session-offload (§20, experimental S1).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">When device KV overflows, the newest active session's KV shard is offloaded to host RAM and that session keeps decoding via host-streamed attention, instead of being</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">paused. Victim order is strict FCFS (oldest stays resident) with fast-lane precedence; sessions restore FIFO when capacity frees; only KV spills, GDN state stays resident.</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Upstream retracts/recomputes or swaps a request (paused, not decoded from host).</text><text x="40.0" y="152.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#111">Device VRAM — full-attention KV, one shard per active session (FCFS):</text><rect x="40.0" y="164.0" width="118.0" height="46.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.3"/><text x="99.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">S1 oldest</text><text x="99.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV shard</text><rect x="170.0" y="164.0" width="118.0" height="46.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.3"/><text x="229.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">S2</text><text x="229.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV shard</text><rect x="300.0" y="164.0" width="118.0" height="46.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.3"/><text x="359.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">S3</text><text x="359.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV shard</text><rect x="430.0" y="164.0" width="118.0" height="46.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="4 3"/><text x="489.0" y="184.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">S4 newest</text><text x="489.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">KV shard</text><rect x="568.0" y="164.0" width="96.0" height="46.0" rx="1.5" fill="#c9b8e0" stroke="#2b2b2b" stroke-width="0.8"/><text x="616.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">GDN state</text><text x="616.0" y="224.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#4a3b66">always resident</text><text x="489.0" y="162.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#c0504d">VRAM overflow (after tree eviction)</text><text x="40.0" y="253.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — spilled session KV</text><rect x="40.0" y="260.0" width="1040.0" height="34.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="260.0" width="312.0" height="34.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="196.0" y="280.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#ffffff">S4 KV (host-streamed, still decoding)</text><rect x="352.0" y="260.0" width="728.0" height="34.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="716.0" y="280.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">host KV tier</text><line x1="489.0" y1="210.0" x2="196.0" y2="260.0" stroke="#c0504d" stroke-width="1.7" marker-end="url(#arrR)"/><text x="550.0" y="238.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#c0504d">spill newest first (FCFS victim)</text><line x1="352.0" y1="260.0" x2="489.0" y2="212.0" stroke="#3f9fa0" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="476.8" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#227a3a">FIFO restore when device capacity frees (~0.4 s)</text><text x="40.0" y="320.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">Mechanism: on KV overflow the NEWEST session's full-attention KV shard is moved to host RAM (block-LSE attention + double-buffer prefetch, reused from the weightless lane) and that</text><text x="40.0" y="333.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">session keeps DECODING from host, in a separate eager bs=1 tick — never mixed into the device CUDA-graph batch. The oldest session stays fully device-resident until it finishes (strict</text><text x="40.0" y="347.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">FCFS). Only KV spills; GDN/Mamba state is always resident. Fast-lane requests take precedence (restore is held while a fast request waits).</text><rect x="40.0" y="369.4" width="510.0" height="78.0" rx="4" fill="#eef5ef" stroke="#1d6b34" stroke-width="1.3"/><text x="52.0" y="385.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#1d6b34">S1 — measured (landed)</text><text x="52.0" y="401.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• zero-overhead when unused +0.16% (&lt;1% bar)</text><text x="52.0" y="415.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• host decode 8.1 tok/s @1k ctx; restore 0.4 s</text><text x="52.0" y="429.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• determinism 50/50 exact host-vs-device tokens</text><rect x="570.0" y="369.4" width="510.0" height="78.0" rx="4" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="582.0" y="385.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.2" font-weight="bold" text-anchor="start" fill="#4a5568">design model — modeled, not benchmarked (needs S2)</text><text x="582.0" y="401.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• 12 KiB/token fp8, x4 link, DCP R=3 + overlap:</text><text x="582.0" y="415.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• 32k ≈63 · 64k ≈31 · 128k ≈16 · 262k ≈7.6 tok/s</text><text x="582.0" y="429.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="start" fill="#1a1a1a">• worthwhile only with uneven DCP (262k ≈3.8 without)</text><text x="20.0" y="491.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="497.4" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="37.0" y="507.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="210.0" y="497.4" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="227.0" y="507.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged KV</text><rect x="400.0" y="497.4" width="12.0" height="12.0" rx="1" fill="#c9b8e0" stroke="#333" stroke-width="0.8"/><text x="417.0" y="507.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN recurrent state</text><rect x="590.0" y="497.4" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="607.0" y="507.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>