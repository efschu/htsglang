<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="sans-serif"><rect x="0.0" y="0.0" width="640.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="24.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">7 — More ranks than cards → multi-rank co-location (TP=5 on 3 physical GPUs)</text><text x="20.0" y="41.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">1×5090 (2 ranks) + 2×3080 (1 rank each). Decisive setting: --rank-gpu-id duplicates (§9).</text><text x="115.0" y="110.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="115.0" y="123.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">32 GB VRAM</text><rect x="40.0" y="130.0" width="150.0" height="140.8" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="40.0" y="130.0" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="146.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 0 shard</text><rect x="40.0" y="156.4" width="150.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="177.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 0 KV</text><rect x="40.0" y="191.6" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="208.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 1 shard</text><rect x="40.0" y="218.0" width="150.0" height="35.2" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="115.0" y="239.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 1 KV</text><rect x="40.0" y="253.2" width="150.0" height="13.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="259.8" x2="198.0" y2="259.8" stroke="#888" stroke-width="0.8"/><text x="201.0" y="263.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">2× ctx</text><rect x="40.0" y="266.4" width="150.0" height="4.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><line x1="190.0" y1="268.6" x2="198.0" y2="268.6" stroke="#888" stroke-width="0.8"/><text x="201.0" y="272.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free</text><text x="115.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">2 co-located ranks (2 processes, same CUDA_VISIBLE_DEVICES)</text><text x="320.0" y="162.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="320.0" y="175.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="245.0" y="182.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="245.0" y="182.8" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="199.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 2 shard</text><rect x="245.0" y="209.2" width="150.0" height="52.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="320.0" y="239.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 2 KV</text><rect x="245.0" y="262.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="395.0" y1="266.4" x2="403.0" y2="266.4" stroke="#888" stroke-width="0.8"/><text x="406.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="320.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 2</text><text x="525.0" y="162.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="525.0" y="175.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#444">20 GB VRAM</text><rect x="450.0" y="182.8" width="150.0" height="88.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="450.0" y="182.8" width="150.0" height="26.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="199.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 3 shard</text><rect x="450.0" y="209.2" width="150.0" height="52.8" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="525.0" y="239.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#ffffff">rank 3 KV</text><rect x="450.0" y="262.0" width="150.0" height="8.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="600.0" y1="266.4" x2="608.0" y2="266.4" stroke="#888" stroke-width="0.8"/><text x="611.0" y="269.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ctx</text><text x="525.0" y="285.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#333">rank 3</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">--rank-gpu-id 0,0,1,2 (duplicate → co-location). TP=5 emulated on 3 cards; NCCL multi-rank auto-set; physical-impossibility check enforced.</text><text x="20.0" y="74.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2b6b3a">Used to prove replicated-KV at TP=5 (#62) without owning 5 GPUs. Honest caveat: co-located ranks share silicon — capability, not bandwidth.</text><text x="20.0" y="90.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8a2b2b">Stock sglang: TP is bounded by the physical GPU count — you cannot place two ranks on one card, so TP=5 on 3 cards is impossible.</text><text x="20.0" y="106.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#333">The 5090 box shows TWO stacked (weights+KV) blocks — two independent ranks sharing one physical card.</text><text x="20.0" y="430.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="170.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="187.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="320.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="337.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="470.0" y="433.0" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="487.0" y="443.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>