<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 685" width="1320" height="685" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="685.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">3 — Cross-algorithm drafter routing (NEXTN ↔ DFLASH): dual residence, itemised per-rung cost</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig (TP=3 uneven) vs a homogeneous upstream TP=2 running one fixed drafter.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): both drafters resident behind --speculative-cross-algorithm. The solo-draft pool costs 4.58 GiB on rank0 (5090); the per-k rung graphs/state are itemised DFLASH_k16 662 / EAGLE_k3 634 /</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">EAGLE_k2 554 MiB. Draft graphs push rank0 graphs to 7.44 GiB.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): the homogeneous upstream reference is 2 identical 24 GB cards at even TP=2 running ONE FIXED drafter (e.g. NEXTN k=3) — a single draft residence, no per-k rung tags, no</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">dual-residence and no runtime routing (upstream cannot switch draft algorithm). Less draft VRAM, but no runtime choice.</text><rect x="30.0" y="144.0" width="449.8" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — TP=3 uneven, cross-algo drafter resident (measured)</text><rect x="676.0" y="144.0" width="429.1" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x identical 24 GB, even TP=2, one fixed drafter</text><text x="191.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="191.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · 28.5 GB used</text><rect x="125.0" y="221.0" width="132.0" height="52.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="125.0" y="273.4" width="132.0" height="5.5" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="125.0" y="278.8" width="132.0" height="7.8" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="125.0" y="286.7" width="132.0" height="18.3" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="299.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">solo-draft pool</text><rect x="125.0" y="305.0" width="132.0" height="29.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="323.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">graphs incl draft</text><rect x="125.0" y="334.8" width="132.0" height="16.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="346.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="125.0" y="221.0" width="132.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · 18.6 GB</text><rect x="271.0" y="269.4" width="132.0" height="32.1" rx="2" fill="#3b6fb0" stroke="#2b2