<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 685" width="1320" height="685" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="685.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">3 — Adaptive drafter routing (NEXTN ↔ DFLASH): dual residence, itemised per-rung cost</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs a homogeneous upstream single-drafter config.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): both drafters resident behind --speculative-cross-algorithm. The solo-draft pool costs 4.58 GiB on rank0 (5090); the per-k rung graphs/state are itemised DFLASH_k16 662 / EAGLE_k3 634 /</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">EAGLE_k2 554 MiB. Draft graphs push rank0 graphs to 7.44 GiB.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream runs ONE drafter (NEXTN/EAGLE) with adaptive k — one draft head + its k-ladder (~0.6–0.7 GiB), on a single card (TP=1) or 2 identical cards. ~4.6 GiB less draft VRAM, but</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">it cannot switch draft algorithm on a regime change.</text><rect x="30.0" y="144.0" width="422.2" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — cross-algo drafter resident (measured registry)</text><rect x="676.0" y="144.0" width="325.6" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — single drafter, adaptive k (TP=1)</text><text x="191.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="191.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · 28.5 GB used</text><rect x="125.0" y="221.0" width="132.0" height="52.4" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="125.0" y="273.4" width="132.0" height="5.5" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><rect x="125.0" y="278.8" width="132.0" height="7.8" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="125.0" y="286.7" width="132.0" height="18.3" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="299.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">solo-draft pool</text><rect x="125.0" y="305.0" width="132.0" height="29.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="323.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">graphs incl draft</text><rect x="125.0" y="334.8" width="132.0" height="16.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="191.0" y="346.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="125.0" y="221.0" width="132.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · 18.6 GB</text><rect x="271.0" y="269.4" width="132.0" height="32.1" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="288.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="271.0" y="301.5" width="132.0" height="25.6" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="317.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV pool</text><rect x="271.0" y="327.2" width="132.0" height="5.7" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="271.0" y="332.9" width="132.0" height="9.9" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="340.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#1a1a1a">graphs</text><rect x="271.0" y="342.8" width="132.0" height="8.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="271.0" y="269.4" width="132.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="483.0" y="250.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="483.0" y="262.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · 18.4 GB</text><rect x="417.0" y="269.4" width="132.0" height="30.7" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="483.0" y="288.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="417.0" y="300.1" width="132.0" height="27.5" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="483.0" y="317.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV pool</text><rect x="417.0" y="327.6" width="132.0" height="4.5" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="417.0" y="332.1" width="132.0" height="9.9" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="483.0" y="339.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#1a1a1a">graphs</text><rect x="417.0" y="342.0" width="132.0" height="9.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="417.0" y="269.4" width="132.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="988.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical card</text><text x="988.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">TP=1 · one drafter</text><rect x="913.0" y="255.4" width="150.0" height="52.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="255.4" width="150.0" height="52.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="284.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="913.0" y="307.4" width="150.0" height="2.6" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="307.4" width="150.0" height="2.6" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="310.0" width="150.0" height="30.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="310.0" width="150.0" height="30.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="328.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="913.0" y="340.0" width="150.0" height="4.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="340.0" width="150.0" height="4.8" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="344.8" width="150.0" height="6.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="344.8" width="150.0" height="6.6" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="383.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — solo-draft placement</text><rect x="40.0" y="389.4" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="389.4" width="166.3" height="32.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="123.2" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">~2–3 GB draft (embed/lm_head + draft KV)</text><rect x="206.3" y="389.4" width="427.7" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="40.0" y="440.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Rung tags itemised (MEASURED): DFLASH_k16 662 · EAGLE_k3 634 · EAGLE_k2 554 MiB. KV budget cost of the</text><text x="40.0" y="454.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">cross-gate: ~282k vs ~524k tokens without it (MEASURED).</text><text x="40.0" y="481.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">Honest claim: robustness / no-regret on mixed streams, NOT a peak speedup — switching costs ~+5.7%</text><text x="40.0" y="494.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">systemic vs a single static drafter (MEASURED).</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">One resident drafter, no cross-algo pool. Assumed card; not measured.</text><rect x="40.0" y="522.6" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="540.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork keeps two draft algorithms resident and routes per round (~4.6 GiB on rank0 plus a KV-budget cost) to stay no-regret across mixed streams; upstream runs one drafter (less VRAM)</text><text x="54.0" y="555.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">tuned to one regime — an observability / robustness trade, not a peak-speed win.</text><text x="20.0" y="598.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="667.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP draft head / draft pool</text><rect x="20.0" y="620.6" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="630.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged / spilled KV</text><rect x="230.0" y="620.6" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="247.0" y="630.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="661.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="652.6" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>