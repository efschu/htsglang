ll="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="343.4" width="150.0" height="5.2" fill="url(#hatch)" stroke="none"/><rect x="831.0" y="348.6" width="150.0" height="2.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="831.0" y="348.6" width="150.0" height="2.8" fill="url(#hatch)" stroke="none"/><rect x="831.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1070.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="1070.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · even TP=2</text><rect x="995.0" y="255.4" width="150.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="255.4" width="150.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1070.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights ½</text><rect x="995.0" y="305.4" width="150.0" height="38.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="305.4" width="150.0" height="38.0" fill="url(#hatch)" stroke="none"/><text x="1070.0" y="327.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV</text><rect x="995.0" y="343.4" width="150.0" height="5.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="343.4" width="150.0" height="5.2" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="348.6" width="150.0" height="2.8" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="348.6" width="150.0" height="2.8" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="383.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — solo-draft placement</text><rect x="40.0" y="389.4" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="389.4" width="166.3" height="32.0" rx="2" fill="#3f9fa0" stroke="#2b2b2b" stroke-width="1.0"/><text x="123.2" y="408.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#ffffff">~2–3 GB draft (embed/lm_head + draft KV)</text><rect x="206.3" y="389.4" width="427.7" height="32.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="40.0" y="440.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">Rung tags itemised (MEASURED): DFLASH_k16 662 · EAGLE_k3 634 · EAGLE_k2 554 MiB. KV budget cost of the</text><text x="40.0" y="454.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">cross-gate: ~282k vs ~524k tokens without it (MEASURED).</text><text x="40.0" y="481.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">Honest claim: robustness / no-regret on mixed streams, NOT a peak speedup — switching costs ~+5.7%</text><text x="40.0" y="494.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#333">systemic vs a single static drafter (MEASURED).</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">One fixed drafter, single residence — no cross-algo pool, no rung tags, no runtime routing. Assumed 24 GB</text><text x="686.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">card; whole upstream side estimated (not measured).</text><rect x="40.0" y="522.6" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="540.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork holds BOTH drafters resident plus the routing machinery (solo-draft pool 4.58 GiB + per-k rung tags) — more draft VRAM, but runtime-adaptive; homogeneous upstream TP=2 holds ONE</text><text x="54.0" y="555.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">fixed drafter — less draft VRAM, but no runtime choice. A capability / VRAM trade-off, not a verdict (upstream is not worse, just fixed).</text><text x="20.0" y="598.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="604.6" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="667.0" y="614.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP draft head / draft pool</text><rect x="20.0" y="620.6" width="12.0" height="12.0" rx="1" fill="#3f9fa0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="630.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">host-staged / spilled KV</text><rect x="230.0" y="620.6" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="247.0" y="630.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="661.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="652.6" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="652.6" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="662.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>