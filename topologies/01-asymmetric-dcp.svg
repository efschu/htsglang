<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 721" width="1320" height="721" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="721.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">1 — Asymmetric DCP = the KV / TOKEN axis: KV token-bands follow card VRAM, decoupled from the weight split</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Read this diagram for the KV bands (foreground); the weight shards are the constant grey background here. Fork on the rig vs a homogeneous upstream config for the same 27B workload.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left (measured): FP8-27B TP=3 + asymmetric-DCP, --rank-gpu-id 0,1,2 --rank-tp-ratio auto --rank-gpu-memory-mib 28591,16464,16464. The MESSAGE is the green KV bands: KV is split along the TOKEN axis</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">(374310 / 212109 / 212109 tokens) sized to each card's VRAM budget (28591:16464:16464 ≈ 1.74:1:1) — DECOUPLED from the weight ratio (12.7:8.0:8.0 ≈ 1.59:1:1, grey). Aggregate context grows with the cards</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">you already own: 735k tokens, 2.81x the hand-budget start.</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1d6b34">This is a DIFFERENT axis from Asymmetric TP (§2): §2 sizes the WEIGHT shards to card compute; §1 sizes the KV TOKENS to card VRAM. On the rig both run together — --rank-tp-ratio auto sets the asymmetric</text><text x="20.0" y="131.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1d6b34">TP weight split AND the asymmetric-DCP KV token split at once — so a rank's KV band is not tied to its weight shard.</text><text x="20.0" y="150.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): the natural homogeneous upstream config is 2 identical 24 GB cards at symmetric TP=2 (4 KV heads split 2/rank). TP=3 is not legal here — 4 KV heads are not divisible by 3. Upstream</text><text x="20.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">head-shards KV, so aggregate KV does not grow with added cards the way the token split does.</text><rect x="30.0" y="193.0" width="436.0" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="208.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — asymmetric-DCP: KV / TOKEN axis (KV foregrounded)</text><rect x="676.0" y="193.0" width="332.5" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="208.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — 2x identical 24 GB, symmetric TP=2</text><text x="183.0" y="251.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="183.0" y="263.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · 32.6 GB</text><rect x="113.0" y="270.0" width="140.0" height="50.8" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0"/><text x="183.0" y="298.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">weights (from TP split)</text><rect x="113.0" y="320.8" width="140.0" height="45.7" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="346.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV 374k tok ← card VRAM</text><rect x="113.0" y="320.8" width="140.0" height="45.7" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="113.0" y="366.5" width="140.0" height="2.2" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="368.7" width="140.0" height="1.6" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="370.3" width="140.0" height="3.2" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="113.0" y="373.5" width="140.0" height="26.9" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="183.0" y="390.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="113.0" y="270.0" width="140.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="337.0" y="299.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="337.0" y="311.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · 20.5 GB</text><rect x="267.0" y="318.4" width="140.0" height="32.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0"/><text x="337.0" y="337.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">weights (TP split)</text><rect x="267.0" y="350.4" width="140.0" height="25.9" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="366.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV 212k tok</text><rect x="267.0" y="350.4" width="140.0" height="25.9" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="267.0" y="376.3" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="378.2" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="267.0" y="381.3" width="140.0" height="19.1" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="394.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="267.0" y="318.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="491.0" y="299.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 3080</text><text x="491.0" y="311.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank2 · 20.5 GB</text><rect x="421.0" y="318.4" width="140.0" height="32.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0"/><text x="491.0" y="337.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">weights (TP split)</text><rect x="421.0" y="350.4" width="140.0" height="25.9" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="366.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV 212k tok</text><rect x="421.0" y="350.4" width="140.0" height="25.9" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="421.0" y="376.3" width="140.0" height="1.9" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="378.2" width="140.0" height="3.1" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><rect x="421.0" y="381.3" width="140.0" height="19.1" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="491.0" y="394.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="421.0" y="318.4" width="140.0" height="82.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="911.0" y="285.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="911.0" y="297.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · symmetric TP=2</text><rect x="841.0" y="304.4" width="140.0" height="50.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="304.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="332.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">weights ½</text><rect x="841.0" y="354.4" width="140.0" height="34.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="354.4" width="140.0" height="34.0" fill="url(#hatch)" stroke="none"/><text x="911.0" y="374.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV head-shard (2 of 4)</text><rect x="841.0" y="354.4" width="140.0" height="34.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="841.0" y="388.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="388.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="394.4" width="140.0" height="6.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="841.0" y="394.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="841.0" y="304.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="1065.0" y="285.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical 24 GB</text><text x="1065.0" y="297.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank1 · symmetric TP=2</text><rect x="995.0" y="304.4" width="140.0" height="50.0" rx="2" fill="#c3cad0" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="304.4" width="140.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="332.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.2" font-weight="normal" text-anchor="middle" fill="#5a636c">weights ½</text><rect x="995.0" y="354.4" width="140.0" height="34.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="354.4" width="140.0" height="34.0" fill="url(#hatch)" stroke="none"/><text x="1065.0" y="374.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV head-shard (2 of 4)</text><rect x="995.0" y="354.4" width="140.0" height="34.0" rx="2" fill="none" stroke="#12303a" stroke-width="2.6"/><rect x="995.0" y="388.4" width="140.0" height="6.0" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="388.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="394.4" width="140.0" height="6.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="995.0" y="394.4" width="140.0" height="6.0" fill="url(#hatch)" stroke="none"/><rect x="995.0" y="304.4" width="140.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="206.0" x2="660.0" y2="418.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="432.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#333">Host RAM (DDR) — no spill in this mode</text><rect x="40.0" y="438.4" width="594.0" height="32.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><rect x="40.0" y="438.4" width="594.0" height="32.0" rx="2" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="337.0" y="457.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a636c">not captured (low, no host tier)</text><text x="40.0" y="489.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">KV bands (green, foreground) + weights/GDN/ctx are MEASURED per rank; the weight shards are drawn GREY</text><text x="40.0" y="503.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">here because in this diagram they are the constant background, not the point. The KV token ratio tracks</text><text x="40.0" y="517.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">the MiB budget (1.74:1:1), NOT the weight ratio (1.59:1:1) — that gap is the decoupling. Exact host-RAM</text><text x="40.0" y="530.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">floor for this non-spill config was not captured.</text><text x="686.0" y="443.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Head-axis KV stores every token per head on each card, so aggregate KV does not grow with added cards the</text><text x="686.0" y="457.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">way the token-axis split does. Assumed card size named; not measured.</text><rect x="40.0" y="558.6" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="576.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork splits KV along the TOKEN axis, sized to each card's VRAM and DECOUPLED from the weight split, so aggregate context scales with the mismatched cards you already own; upstream</text><text x="54.0" y="591.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">symmetric-TP head-shards KV and needs identical cards whose KV-head count divides the rank count. (Contrast §2, which is about the WEIGHT axis; on the rig both run together.)</text><text x="20.0" y="634.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="640.6" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="650.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="640.6" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="650.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="640.6" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="650.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="640.6" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="667.0" y="650.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="656.6" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="37.0" y="666.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="697.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="688.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="698.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="688.6" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="688.5999999999999" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="698.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="688.6" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="698.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>