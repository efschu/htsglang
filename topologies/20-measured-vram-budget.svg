<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 446" width="1040" height="446" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1040.0" height="446.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">20 — Measured VRAM budget: components measured, KV is the remainder</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Per-rank absolute MiB budget from measured usage. Decisive setting: --rank-gpu-memory-mib + component registry (§10, implemented).</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Each rank gets an absolute MiB budget (not a fraction). The per-component usage — CUDA context, weight shard, resident experts, solo-draft pool, GDN state,</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">graph/workspace pools — is measured from a component registry after boot; the KV cache is sized as the measured remainder, and a logged split-hint vector</text><text x="20.0" y="97.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">converges over two boots. A corridor rule fails a card that has &lt; 400 MiB free or &gt; 1.5 GiB of net measured waste. Upstream sizes memory by a global fraction.</text><text x="135.0" y="140.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">one rank (3080)</text><text x="135.0" y="153.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#444">--rank-gpu-memory-mib (absolute)</text><rect x="60.0" y="162.0" width="150.0" height="104.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><rect x="60.0" y="162.0" width="150.0" height="7.3" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0"/><line x1="210.0" y1="165.6" x2="218.0" y2="165.6" stroke="#888" stroke-width="0.7"/><text x="221.0" y="168.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">CUDA context</text><rect x="60.0" y="169.3" width="150.0" height="12.5" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><line x1="210.0" y1="175.5" x2="218.0" y2="177.6" stroke="#888" stroke-width="0.7"/><text x="221.0" y="180.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">weight shard</text><rect x="60.0" y="181.8" width="150.0" height="17.7" rx="2" fill="#e08a2b" stroke="#2b2b2b" stroke-width="1.0"/><text x="135.0" y="193.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">resident experts</text><rect x="60.0" y="199.4" width="150.0" height="3.6" rx="2" fill="#c65b9b" stroke="#2b2b2b" stroke-width="1.0"/><line x1="210.0" y1="201.3" x2="218.0" y2="201.3" stroke="#888" stroke-width="0.7"/><text x="221.0" y="204.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">solo-draft pool</text><rect x="60.0" y="203.1" width="150.0" height="4.2" rx="2" fill="#c9b8e0" stroke="#2b2b2b" stroke-width="1.0"/><line x1="210.0" y1="205.2" x2="218.0" y2="213.3" stroke="#888" stroke-width="0.7"/><text x="221.0" y="216.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">GDN state</text><rect x="60.0" y="207.2" width="150.0" height="5.2" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><line x1="210.0" y1="209.8" x2="218.0" y2="225.3" stroke="#888" stroke-width="0.7"/><text x="221.0" y="228.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">graphs / workspace</text><rect x="60.0" y="212.4" width="150.0" height="51.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="135.0" y="233.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">KV cache</text><text x="135.0" y="246.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.6" font-weight="normal" text-anchor="middle" fill="#fff">= measured remainder</text><rect x="60.0" y="263.4" width="150.0" height="2.6" rx="2" fill="#d3dae1" stroke="#888" stroke-width="0.6"/><line x1="210.0" y1="264.4" x2="218.0" y2="264.4" stroke="#888" stroke-width="0.7"/><text x="221.0" y="267.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="start" fill="#333">safety rest ≥ 400 MiB</text><text x="340.0" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">Every component above is read from the measured component registry after boot + one short request (so pools and CUDA</text><text x="340.0" y="181.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">graphs are really allocated) — no hand-guessed values. KV cache is sized as what is LEFT after those measured</text><text x="340.0" y="195.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">components, within the absolute per-rank --rank-gpu-memory-mib ceiling (an absolute MiB budget, not a fraction of</text><text x="340.0" y="209.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">total or free VRAM).</text><text x="340.0" y="235.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">Two-boot convergence: the boot logs a per-rank KV-split hint vector; feeding it back on restart self-calibrates the</text><text x="340.0" y="249.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.4" font-weight="normal" text-anchor="start" fill="#333">split so the KV remainder lands on the safety rest.</text><rect x="340.0" y="277.4" width="670.0" height="62.0" rx="4" fill="#eef5ef" stroke="#1d6b34" stroke-width="1.3"/><text x="352.0" y="294.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="bold" text-anchor="start" fill="#1d6b34">Corridor rule (evaluated per card, Option A):</text><text x="352.0" y="310.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.8" font-weight="normal" text-anchor="start" fill="#1a1a1a">• fail if nvml_free &lt; 400 MiB (absolute floor)</text><text x="352.0" y="325.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.8" font-weight="normal" text-anchor="start" fill="#1a1a1a">• fail if (nvml_free − measured transients) &gt; 1.5 GiB (net waste)</text><text x="60.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#555">upstream: fraction-based mem-fraction-static /</text><text x="60.0" y="296.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.6" font-weight="normal" text-anchor="start" fill="#555">gpu-memory-utilization; no per-rank absolute MiB budget.</text><text x="20.0" y="381.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="387.4" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="397.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="210.0" y="387.4" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="227.0" y="397.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="400.0" y="387.4" width="12.0" height="12.0" rx="1" fill="#e08a2b" stroke="#333" stroke-width="0.8"/><text x="417.0" y="397.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">resident experts (MoE)</text><rect x="590.0" y="387.4" width="12.0" height="12.0" rx="1" fill="#98a2ab" stroke="#333" stroke-width="0.8"/><text x="607.0" y="397.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">CUDA context + overhead</text><rect x="20.0" y="403.4" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="37.0" y="413.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP / NEXTN draft head</text><rect x="210.0" y="403.4" width="12.0" height="12.0" rx="1" fill="#c9b8e0" stroke="#333" stroke-width="0.8"/><text x="227.0" y="413.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN recurrent state</text><rect x="400.0" y="403.4" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="417.0" y="413.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text></svg>