<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 596" width="1320" height="596" font-family="sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1320.0" height="596.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">9 — Fast-lane priority scheduling: a reserved slot class that preempts (and can spill a session)</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Fork on the rig vs upstream's generic priority scheduling. A scheduling behaviour, not a hardware-capacity split.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Left: --enable-fast-lane reserves a floor of heavy slots (--fast-lane-reserved-heavy-slots); a "lane":"fast" request preempts into the running batch by taking a reserved slot, and heavy-aging</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">(--fast-lane-heavy-aging-ms) prevents starvation. It composes with session KV spill: admitting a fast request can spill a normal session's KV to host. Default OFF — the default path is byte-unchanged.</text><text x="20.0" y="101.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Right (illustrative): upstream has a priority-scheduling subsystem the fork builds on (enable_priority_scheduling) but not this reserved-floor fast-lane class + KV-spill coupling; no distinct VRAM</text><text x="20.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">segment beyond the normal slot pool.</text><rect x="30.0" y="144.0" width="394.6" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — reserved fast-lane slot floor (default off)</text><rect x="676.0" y="144.0" width="284.2" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="687.0" y="159.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a5568">upstream — generic priority scheduling</text><text x="337.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTX 5090</text><text x="337.0" y="214.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">rank0 · slot/KV pool</text><rect x="262.0" y="221.0" width="150.0" height="50.8" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="249.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="262.0" y="271.8" width="150.0" height="2.2" rx="2" fill="#7d5ba6" stroke="#2b2b2b" stroke-width="1.0"/><rect x="262.0" y="274.0" width="150.0" height="44.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="299.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">normal KV slot pool</text><rect x="262.0" y="318.0" width="150.0" height="10.0" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="262.0" y="318.0" width="150.0" height="10.0" fill="url(#hatch)" stroke="none"/><text x="337.0" y="325.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="7.4" font-weight="normal" text-anchor="middle" fill="#1a1a1a">reserved heavy-slot floor (bytes est)</text><rect x="262.0" y="328.0" width="150.0" height="23.4" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0"/><text x="337.0" y="342.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">free</text><rect x="262.0" y="221.0" width="150.0" height="130.4" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><text x="988.0" y="236.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">identical card</text><text x="988.0" y="248.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.4" font-weight="normal" text-anchor="middle" fill="#555">normal slot pool</text><rect x="913.0" y="255.4" width="150.0" height="50.0" rx="2" fill="#3b6fb0" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="255.4" width="150.0" height="50.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="283.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">weights</text><rect x="913.0" y="305.4" width="150.0" height="36.0" rx="2" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="305.4" width="150.0" height="36.0" fill="url(#hatch)" stroke="none"/><text x="988.0" y="326.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#ffffff">KV slot pool (no reserved class)</text><rect x="913.0" y="341.4" width="150.0" height="4.8" rx="2" fill="#98a2ab" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="341.4" width="150.0" height="4.8" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="346.2" width="150.0" height="5.2" rx="2" fill="#d3dae1" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="913.0" y="346.2" width="150.0" height="5.2" fill="url(#hatch)" stroke="none"/><rect x="913.0" y="255.4" width="150.0" height="96.0" rx="2" fill="none" stroke="#222" stroke-width="1.6"/><line x1="660.0" y1="157.0" x2="660.0" y2="369.4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><text x="40.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">The reserved-heavy-slot floor's byte cost (reserved-slots x per-slot KV) was not separately</text><text x="40.0" y="408.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">registry-dumped — drawn ESTIMATED. Scheduling proofs (preempt correctly, restore held while a fast request</text><text x="40.0" y="422.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#1d6b34">waits) are behavioural; see the fast-lane mechanism diagram.</text><text x="686.0" y="394.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.3" font-weight="normal" text-anchor="start" fill="#4a5568">Generic priority scheduling, no reserved-floor / QoS-spill coupling. Not measured.</text><rect x="40.0" y="449.8" width="1250.0" height="48.0" rx="6" fill="#edf4f6" stroke="#2f6f8f" stroke-width="1.3"/><text x="54.0" y="467.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">Core — the fork adds a reserved fast-lane slot class that preempts and can spill a normal session to host; upstream offers generic priority scheduling without the reserved-floor / QoS-spill</text><text x="54.0" y="482.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.4" font-weight="bold" text-anchor="start" fill="#12303a">coupling — a scheduling-behaviour difference, not a hardware-capacity one.</text><text x="20.0" y="525.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#3b6fb0" stroke="#333" stroke-width="0.8"/><text x="37.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">model-weight shard</text><rect x="230.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="247.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">KV cache (on-GPU)</text><rect x="440.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#7d5ba6" stroke="#333" stroke-width="0.8"/><text x="457.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN / linear-attn layer</text><rect x="650.0" y="531.8" width="12.0" height="12.0" rx="1" fill="#d3dae1" stroke="#333" stroke-width="0.8"/><text x="667.0" y="541.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">free / reserve headroom</text><text x="20.0" y="572.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Evidence:</text><rect x="82.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#333" stroke-width="0.8"/><text x="100.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MEASURED (solid)</text><rect x="232.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#4a9d5b" stroke="#2b2b2b" stroke-width="1.0" stroke-dasharray="4 2"/><rect x="232" y="563.8" width="13" height="13" fill="url(#hatch)" stroke="none"/><text x="250.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">ESTIMATED (hatched + dashed)</text><rect x="464.0" y="563.8" width="13.0" height="13.0" rx="1" fill="#f4f5f6" stroke="#9aa3ac" stroke-width="1.0" stroke-dasharray="3 3"/><text x="482.0" y="573.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">UNKNOWN — not captured (empty)</text></svg>