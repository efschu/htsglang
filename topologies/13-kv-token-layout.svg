<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" width="1200" height="518" font-family="sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker><marker id="arrP" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#8a5a2b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#227a3a"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#c0504d"/></marker><marker id="arrB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3b6fb0"/></marker><marker id="arrV" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#7d5ba6"/></marker></defs><rect x="0.0" y="0.0" width="1200.0" height="518.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="20.0" y="26.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">13 — KV-cache arrangement: which rank holds which tokens, and where MTP sits</text><text x="20.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#555">Decisive setting: uneven-DCP token sharding (§1, shipped). GDN layers hold state, not KV.</text><text x="20.0" y="67.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">Only the 12 full-attention layers hold a KV cache; the fork splits it by TOKEN band across ranks (rank0 gets the largest band, matching its shard). The MTP draft head keeps its own</text><text x="20.0" y="82.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#333">small KV band on rank0. The 36 GDN layers hold a fixed recurrent state instead.</text><line x1="600.0" y1="123.0" x2="600.0" y2="447.0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="30.0" y="110.0" width="374.8" height="21.0" rx="5" fill="#e7f2ea" stroke="#1d6b34" stroke-width="1.3"/><text x="41.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1d6b34">htsglang — token-sharded KV (per full-attn layer)</text><rect x="620.0" y="110.0" width="353.2" height="21.0" rx="5" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/><text x="631.0" y="125.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#4a5568">upstream sglang — head-sharded / replicated KV</text><rect x="40.0" y="173.0" width="197.4" height="144.0" rx="2" fill="#cfe0f0" stroke="#ffffff" stroke-width="0"/><text x="138.7" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">rank0 tokens 0..t0</text><rect x="237.4" y="173.0" width="136.3" height="144.0" rx="2" fill="#d4ecd9" stroke="#ffffff" stroke-width="0"/><text x="305.6" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">rank1 t0..t1</text><rect x="373.7" y="173.0" width="136.3" height="144.0" rx="2" fill="#f5e3c7" stroke="#ffffff" stroke-width="0"/><text x="441.8" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333">rank2 t1..T</text><line x1="40.0" y1="173.0" x2="510.0" y2="173.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="185.0" x2="510.0" y2="185.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="197.0" x2="510.0" y2="197.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="209.0" x2="510.0" y2="209.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="221.0" x2="510.0" y2="221.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="233.0" x2="510.0" y2="233.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="245.0" x2="510.0" y2="245.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="257.0" x2="510.0" y2="257.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="269.0" x2="510.0" y2="269.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="281.0" x2="510.0" y2="281.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="293.0" x2="510.0" y2="293.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="305.0" x2="510.0" y2="305.0" stroke="#c8ccd0" stroke-width="0.6"/><line x1="40.0" y1="317.0" x2="510.0" y2="317.0" stroke="#c8ccd0" stroke-width="0.6"/><rect x="40.0" y="173.0" width="470.0" height="144.0" rx="2" fill="none" stroke="#222" stroke-width="1.4"/><text x="34.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="end" fill="#555">L47</text><text x="34.0" y="315.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="end" fill="#555">L3</text><text x="275.0" y="332.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#333">12 full-attention layers × (2 KV heads) — each rank owns a TOKEN band</text><rect x="40.0" y="343.0" width="197.4" height="16.0" rx="1.5" fill="#c65b9b" stroke="#2b2b2b" stroke-width="0.8"/><text x="138.7" y="353.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#fff">MTP draft KV (rank0)</text><text x="40.0" y="369.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">36 GDN layers: fixed recurrent state (no per-token growth)</text><rect x="40.0" y="373.0" width="197.4" height="16.0" rx="1.5" fill="#c9b8e0" stroke="#2b2b2b" stroke-width="0.8"/><text x="138.7" y="383.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">GDN state</text><rect x="237.4" y="373.0" width="136.3" height="16.0" rx="1.5" fill="#c9b8e0" stroke="#2b2b2b" stroke-width="0.8"/><text x="305.6" y="383.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">GDN state</text><rect x="373.7" y="373.0" width="136.3" height="16.0" rx="1.5" fill="#c9b8e0" stroke="#2b2b2b" stroke-width="0.8"/><text x="441.8" y="383.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="#1a1a1a">GDN state</text><text x="40.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">Per-rank KV memory = 12 layers × 2 KV heads × its token-band. Growing the</text><text x="40.0" y="429.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1d6b34">context adds tokens split 3 ways → aggregate KV capacity scales with ranks.</text><text x="640.0" y="168.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">Option A — head-shard (upstream default):</text><rect x="640.0" y="173.0" width="240.0" height="144.0" rx="2" fill="#e9d7d7" stroke="#222" stroke-width="1.2"/><text x="760.0" y="245.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#4a5568">2 KV heads / 3 ranks</text><text x="640.0" y="337.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">Option B — replicate KV on every rank:</text><rect x="640.0" y="345.0" width="120.0" height="34.0" rx="2" fill="#cfe0f0" stroke="#222" stroke-width="1.0"/><text x="700.0" y="366.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">ALL tokens</text><rect x="770.0" y="345.0" width="120.0" height="34.0" rx="2" fill="#cfe0f0" stroke="#222" stroke-width="1.0"/><text x="830.0" y="366.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">ALL tokens</text><rect x="900.0" y="345.0" width="120.0" height="34.0" rx="2" fill="#cfe0f0" stroke="#222" stroke-width="1.0"/><text x="960.0" y="366.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">ALL tokens</text><text x="640.0" y="401.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#4a5568">Every rank stores the WHOLE sequence's KV → 1× capacity,</text><text x="640.0" y="415.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#4a5568">no token-capacity gain from more cards. Even-TP dims: see diagram 11.</text><text x="20.0" y="469.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="start" fill="#333">Legend (colour meaning is identical in every diagram)</text><rect x="20.0" y="475.0" width="12.0" height="12.0" rx="1" fill="#2f6f8f" stroke="#333" stroke-width="0.8"/><text x="37.0" y="485.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">full-attention layer (KV)</text><rect x="210.0" y="475.0" width="12.0" height="12.0" rx="1" fill="#c9b8e0" stroke="#333" stroke-width="0.8"/><text x="227.0" y="485.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">GDN recurrent state</text><rect x="400.0" y="475.0" width="12.0" height="12.0" rx="1" fill="#c65b9b" stroke="#333" stroke-width="0.8"/><text x="417.0" y="485.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#333">MTP / NEXTN draft head</text></svg>