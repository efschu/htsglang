# VictoriaMetrics scrape config (Nutzer-Order 01.10. ~07:40Z: Server- und Performance-Daten dauerhaft
# in einer bestehenden Zeitreihen-DB; rigdash und spaetere Auswertungen lesen nur daraus, kein grep,
# kein Log-Parsing). Quelle im Repo: tools/rig_dashboard/rigdash/deploy/vm/scrape.yml;
# deploy/vm/install_vm.sh kopiert sie nach /etc/victoria-metrics/scrape.yml.
#
# Kardinalitaet: keine rid, kein Prompt, keine Boot-Tags als Label an Scrape-Zielen.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  # Host CT999 (LXC-Sicht: CPU, RAM, Platte, Netz)
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {host: ct999}
  # Proxmox-Host (Host-RAM, ZFS-ARC, PSI): node_exporter als einzelnes Binary auf 192.168.0.11:9100
  # (deploy/vm/node-exporter-proxmox.service), kein Router-/Container-Eingriff
  - job_name: node-proxmox
    static_configs:
      - targets: ["192.168.0.11:9100"]
        labels: {host: proxmox}
  # Karten per NVML (utkuozdemir/nvidia_gpu_exporter, nvml-Variante: kein nvidia-smi-Fork)
  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels: {host: ct999}
  # Serving-Front ueber den bestehenden Tunnel 127.0.0.1:30030 -> proxmox 127.0.0.1:31030.
  # Heute reicht die Front /metrics an die WACHE Gruppe durch (front.py PASSTHROUGH_GET), also
  # sglang:* von P ODER D. Mit dem Front-Commit "weg2 /metrics" (Liste an 27B, 01.10.) kommen P und D
  # gleichzeitig mit Label weg2_group und die weg2_*-Metriken der Front dazu.
  # Ziel-Label heisst scrape_via, nicht via: die Front exportiert weg2_ttft_seconds{via=after_p|d_direct|
  # d_single}, ein Ziel-Label "via" ueberschrieb das und verlor die TTFT-Aufteilung (27B-Abnahme 01.10.).
  - job_name: weg2-front
    scrape_interval: 15s      # schont die Front: ein GET je 15 s, durchgereicht an die wache Gruppe
    static_configs:
      - targets: ["127.0.0.1:30030"]
        labels: {scrape_via: tunnel30030}
