# Grafana neben VictoriaMetrics (Nutzer 01.10.: "Grafana darf direkt daneben laufen"). LAN :3000,
# anonym lesend (Nutzer 10.09.: LAN offen ohne Auth), kein CDN, keine Telemetrie, keine Update-Abfrage.
[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana-rig/provisioning

[server]
http_port = 3000
domain = 192.168.0.88
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[auth.anonymous]
enabled = true
org_role = Viewer

[security]
allow_embedding = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana-rig/dashboards/rig-verlauf.json

[users]
default_theme = system
default_language = de-DE
