[Service]
# CHECKPOINT SELECTION. Change MODEL here and `systemctl restart
# htsglang-ondemand`; nothing else needs editing. The two checkpoints on this
# machine are NOT interchangeable, and the reason is correctness, not taste:
#
#   Qwen3.6-35B-A3B-UD-Q4KM-noQ6K.gguf   DEFAULT. 22.7 GiB. Requantized by this
#       strand specifically to remove the Q6_K tensors this ROCm build cannot
#       dequantize correctly. It is the only checkpoint here proven to serve
#       coherent output.
#
#   /root/lh/models/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf   11.7 GiB, and DO NOT USE
#       for serving. It is tempting because it leaves ~15 GiB of headroom on a
#       29.5 GiB machine, but it carries IQ2_XS / IQ3_XXS / IQ4_XS tensors whose
#       mmq path is broken on this stack -- audited non-deterministic with
#       NON-FINITE outputs (worst|d| 6.5e+04, nonfin 131). Booting it also dies
#       at warmup with a HIP "unspecified launch failure" in the GGUF dequant
#       path, at 8.17 GiB free, i.e. with memory pressure ruled out. A smaller
#       quant is still the right idea for this machine, but it needs a requant
#       that avoids those types the way noQ6K did.
Environment=MODEL=/root/651-p2/models/Qwen3.6-35B-A3B-UD-Q4KM-noQ6K.gguf

# Sized for the Q4 checkpoint. See FINAL_651.md 9.1: on this APU the fraction
# is what converts free GTT into KV, and the viable band is narrow.
Environment=MEMFRAC=0.99
Environment=CTX=8192
Environment=HTSGLANG_MIN_KV_TOKENS=4096
