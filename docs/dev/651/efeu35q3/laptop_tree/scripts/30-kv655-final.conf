[Service]
# #655: the KV-pool lottery fix.
#
# The pool on this machine is a REMAINDER, not a budget. After the weights the
# loader has ~2.2 GB of MemAvailable to work with (this is an APU: sglang's
# is_integrated path reads psutil MemAvailable, not mem_get_info). Out of that
# come three posts before the KV pool sees a byte:
#   mem_fraction slack   pre x 0.01              ~0.25 GB
#   mamba state pool     auto-sized 13-18 slots  0.84-1.14 GB
#   GGUF dequant scratch #257, fixed             0.95 GB
# which leaves 0.00-0.37 GB. At 20218 B/token that remainder was the whole
# pool, so a 100 MB swing in the budget moved it by ~2700 tokens and 31% of
# loads (15 of 49 measured) were refused outright for having no KV memory left.
#
# The mamba pool is the one post that is oversized rather than required. The
# hard demand floor at --max-running-requests 1 with --disable-overlap-schedule
# is 4 slots (1 active + 1 ping-pong + 1 donation + 1 pinned checkpoint,
# mamba_pool_floor.py); auto-sizing was handing out 13-18. Pinning it to the
# floor returns ~0.7 GB to the remainder, which is ~9x what the pool needs for
# a full 8192-token context, so the remaining budget noise no longer reaches
# the pool at all.
#
# The cost is deliberate and bounded: _hybrid_kv_token_cap derives concurrency
# as max(max_running_requests, slots // mamba_ratio), so 4 slots caps the KV
# pool at 1 x context_len + 4 = 8196 tokens. That is exactly one full context,
# which is all a --max-running-requests 1 service can use at once; what is
# given up is cross-request mamba-state reuse, not context.
Environment=SNAP655_FILE=/root/651-p2/logs/kv655_snap.tsv
Environment=MAMBASLOTS=4
# KV stays at the model dtype. fp8_e4m3 halves the cell (20218 -> 10240 B/token,
# measured) but gfx1103 has no native fp8, and the fp8 specialization of
# extend_attention_fwd did not finish its Triton make_amdgcn compile in 25 min
# of startup warmup -- the server never reached its first prefill. See #655.
Environment=KVDTYPE=auto
