[Service]
# efeu-TP14 2026-10-01: Qwen3.8-35B-A3B-Distill Q3_K_M (empero-ai, 16845 MiB,
# SHA256 48a5197d...c4a9) on the 780M. Overrides 20-model.conf, 30-kv655.conf
# and 40-kt655.conf (drop-ins apply in lexical order; later Environment= wins).
#
# TO GO BACK to the Q4 Qwen3.6 service: /root/efeu35q3/switch_model.sh q4
# (renames this file to .disabled, daemon-reload, restart). Nothing of the old
# service was modified: its tree (/root/651-p2), boot script and drop-ins are
# byte-identical to before.
#
# WHAT IS DIFFERENT AND WHY (evidence: htsglang desk/efeu-35b-q3-fllliper-1001,
# docs/dev/651/efeu35q3/, plan /spinning/gpu-arb/docs/EFEU-35B-Q3-FLLIPER-PLAN-1001.md):
#  * boot_q38.sh runs the FIXED GGUF kernel build (/root/efeu35q3/ext_v2: no
#    real-true16, WARP_SIZE_GGUF) from a COPY of the serving tree
#    (/root/efeu35q3/sglang_src) -- the Q6_K "per-launch fault" was a
#    compiler miscompile, and the guard now refuses any nondeterminism.
#  * no kt CPU-expert offload: 17.4 GB of weights leave room, so decode graphs
#    are back on: 20.2 tok/s (balanced) instead of ~8.6.
#  * POWER_PROFILE=balanced while the model is loaded (low-power halves decode:
#    11.3 vs 20.2 tok/s); the previous profile is restored when it parks.
#  * chunked prefill 512 (measured clean: two sweeps + 11-min soak, 0 resets;
#    +7 % over 256; 1024 would add ~3 % and is NOT measured).
#  * fLLiper: the CPU-expert P layout (kt, 128 of 256 experts on the CPU)
#    measured +37 % prefill (2k: 156 vs 114 tok/s) but decode drops to 11.9
#    tok/s while it is active, and holding both layouts at once does not fit
#    in RAM; the served form is the D-optimal iGPU-solo layout. See the plan.
Environment=HTSGLANG_BOOT_SCRIPT=/root/efeu35q3/boot_q38.sh
Environment=MODEL=/root/efeu35q3/models/Qwen3.8-35B-A3B-Q3_K_M.gguf
Environment=TOKENIZER=/root/efeu35q3/hf
Environment=SERVED_NAME=qwen38-35b-a3b
Environment=CTX=131072
Environment=MEMFRAC=0.92
Environment=MAMBASLOTS=4
Environment=CHUNKED_PREFILL=512
Environment=WEDGE_CP_MEASURED=512
Environment=POWER_PROFILE=balanced
Environment=TOOLPARSER=qwen3_coder
Environment=HTSGLANG_MIN_KV_TOKENS=4096
# PERSISTENT PREFIX KV (user order 01.10.): HiCache L2 host staging + L3 file
# store on NVMe (/var/lib/hicache/kv, 46 GB ext4 loop image). A coding agent's
# ~20k-token system prompt costs 216 s of cold prefill; from L3 after a service
# restart (= every wake from park) it loads in ~5 s (measured: TTFT 5.31 s,
# "HiCache prefetch success loaded=19968"); a second turn and a new session
# with the same system prompt hit the device cache (1.3-1.7 s). Mamba/GDN state
# is anchored at chunk boundaries with the KV (UnifiedRadixCache KV+MAMBA).
# Greedy output from the L3-restored state is identical to a cold prefill.
Environment=HICACHE=1
Environment=HICACHE_RATIO=0.15
# 0.15 keeps the KV host staging pool (19662 tokens, 0.40 GB pinned) inside the
# pinned budget at 128k context, but the mamba host pool followed the same
# ratio: int(4 slots x 0.15) = 0 usable -> no GDN state backup -> evicted
# device nodes are deleted -> 0 prefix hits (operator, 15:08). Sized separately
# now (patched hybrid_pool_assembler.py): 1.0 = 4 slots x ~64 MB, the value the
# 13:59 acceptance hit with (16896 cached tokens).
Environment=SGLANG_HICACHE_MAMBA_HOST_RATIO=1.0
# ENERGY (user: nothing may spin while idle on a laptop). Measured loaded and
# idle: the scheduler thread busy-polls at 99.6 % CPU, package 15.5 W. The
# sleep-on-idle mechanism (IdleSleeper, zmq poll with a timeout ladder) is the
# same as --sleep-on-idle, reachable by env.
Environment=SGLANG_IDLE_BLOCKING_POLL=1
Environment="EXTRA=--hicache-storage-prefetch-policy wait_complete"
# kt offload off (40-kt655.conf sets these; empty = unset for boot_q38.sh)
Environment=KTMETHOD=
# The model now leaves ~5 GB of RAM to the desktop, so it may stay loaded
# longer: a cold load is ~3 min, which the 60 s window made the user pay often.
Environment=HTSGLANG_IDLE_PARK_SECONDS=600
Environment=HTSGLANG_WAKE_TIMEOUT_SECONDS=900
